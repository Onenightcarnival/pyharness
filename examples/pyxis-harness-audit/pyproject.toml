[project]
name = "pyxis-harness-audit"
version = "0.1.0"
description = "Example third-party bundle: tool-call audit log, tool denylist, /audit route"
license = "MIT"
requires-python = ">=3.12"
# Provided by the harness: pyxis-harness-core, pydantic, langchain-core, fastapi.
dependencies = []

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-audit = "pyxis_harness_audit"

[project.entry-points."pyxis_harness.bundles"]
audit = "pyxis_harness_audit:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_audit"]
