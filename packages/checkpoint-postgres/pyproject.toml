[project]
name = "pyharness-checkpoint-postgres"
version = "0.1.0"
description = "pyharness plugin: PostgreSQL checkpointer and store"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "langgraph-checkpoint-postgres>=3", "psycopg[binary]>=3.1", "psycopg-pool>=3.2"]

[project.entry-points."pyharness.plugins"]
pyharness-checkpoint-postgres = "pyharness_checkpoint_postgres"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyharness_checkpoint_postgres"]
