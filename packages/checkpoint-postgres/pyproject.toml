[project]
name = "pyharness-checkpoint-postgres"
version = "0.1.0"
description = "PyxisHarness plugin: PostgreSQL checkpointer and store"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "langgraph-checkpoint-postgres==3.2.0", "psycopg[binary]==3.3.6", "psycopg-pool==3.3.3"]

[project.entry-points."pyharness.plugins"]
pyharness-checkpoint-postgres = "pyharness_checkpoint_postgres"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_checkpoint_postgres"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_checkpoint_postgres/AGENTS.md"
