[project]
name = "pyxis-harness-checkpoint-postgres"
version = "0.1.1.dev3"
description = "PyxisHarness plugin: PostgreSQL checkpointer and store"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.1.dev3", "langgraph-checkpoint-postgres==3.2.0", "psycopg[binary]==3.3.6", "psycopg-pool==3.3.3"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-checkpoint-postgres = "pyxis_harness_checkpoint_postgres"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/checkpoint-postgres"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_checkpoint_postgres"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_checkpoint_postgres/AGENTS.md"
"../../LICENSE" = "pyxis_harness_checkpoint_postgres/LICENSE"
