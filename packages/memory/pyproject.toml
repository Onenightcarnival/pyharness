[project]
name = "pyxis-harness-memory"
version = "0.1.1.dev2"
description = "PyxisHarness plugin: layered career memory (profile, work, projects, lessons) with version history; memory_get / memory_save tools and the Memory page"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev2",
    "pyxis-harness-tools==0.1.1.dev2",
    "pyxis-harness-prompt==0.1.1.dev2",
    "pyxis-harness-http==0.1.1.dev2",
    "fastapi==0.162.0",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
    "pydantic==2.14.1",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-memory = "pyxis_harness_memory:MemoryService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/memory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_memory"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_memory/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
