[project]
name = "pyharness-memory"
version = "0.1.0"
description = "pyharness plugin: layered career memory (profile, work, projects, lessons) with version history; memory_get / memory_save tools and the Memory page"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-tools==0.1.0",
    "pyharness-prompt==0.1.0",
    "pyharness-http==0.1.0",
    "fastapi==0.162.0",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
    "pydantic==2.14.1",
]

[project.entry-points."pyharness.plugins"]
pyharness-memory = "pyharness_memory:MemoryService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_memory"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_memory/AGENTS.md"
