[project]
name = "pyxis-harness-ask-user"
version = "0.1.1.dev1"
description = "PyxisHarness plugin: ask_user_question tool — the agent pauses for the user's answer"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.1.dev1", "pyxis-harness-tools==0.1.1.dev1", "langchain-core==1.7.1", "langgraph==1.2.18"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-ask-user = "pyxis_harness_ask_user:AskUserService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/ask-user"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_ask_user"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_ask_user/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
