[project]
name = "pyharness-rdb"
version = "0.1.0"
description = "pyharness plugin: relational database workbench (SQLite / PostgreSQL / MySQL / GaussDB) with db_* tools and the Database page"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-tools==0.1.0",
    "pyharness-prompt==0.1.0",
    "pyharness-http==0.1.0",
    "fastapi==0.162.0",
    "langchain-core==1.7.1",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "pymysql==1.2.3",
]

[project.entry-points."pyharness.plugins"]
pyharness-rdb = "pyharness_rdb:RdbService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_rdb"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_rdb/AGENTS.md"
