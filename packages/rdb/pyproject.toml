[project]
name = "pyharness-rdb"
version = "0.1.0"
description = "pyharness plugin: relational database workbench (SQLite / PostgreSQL / MySQL / GaussDB) with db_* tools and the Database page"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "pyharness-tools", "pyharness-prompt", "pyharness-http", "fastapi>=0.115", "langchain-core>=1.0", "pydantic>=2", "psycopg[binary]>=3.1", "pymysql>=1.1"]

[project.entry-points."pyharness.plugins"]
pyharness-rdb = "pyharness_rdb:RdbService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyharness_rdb"]
