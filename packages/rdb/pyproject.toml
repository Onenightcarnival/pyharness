[project]
name = "pyxis-harness-rdb"
version = "0.1.1.dev2"
description = "PyxisHarness plugin: relational database workbench (SQLite / PostgreSQL / MySQL / GaussDB) with db_* tools and the Database page"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev2",
    "pyxis-harness-tools==0.1.1.dev2",
    "pyxis-harness-prompt==0.1.1.dev2",
    "pyxis-harness-http==0.1.1.dev2",
    "fastapi==0.162.0",
    "langchain-core==1.7.1",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "pymysql==1.2.3",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-rdb = "pyxis_harness_rdb:RdbService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/rdb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_rdb"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_rdb/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
