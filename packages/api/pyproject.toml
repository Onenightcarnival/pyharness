[project]
name = "pyxis-harness-api"
version = "0.1.0"
description = "PyxisHarness plugin: REST and SSE API under /api"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyxis-harness-core==0.1.0",
    "pyxis-harness-agent==0.1.0",
    "pyxis-harness-llm==0.1.0",
    "fastapi==0.162.0",
    "pygments==2.21.0",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-api = "pyxis_harness_api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_api"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_api/AGENTS.md"
