[project]
name = "pyharness-api"
version = "0.1.0"
description = "pyharness plugin: REST and SSE API under /api"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "pyharness-agent", "pyharness-llm", "fastapi>=0.110", "pygments>=2.14"]

[project.entry-points."pyharness.plugins"]
pyharness-api = "pyharness_api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_api"]
