[project]
name = "pyxis-harness-api"
version = "0.1.1.dev3"
description = "PyxisHarness plugin: REST and SSE API under /api"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev3",
    "pyxis-harness-agent==0.1.1.dev3",
    "pyxis-harness-llm==0.1.1.dev3",
    "fastapi==0.162.0",
    "pygments==2.21.0",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-api = "pyxis_harness_api"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_api"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_api/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
