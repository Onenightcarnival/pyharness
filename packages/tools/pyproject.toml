[project]
name = "pyxis-harness-tools"
version = "0.1.0"
description = "PyxisHarness plugin: tool registry, execution pipeline, approval gates (ctx.tools)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "langchain==1.4.7", "langchain-core==1.7.1"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-tools = "pyxis_harness_tools:ToolsService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_tools"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_tools/AGENTS.md"
