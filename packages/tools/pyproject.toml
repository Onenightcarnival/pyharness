[project]
name = "pyharness-tools"
version = "0.1.0"
description = "pyharness plugin: tool registry, execution pipeline, approval gates (ctx.tools)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "langchain==1.4.7", "langchain-core==1.7.1"]

[project.entry-points."pyharness.plugins"]
pyharness-tools = "pyharness_tools:ToolsService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_tools"]
