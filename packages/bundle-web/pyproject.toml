[project]
name = "pyxis-harness-bundle-web"
version = "0.1.0"
description = "PyxisHarness bundle: web_search (DeepSeek native search) and web_fetch tools; optional"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "pyxis-harness-web-tools==0.1.0"]

[project.entry-points."pyxis_harness.bundles"]
web = "pyxis_harness_bundle_web:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_bundle_web"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_bundle_web/AGENTS.md"
