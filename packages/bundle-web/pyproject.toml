[project]
name = "pyharness-bundle-web"
version = "0.1.0"
description = "pyharness bundle: web_search (DeepSeek native search) and web_fetch tools; optional"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "pyharness-web-tools==0.1.0"]

[project.entry-points."pyharness.bundles"]
web = "pyharness_bundle_web:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_bundle_web"]
