[project]
name = "pyxis-harness-bundle-web"
version = "0.1.1.dev5"
description = "PyxisHarness bundle: web_search (DeepSeek native search) and web_fetch tools; optional"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.1.dev5", "pyxis-harness-web-tools==0.1.1.dev5"]

[project.entry-points."pyxis_harness.bundles"]
web = "pyxis_harness_bundle_web:BUNDLE"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/bundle-web"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_bundle_web"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_bundle_web/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
