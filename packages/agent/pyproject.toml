[project]
name = "pyharness-agent"
version = "0.1.0"
description = "pyharness plugin: sessions, runs, approvals, resume (ctx.agents)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "langchain-core>=1.0", "langgraph>=1.0"]

[project.entry-points."pyharness.plugins"]
pyharness-agent = "pyharness_agent:AgentService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyharness_agent"]
