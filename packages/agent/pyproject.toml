[project]
name = "pyxis-harness-agent"
version = "0.1.0"
description = "PyxisHarness plugin: sessions, runs, approvals, resume (ctx.agents)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "pyxis-harness-llm==0.1.0", "langchain-core==1.7.1", "langgraph==1.2.18"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-agent = "pyxis_harness_agent:AgentService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_agent"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_agent/AGENTS.md"
