[project]
name = "pyharness-agent"
version = "0.1.0"
description = "PyxisHarness plugin: sessions, runs, approvals, resume (ctx.agents)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "pyharness-llm==0.1.0", "langchain-core==1.7.1", "langgraph==1.2.18"]

[project.entry-points."pyharness.plugins"]
pyharness-agent = "pyharness_agent:AgentService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_agent"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_agent/AGENTS.md"
