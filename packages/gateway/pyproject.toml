[project]
name = "pyharness-gateway"
version = "0.1.0"
description = "PyxisHarness plugin: local LLM API gateway over the configured model routes (OpenAI Chat Completions, OpenAI Responses, Anthropic Messages) with API keys and usage accounting"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-llm==0.1.0",
    "pyharness-http==0.1.0",
    "pyharness-web-ui==0.1.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "langchain-core==1.7.1",
]

[project.entry-points."pyharness.plugins"]
pyharness-gateway = "pyharness_gateway:GatewayService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_gateway/AGENTS.md"
