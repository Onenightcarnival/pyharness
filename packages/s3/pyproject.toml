[project]
name = "pyharness-s3"
version = "0.1.0"
description = "PyxisHarness plugin: S3-compatible object storage browser (MinIO / OSS / COS / R2 / AWS) with s3_* tools and the S3 page"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-tools==0.1.0",
    "pyharness-prompt==0.1.0",
    "pyharness-http==0.1.0",
    "fastapi==0.162.0",
    "langchain-core==1.7.1",
    "pydantic==2.14.1",
    "boto3==1.43.123",
]

[project.entry-points."pyharness.plugins"]
pyharness-s3 = "pyharness_s3:S3Service"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_s3"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_s3/AGENTS.md"
