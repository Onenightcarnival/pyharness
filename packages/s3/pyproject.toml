[project]
name = "pyxis-harness-s3"
version = "0.1.0rc1"
description = "PyxisHarness plugin: S3-compatible object storage browser (MinIO / OSS / COS / R2 / AWS) with s3_* tools and the S3 page"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.0rc1",
    "pyxis-harness-tools==0.1.0rc1",
    "pyxis-harness-prompt==0.1.0rc1",
    "pyxis-harness-http==0.1.0rc1",
    "fastapi==0.162.0",
    "langchain-core==1.7.1",
    "pydantic==2.14.1",
    "boto3==1.43.123",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-s3 = "pyxis_harness_s3:S3Service"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/s3"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_s3"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_s3/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
