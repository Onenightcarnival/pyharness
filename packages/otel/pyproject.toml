[project]
name = "pyharness-otel"
version = "0.1.0"
description = "pyharness plugin: OpenTelemetry GenAI export of agent turns (OTLP/HTTP, Langfuse) with the Settings → Observability page"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-http==0.1.0",
    "pyharness-web-ui==0.1.0",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.entry-points."pyharness.plugins"]
pyharness-otel = "pyharness_otel:OtelService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_otel"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_otel/AGENTS.md"
