[project]
name = "pyxis-harness-subscriptions"
version = "0.1.0"
description = "PyxisHarness plugin: Codex, ChatGPT, Google Antigravity and Grok subscriptions as model routes and tools, with the AI subscriptions page"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyxis-harness-core==0.1.0",
    "pyxis-harness-llm==0.1.0",
    "pyxis-harness-tools==0.1.0",
    "pyxis-harness-http==0.1.0",
    "pyxis-harness-web-ui==0.1.0",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
    "cryptography==50.0.2",
]

[project.entry-points."pyharness.plugins"]
pyxis-harness-subscriptions = "pyharness_subscriptions:SubscriptionsService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_subscriptions"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_subscriptions/AGENTS.md"
