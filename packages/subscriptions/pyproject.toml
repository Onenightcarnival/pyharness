[project]
name = "pyharness-subscriptions"
version = "0.1.0"
description = "pyharness plugin: Codex, ChatGPT, Google Antigravity and Grok subscriptions as model routes and tools, with the AI subscriptions page"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "pyharness-llm", "pyharness-tools", "pyharness-http", "pyharness-web-ui", "fastapi>=0.115", "pydantic>=2", "httpx>=0.27", "langchain-core>=1.0", "langgraph>=1.0", "cryptography>=42"]

[project.entry-points."pyharness.plugins"]
pyharness-subscriptions = "pyharness_subscriptions:SubscriptionsService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_subscriptions"]
