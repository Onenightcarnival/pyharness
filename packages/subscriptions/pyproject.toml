[project]
name = "pyxis-harness-subscriptions"
version = "0.1.0"
description = "PyxisHarness plugin: Codex, ChatGPT, Google Antigravity and Grok subscriptions as model routes and tools, with the AI subscriptions page"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.0",
    "pyxis-harness-llm==0.1.0",
    "pyxis-harness-tools==0.1.0",
    "pyxis-harness-http==0.1.0",
    "pyxis-harness-web-ui==0.1.0",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
    "cryptography==50.0.2",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-subscriptions = "pyxis_harness_subscriptions:SubscriptionsService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/subscriptions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_subscriptions"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_subscriptions/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
