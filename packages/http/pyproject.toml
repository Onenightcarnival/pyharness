[project]
name = "pyharness-http"
version = "0.1.0"
description = "PyxisHarness plugin: FastAPI application and uvicorn server (ctx.http)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "fastapi==0.162.0", "uvicorn==0.54.0"]

[project.entry-points."pyharness.plugins"]
pyharness-http = "pyharness_http:HttpService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_http"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_http/AGENTS.md"
