[project]
name = "pyxis-harness-http"
version = "0.1.0"
description = "PyxisHarness plugin: FastAPI application and uvicorn server (ctx.http)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "fastapi==0.162.0", "uvicorn==0.54.0"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-http = "pyxis_harness_http:HttpService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_http"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_http/AGENTS.md"
