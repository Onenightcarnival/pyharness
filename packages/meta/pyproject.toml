[project]
name = "pyxis-harness"
version = "0.1.0"
description = "PyxisHarness: an everything-is-a-plugin agent harness — the kernel with the base, toolkit, web and creator bundles"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyxis-harness-core==0.1.0",
    "pyxis-harness-bundle-base==0.1.0",
    "pyxis-harness-bundle-toolkit==0.1.0",
    "pyxis-harness-bundle-web==0.1.0",
    "pyxis-harness-bundle-creator==0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
