[project]
name = "pyxis-harness"
version = "0.1.1.dev3"
description = "PyxisHarness: an everything-is-a-plugin agent harness — the kernel with the base, toolkit, web and creator bundles"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev3",
    "pyxis-harness-bundle-base==0.1.1.dev3",
    "pyxis-harness-bundle-toolkit==0.1.1.dev3",
    "pyxis-harness-bundle-web==0.1.1.dev3",
    "pyxis-harness-bundle-creator==0.1.1.dev3",
]

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
