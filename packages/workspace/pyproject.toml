[project]
name = "pyharness-workspace"
version = "0.1.0"
description = "pyharness plugin: agent workspace and deepagents backend"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "deepagents==0.7.32"]

[project.entry-points."pyharness.plugins"]
pyharness-workspace = "pyharness_workspace"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_workspace"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_workspace/AGENTS.md"
