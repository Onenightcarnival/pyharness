[project]
name = "pyxis-harness-workspace"
version = "0.1.0"
description = "PyxisHarness plugin: agent workspace and deepagents backend"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "deepagents==0.7.32"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-workspace = "pyxis_harness_workspace"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_workspace"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_workspace/AGENTS.md"
