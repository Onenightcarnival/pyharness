[project]
name = "pyxis-harness-prompt"
version = "0.1.0"
description = "PyxisHarness plugin: ordered system-prompt sections (ctx.prompt)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0"]

[project.entry-points."pyharness.plugins"]
pyxis-harness-prompt = "pyharness_prompt:PromptService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_prompt"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_prompt/AGENTS.md"
