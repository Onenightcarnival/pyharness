[project]
name = "pyxis-harness-bundle-creator"
version = "0.1.1.dev1"
description = "PyxisHarness bundle: creator mode (plugin-authoring skills for the agent)"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.1.dev1", "pyxis-harness-plugin-manager==0.1.1.dev1"]

[project.entry-points."pyxis_harness.bundles"]
creator = "pyxis_harness_bundle_creator:BUNDLE"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/bundle-creator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_bundle_creator"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_bundle_creator/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
