[project]
name = "pyharness-bundle-creator"
version = "0.1.0"
description = "PyxisHarness bundle: creator mode (plugin-authoring skills for the agent)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "pyharness-plugin-manager==0.1.0"]

[project.entry-points."pyharness.bundles"]
creator = "pyharness_bundle_creator:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_bundle_creator"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_bundle_creator/AGENTS.md"
