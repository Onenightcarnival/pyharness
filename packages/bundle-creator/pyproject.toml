[project]
name = "pyxis-harness-bundle-creator"
version = "0.1.0"
description = "PyxisHarness bundle: creator mode (plugin-authoring skills for the agent)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "pyxis-harness-plugin-manager==0.1.0"]

[project.entry-points."pyxis_harness.bundles"]
creator = "pyxis_harness_bundle_creator:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_bundle_creator"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_bundle_creator/AGENTS.md"
