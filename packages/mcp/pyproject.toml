[project]
name = "pyxis-harness-mcp"
version = "0.1.0"
description = "PyxisHarness plugin: MCP servers as tools"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "pyxis-harness-tools==0.1.0", "langchain-core==1.7.1", "langchain-mcp-adapters==0.3.2"]

[project.entry-points."pyharness.plugins"]
pyxis-harness-mcp = "pyharness_mcp:MCPService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_mcp/AGENTS.md"
