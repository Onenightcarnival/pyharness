[project]
name = "pyharness-mcp"
version = "0.1.0"
description = "pyharness plugin: MCP servers as tools"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "pyharness-tools", "langchain-core>=1.0", "langchain-mcp-adapters>=0.3"]

[project.entry-points."pyharness.plugins"]
pyharness-mcp = "pyharness_mcp:MCPService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_mcp"]
