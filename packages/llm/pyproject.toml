[project]
name = "pyxis-harness-llm"
version = "0.1.0"
description = "PyxisHarness plugin: chat-model provider registry (ctx.llm)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyxis-harness-core==0.1.0",
    "langchain==1.4.7",
    "langchain-core==1.7.1",
    "langchain-openai==1.7.3",
    "httpx==0.28.1",
    "langchain-deepseek==1.1.1",
    "langchain-anthropic==1.7.7",
    "langchain-google-genai==4.4.2",
    "langchain-openrouter==0.2.9",
]

[project.entry-points."pyharness.plugins"]
pyxis-harness-llm = "pyharness_llm:LLMService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_llm"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_llm/AGENTS.md"
