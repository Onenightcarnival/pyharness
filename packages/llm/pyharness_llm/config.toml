# Provider catalog of pyharness-llm; loaded by catalog.py.
#
# [protocols.<id>]  wire protocols for custom endpoints: title, LangChain type, model options, models listing API
# presets           provider types the settings page offers; their integration packages are dependencies of this plugin
# [curated.<type>]  facts per LangChain provider type; a missing `models_api` means no model listing

presets = ["openai", "anthropic", "deepseek", "google_genai", "openrouter"]

[protocols.openai-chat]
title = "OpenAI Chat Completions"
type = "openai"
options = { use_responses_api = false }
models_api = "openai"

[protocols.openai-responses]
title = "OpenAI Responses"
type = "openai"
options = { use_responses_api = true }
models_api = "openai"

[protocols.anthropic-messages]
title = "Anthropic Messages"
type = "anthropic"
options = {}
models_api = "anthropic"

[curated.openai]
title = "OpenAI"
env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
models_api = "openai"

[curated.openrouter]
title = "OpenRouter"
env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
models_api = "openai"

[curated.azure_openai]
title = "Azure OpenAI"
env = "AZURE_OPENAI_API_KEY"
keys = { base_url = "azure_endpoint" }

[curated.anthropic]
title = "Anthropic"
env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
models_api = "anthropic"

[curated.deepseek]
title = "DeepSeek"
env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
models_api = "openai"
models = [
    { id = "deepseek-chat", name = "DeepSeek Chat" },
    { id = "deepseek-reasoner", name = "DeepSeek Reasoner" },
]

[curated.google_genai]
title = "Google Gemini"
env = "GOOGLE_API_KEY"
keys = { api_key = "google_api_key" }

[curated.google_vertexai]
title = "Google Vertex AI"
credentials = false

[curated.google_anthropic_vertex]
title = "Anthropic on Vertex AI"
credentials = false

[curated.bedrock]
title = "Amazon Bedrock"
credentials = false

[curated.bedrock_converse]
title = "Amazon Bedrock Converse"
credentials = false

[curated.anthropic_bedrock]
title = "Anthropic on Bedrock"
credentials = false

[curated.groq]
title = "Groq"
env = "GROQ_API_KEY"
base_url = "https://api.groq.com/openai/v1"
models_api = "openai"

[curated.mistralai]
