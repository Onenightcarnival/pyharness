# Provider catalog of pyharness-llm; loaded by catalog.py.
#
# [PROTOCOLS.<id>]  wire protocols for custom endpoints: title, LangChain type, model options, models listing API
# [failures]        failure code sets of failures.py
# PRESETS           provider types the settings page offers; their integration packages are dependencies of this plugin
# [CURATED.<type>]  facts per LangChain provider type; a missing `models_api` means no model listing

PRESETS = ["openai", "anthropic", "deepseek", "google_genai", "openrouter"]

[PROTOCOLS.openai-chat]
title = "OpenAI Chat Completions"
type = "openai"
options = { use_responses_api = false }
models_api = "openai"

[PROTOCOLS.openai-responses]
title = "OpenAI Responses"
type = "openai"
options = { use_responses_api = true }
models_api = "openai"

[PROTOCOLS.anthropic-messages]
title = "Anthropic Messages"
type = "anthropic"
options = {}
models_api = "anthropic"

[PROTOCOLS.gemini]
title = "Gemini API"
type = "google_genai"
options = {}
models_api = "google"

[failures]
# Codes a retry policy retries by default.
TRANSIENT_CODES = ["RATE_LIMIT", "SERVER", "TIMEOUT", "TRANSPORT"]
# Codes a settings form offers for a retry policy.
RETRY_CHOICES = ["RATE_LIMIT", "SERVER", "TIMEOUT", "TRANSPORT", "EMPTY_RESPONSE", "STREAM_CLOSED"]
# Codes after which a failed turn may be continued by hand; independent of the retry policy.
CONTINUABLE_CODES = ["RATE_LIMIT", "SERVER", "TIMEOUT", "TRANSPORT", "EMPTY_RESPONSE", "STREAM_CLOSED"]

[CURATED.openai]
title = "OpenAI"
env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
models_api = "openai"

[CURATED.openrouter]
title = "OpenRouter"
env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
models_api = "openai"

[CURATED.azure_openai]
title = "Azure OpenAI"
env = "AZURE_OPENAI_API_KEY"
keys = { base_url = "azure_endpoint" }

[CURATED.anthropic]
title = "Anthropic"
env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
models_api = "anthropic"

[CURATED.deepseek]
title = "DeepSeek"
env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
models_api = "openai"
models = [
    { id = "deepseek-chat", name = "DeepSeek Chat" },
    { id = "deepseek-reasoner", name = "DeepSeek Reasoner" },
]

