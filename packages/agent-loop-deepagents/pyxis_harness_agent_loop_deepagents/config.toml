[MODES.read-only]
title = "Read only"
description = "File tools read the workspace; writes and the shell are unavailable."

[MODES.workspace-write]
title = "Workspace write"
description = "File tools write inside the workspace; gated tools ask for approval."

[MODES.full-access]
title = "Full access"
description = "Workspace writes and the shell without approval prompts."

[DEFAULT_PRESETS.standard]
title = "Standard"
description = "Everyday work in the workspace: files, shell, subagents. Plugin management stays out of the way."
exclude_tools = ["plugin_manager", "harness_inspect"]
order = 1

[DEFAULT_PRESETS.creator]
title = "Creator"
description = "Standard plus harness inspection, plugin management and the plugin-authoring skills: extend the harness itself."
order = 2
