[project]
name = "pyharness-agent-loop-deepagents"
version = "0.1.0"
description = "PyxisHarness plugin: deepagents agent loop (ctx.agentLoop)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-tools==0.1.0",
    "pyharness-llm==0.1.0",
    "deepagents==0.7.32",
    "langchain==1.4.7",
    "langgraph==1.2.18",
]

[project.entry-points."pyharness.plugins"]
pyharness-agent-loop-deepagents = "pyharness_agent_loop_deepagents:DeepAgentsLoop"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_agent_loop_deepagents"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_agent_loop_deepagents/AGENTS.md"
