[project]
name = "pyxis-harness-agent-loop-deepagents"
version = "0.1.1.dev6"
description = "PyxisHarness plugin: deepagents agent loop (ctx.agentLoop)"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev6",
    "pyxis-harness-tools==0.1.1.dev6",
    "pyxis-harness-llm==0.1.1.dev6",
    "deepagents==0.7.32",
    "langchain==1.4.7",
    "langgraph==1.2.18",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-agent-loop-deepagents = "pyxis_harness_agent_loop_deepagents:DeepAgentsLoop"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/agent-loop-deepagents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_agent_loop_deepagents"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_agent_loop_deepagents/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
