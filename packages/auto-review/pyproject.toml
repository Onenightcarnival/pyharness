[project]
name = "pyxis-harness-auto-review"
version = "0.1.1.dev1"
description = "PyxisHarness plugin: Auto review permission mode — a model reviews each gated tool call before it runs"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev1",
    "pyxis-harness-agent-loop-deepagents==0.1.1.dev1",
    "pyxis-harness-llm==0.1.1.dev1",
    "langchain==1.4.7",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-auto-review = "pyxis_harness_auto_review"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/auto-review"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_auto_review"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_auto_review/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
