[project]
name = "pyharness-auto-review"
version = "0.1.0"
description = "pyharness plugin: Auto review permission mode — a model reviews each gated tool call before it runs"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-agent-loop-deepagents==0.1.0",
    "pyharness-llm==0.1.0",
    "langchain==1.4.7",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
]

[project.entry-points."pyharness.plugins"]
pyharness-auto-review = "pyharness_auto_review"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_auto_review"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_auto_review/AGENTS.md"
