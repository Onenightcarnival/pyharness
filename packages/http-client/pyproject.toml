[project]
name = "pyxis-harness-http-client"
version = "0.1.1.dev3"
description = "PyxisHarness plugin: HTTP API request tool (targets with injected auth, saved requests, history, event streams) with the http_* tools and the HTTP page"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev3",
    "pyxis-harness-tools==0.1.1.dev3",
    "pyxis-harness-prompt==0.1.1.dev3",
    "pyxis-harness-http==0.1.1.dev3",
    "pyxis-harness-web-ui==0.1.1.dev3",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain-core==1.7.1",
    "pydantic==2.14.1",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-http-client = "pyxis_harness_http_client:HttpClientService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/http-client"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_http_client"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_http_client/AGENTS.md"
"../../LICENSE" = "pyxis_harness_http_client/LICENSE"
