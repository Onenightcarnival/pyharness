[project]
name = "pyharness-http-client"
version = "0.1.0"
description = "pyharness plugin: HTTP API request tool (targets with injected auth, saved requests, history, event streams) with the http_* tools and the HTTP page"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-tools==0.1.0",
    "pyharness-prompt==0.1.0",
    "pyharness-http==0.1.0",
    "pyharness-web-ui==0.1.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain-core==1.7.1",
    "pydantic==2.14.1",
]

[project.entry-points."pyharness.plugins"]
pyharness-http-client = "pyharness_http_client:HttpClientService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_http_client"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_http_client/AGENTS.md"
