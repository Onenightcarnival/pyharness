[project]
name = "pyxis-harness-core"
version = "0.1.1.dev8"
description = "PyxisHarness kernel: service container, typed events, layered composition, generation lifecycle"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pydantic==2.14.1", "pyyaml==6.0.3", "packaging==26.3", "uv==0.13.6"]

[project.scripts]
pyh = "pyxis_harness.cli:main"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/core"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
