[project]
name = "pyharness-core"
version = "0.1.0"
description = "pyharness kernel: service container, typed events, layered composition, generation lifecycle"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1", "pyyaml==6.0.3", "packaging==26.3"]

[project.scripts]
pyh = "pyharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness"]
