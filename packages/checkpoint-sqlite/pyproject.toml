[project]
name = "pyharness-checkpoint-sqlite"
version = "0.1.0"
description = "pyharness plugin: SQLite checkpointer and store"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "langgraph-checkpoint-sqlite==3.1.2", "aiosqlite==0.22.1"]

[project.entry-points."pyharness.plugins"]
pyharness-checkpoint-sqlite = "pyharness_checkpoint_sqlite"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_checkpoint_sqlite"]
