[project]
name = "pyxis-harness-checkpoint-sqlite"
version = "0.1.1.dev3"
description = "PyxisHarness plugin: SQLite checkpointer and store"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.1.dev3", "langgraph-checkpoint-sqlite==3.1.2", "aiosqlite==0.22.1"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-checkpoint-sqlite = "pyxis_harness_checkpoint_sqlite"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/checkpoint-sqlite"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_checkpoint_sqlite"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_checkpoint_sqlite/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
