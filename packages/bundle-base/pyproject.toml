[project]
name = "pyharness-bundle-base"
version = "0.1.0"
description = "pyharness bundle: base plugin set"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-llm==0.1.0",
    "pyharness-tools==0.1.0",
    "pyharness-mcp==0.1.0",
    "pyharness-ask-user==0.1.0",
    "pyharness-prompt==0.1.0",
    "pyharness-agent==0.1.0",
    "pyharness-agent-loop-deepagents==0.1.0",
    "pyharness-compaction==0.1.0",
    "pyharness-checkpoint-sqlite==0.1.0",
    "pyharness-checkpoint-postgres==0.1.0",
    "pyharness-workspace==0.1.0",
    "pyharness-workspace-changes==0.1.0",
    "pyharness-http==0.1.0",
    "pyharness-api==0.1.0",
    "pyharness-web-ui==0.1.0",
    "pyharness-terminal==0.1.0",
    "pyharness-inspect==0.1.0",
    "pyharness-plugin-manager==0.1.0",
]

[project.entry-points."pyharness.bundles"]
base = "pyharness_bundle_base:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_bundle_base"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_bundle_base/AGENTS.md"
