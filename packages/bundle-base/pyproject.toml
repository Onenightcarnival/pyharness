[project]
name = "pyxis-harness-bundle-base"
version = "0.1.0"
description = "PyxisHarness bundle: base plugin set"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyxis-harness-core==0.1.0",
    "pyxis-harness-llm==0.1.0",
    "pyxis-harness-tools==0.1.0",
    "pyxis-harness-mcp==0.1.0",
    "pyxis-harness-ask-user==0.1.0",
    "pyxis-harness-auto-review==0.1.0",
    "pyxis-harness-prompt==0.1.0",
    "pyxis-harness-agent==0.1.0",
    "pyxis-harness-agent-loop-deepagents==0.1.0",
    "pyxis-harness-compaction==0.1.0",
    "pyxis-harness-checkpoint-sqlite==0.1.0",
    "pyxis-harness-checkpoint-postgres==0.1.0",
    "pyxis-harness-workspace==0.1.0",
    "pyxis-harness-workspace-changes==0.1.0",
    "pyxis-harness-http==0.1.0",
    "pyxis-harness-api==0.1.0",
    "pyxis-harness-web-ui==0.1.0",
    "pyxis-harness-terminal==0.1.0",
    "pyxis-harness-inspect==0.1.0",
    "pyxis-harness-plugin-manager==0.1.0",
]

[project.entry-points."pyharness.bundles"]
base = "pyharness_bundle_base:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_bundle_base"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_bundle_base/AGENTS.md"
