[project]
name = "pyxis-harness-bundle-base"
version = "0.1.1.dev6"
description = "PyxisHarness bundle: base plugin set"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev6",
    "pyxis-harness-llm==0.1.1.dev6",
    "pyxis-harness-tools==0.1.1.dev6",
    "pyxis-harness-mcp==0.1.1.dev6",
    "pyxis-harness-ask-user==0.1.1.dev6",
    "pyxis-harness-auto-review==0.1.1.dev6",
    "pyxis-harness-prompt==0.1.1.dev6",
    "pyxis-harness-agent==0.1.1.dev6",
    "pyxis-harness-agent-loop-deepagents==0.1.1.dev6",
    "pyxis-harness-compaction==0.1.1.dev6",
    "pyxis-harness-checkpoint-sqlite==0.1.1.dev6",
    "pyxis-harness-checkpoint-memory==0.1.1.dev6",
    "pyxis-harness-checkpoint-postgres==0.1.1.dev6",
    "pyxis-harness-workspace==0.1.1.dev6",
    "pyxis-harness-workspace-changes==0.1.1.dev6",
    "pyxis-harness-http==0.1.1.dev6",
    "pyxis-harness-api==0.1.1.dev6",
    "pyxis-harness-web-ui==0.1.1.dev6",
    "pyxis-harness-terminal==0.1.1.dev6",
    "pyxis-harness-inspect==0.1.1.dev6",
    "pyxis-harness-plugin-manager==0.1.1.dev6",
]

[project.entry-points."pyxis_harness.bundles"]
base = "pyxis_harness_bundle_base:BUNDLE"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/bundle-base"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_bundle_base"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_bundle_base/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
