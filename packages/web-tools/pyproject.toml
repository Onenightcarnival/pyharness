[project]
name = "pyxis-harness-web-tools"
version = "0.1.0rc4"
description = "PyxisHarness plugin: web_search through DeepSeek native search and web_fetch"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.0rc4", "pyxis-harness-tools==0.1.0rc4", "httpx==0.28.1", "langchain-core==1.7.1"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-web-tools = "pyxis_harness_web_tools:WebToolsService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/web-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_web_tools"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_web_tools/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
