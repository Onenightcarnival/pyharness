[project]
name = "pyxis-harness-inspect"
version = "0.1.0"
description = "PyxisHarness plugin: harness_inspect tool"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "pyxis-harness-tools==0.1.0", "langchain-core==1.7.1"]

[project.entry-points."pyharness.plugins"]
pyxis-harness-inspect = "pyharness_inspect"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_inspect"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_inspect/AGENTS.md"
