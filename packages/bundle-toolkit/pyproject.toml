[project]
name = "pyharness-bundle-toolkit"
version = "0.1.0"
description = "pyharness bundle: the toolkit (memory, databases, S3, skills, MCP page, subscriptions, OpenTelemetry, API gateway); built in"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0"]

[project.entry-points."pyharness.bundles"]
toolkit = "pyharness_bundle_toolkit:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_bundle_toolkit"]
