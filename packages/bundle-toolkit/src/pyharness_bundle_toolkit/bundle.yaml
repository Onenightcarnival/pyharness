title: Toolkit
description: Built-in toolkit; sidebar entries can be hidden in Settings → General.
builtin: true
patch:
  # Career memory (profile → work → project → lesson) with version history: ctx.memory, memory_get / memory_save, the Memory page.
  - id: memory
    name: pyharness-memory
    after: web-ui
  # Relational databases (SQLite / PostgreSQL / GaussDB / MySQL): ctx.rdb, db_* tools, the Database page.
  - id: rdb
    name: pyharness-rdb
    after: memory
  # S3-compatible object storage: ctx.s3, s3_* tools, the S3 page.
  - id: s3
    name: pyharness-s3
    after: rdb
  # Configuration center: the MCP page (connection test), user skills, the managed bun runtime.
  - id: config-center
    name: pyharness-config-center
    after: s3
  # OpenTelemetry export of turns (Settings → Observability): ctx.otel.
  - id: otel
    name: pyharness-otel
    after: config-center
