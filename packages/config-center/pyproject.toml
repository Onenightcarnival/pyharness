[project]
name = "pyharness-config-center"
version = "0.1.0"
description = "pyharness plugin: configuration center — MCP page with connection test, skills management, managed bun runtime for JS MCP servers"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "pyharness-http", "pyharness-web-ui", "pyharness-agent-loop-deepagents", "pyharness-mcp", "fastapi>=0.115", "pydantic>=2", "pyyaml>=6", "httpx>=0.27"]

[project.entry-points."pyharness.plugins"]
pyharness-config-center = "pyharness_config_center:ConfigCenterService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_config_center"]
