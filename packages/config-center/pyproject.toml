[project]
name = "pyxis-harness-config-center"
version = "0.1.1.dev3"
description = "PyxisHarness plugin: configuration center — MCP page with connection test, skills management, managed bun runtime for JS MCP servers"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.1.dev3",
    "pyxis-harness-http==0.1.1.dev3",
    "pyxis-harness-web-ui==0.1.1.dev3",
    "pyxis-harness-agent-loop-deepagents==0.1.1.dev3",
    "pyxis-harness-mcp==0.1.1.dev3",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-config-center = "pyxis_harness_config_center:ConfigCenterService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/config-center"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_config_center"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_config_center/AGENTS.md"
"../../LICENSE" = "pyxis_harness_config_center/LICENSE"
