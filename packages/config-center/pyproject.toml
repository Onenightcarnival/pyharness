[project]
name = "pyharness-config-center"
version = "0.1.0"
description = "PyxisHarness plugin: configuration center — MCP page with connection test, skills management, managed bun runtime for JS MCP servers"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyharness-core==0.1.0",
    "pyharness-http==0.1.0",
    "pyharness-web-ui==0.1.0",
    "pyharness-agent-loop-deepagents==0.1.0",
    "pyharness-mcp==0.1.0",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
]

[project.entry-points."pyharness.plugins"]
pyharness-config-center = "pyharness_config_center:ConfigCenterService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_config_center"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_config_center/AGENTS.md"
