[project]
name = "pyharness-workspace-changes"
version = "0.1.0"
description = "PyxisHarness plugin: files changed per turn, from git work-tree snapshots"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "pyharness-agent==0.1.0", "pyharness-workspace==0.1.0"]

[project.entry-points."pyharness.plugins"]
pyharness-workspace-changes = "pyharness_workspace_changes:WorkspaceChangesService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_workspace_changes"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_workspace_changes/AGENTS.md"
