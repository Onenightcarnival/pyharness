[project]
name = "pyxis-harness-workspace-changes"
version = "0.1.1.dev1"
description = "PyxisHarness plugin: files changed per turn, from git work-tree snapshots"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.1.dev1", "pyxis-harness-agent==0.1.1.dev1", "pyxis-harness-workspace==0.1.1.dev1"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-workspace-changes = "pyxis_harness_workspace_changes:WorkspaceChangesService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/workspace-changes"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_workspace_changes"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_workspace_changes/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
