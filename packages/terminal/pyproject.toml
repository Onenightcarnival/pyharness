[project]
name = "pyxis-harness-terminal"
version = "0.1.0rc2"
description = "PyxisHarness plugin: persistent bash tool, background jobs, PTY terminals for the Web UI"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyxis-harness-core==0.1.0rc2",
    "pyxis-harness-tools==0.1.0rc2",
    "pyxis-harness-http==0.1.0rc2",
    "fastapi==0.162.0",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
    "websockets==17.3",
]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-terminal = "pyxis_harness_terminal:TerminalService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/terminal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_terminal"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_terminal/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
