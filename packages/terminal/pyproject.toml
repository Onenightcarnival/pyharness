[project]
name = "pyxis-harness-terminal"
version = "0.1.0"
description = "PyxisHarness plugin: persistent bash tool, background jobs, PTY terminals for the Web UI"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyxis-harness-core==0.1.0",
    "pyxis-harness-tools==0.1.0",
    "pyxis-harness-http==0.1.0",
    "fastapi==0.162.0",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
    "websockets==17.3",
]

[project.entry-points."pyharness.plugins"]
pyxis-harness-terminal = "pyharness_terminal:TerminalService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_terminal"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_terminal/AGENTS.md"
