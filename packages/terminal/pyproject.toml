[project]
name = "pyharness-terminal"
version = "0.1.0"
description = "pyharness plugin: persistent bash tool, background jobs, PTY terminals for the Web UI"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "pyharness-tools", "pyharness-http", "fastapi>=0.115", "langchain-core>=1.0", "langgraph>=1.0", "websockets>=12"]

[project.entry-points."pyharness.plugins"]
pyharness-terminal = "pyharness_terminal:TerminalService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_terminal"]
