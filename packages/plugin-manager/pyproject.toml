[project]
name = "pyharness-plugin-manager"
version = "0.1.0"
description = "pyharness plugin: plugin_manager tool and plugin-authoring prompt section"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "pyharness-tools", "langchain>=1.0"]

[project.entry-points."pyharness.plugins"]
pyharness-plugin-manager = "pyharness_plugin_manager"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyharness_plugin_manager"]
