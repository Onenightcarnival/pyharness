[project]
name = "pyxis-harness-plugin-manager"
version = "0.1.1.dev7"
description = "PyxisHarness plugins: plugin_manager tool, plugin-authoring skills, dev-context prompt section"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.1.dev7", "pyxis-harness-tools==0.1.1.dev7", "langchain==1.4.7"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-plugin-manager = "pyxis_harness_plugin_manager"
pyxis-harness-dev-context = "pyxis_harness_plugin_manager.dev_context"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/plugin-manager"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_plugin_manager"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_plugin_manager/AGENTS.md"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
