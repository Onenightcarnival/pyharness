[project]
name = "pyharness-plugin-manager"
version = "0.1.0"
description = "pyharness plugins: plugin_manager tool, plugin-authoring skills, dev-context prompt section"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core==0.1.0", "pyharness-tools==0.1.0", "langchain==1.4.7"]

[project.entry-points."pyharness.plugins"]
pyharness-plugin-manager = "pyharness_plugin_manager"
pyharness-dev-context = "pyharness_plugin_manager.dev_context"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_plugin_manager"]
