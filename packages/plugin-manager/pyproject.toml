[project]
name = "pyxis-harness-plugin-manager"
version = "0.1.0"
description = "PyxisHarness plugins: plugin_manager tool, plugin-authoring skills, dev-context prompt section"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "pyxis-harness-tools==0.1.0", "langchain==1.4.7"]

[project.entry-points."pyharness.plugins"]
pyxis-harness-plugin-manager = "pyharness_plugin_manager"
pyxis-harness-dev-context = "pyharness_plugin_manager.dev_context"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_plugin_manager"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_plugin_manager/AGENTS.md"
