[project]
name = "__DIST__"
version = "0.1.0"
description = "__TITLE__"
requires-python = ">=3.12"
# Provided by the harness: pyxis-harness-core, pydantic, langchain-core, fastapi. Others: exact pins, "name==version".
dependencies = []

[project.entry-points."pyharness.plugins"]
__DIST__ = "__MODULE__"

[project.entry-points."pyharness.bundles"]
__BUNDLE__ = "__MODULE__:BUNDLE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["__MODULE__"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "__MODULE__/AGENTS.md"
