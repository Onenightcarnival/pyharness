<title>PyHarness</title>
<style>
/* Design tokens: DeepSeek Harness Web theme. Neutral-bluish scale, 0.5px hairlines,
   radius ladder 4–28, soft elevation. Token names: local to this page. */
:root {
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-panel: 28px;

  --bg-base: rgb(255 255 255);
  --sidebar-fill: rgb(249 250 251);
  --label-primary: rgb(15 17 21);
  --label-secondary: rgb(97 102 107);
  --label-tertiary: rgb(129 133 140);
  --label-caption: rgb(173 178 184);
  --label-inverted: rgb(255 255 255);
  --border-l1: rgba(0, 0, 0, 0.04);
  --border-l2: rgba(0, 0, 0, 0.1);
  --border-l3: rgba(0, 0, 0, 0.12);
  --border-l4: rgba(0, 0, 0, 0.16);
  --hover: rgba(38, 49, 72, 0.06);
  --active: rgba(38, 49, 72, 0.1);
  --hover-solid: rgb(241 243 245);
  --hover-danger: rgba(236, 19, 19, 0.05);
  --elevated-fill: rgb(255 255 255);
  --floating-hover: rgb(241 243 245);
  --input-major: rgb(255 255 255);
  --selector: rgb(245 246 247);
  --bubble: rgb(237 243 254);
  --info: rgb(65 118 230);
  --info-hover: rgb(122 170 255);
  --link: rgb(65 118 230);
  --primary-fill: rgb(15 17 21);
  --primary-hover: rgb(67 69 74);
  --primary-label: rgb(255 255 255);
  --code-block: rgb(249 250 251);
  --inline-code: rgb(250 250 250);
  --business-tertiary: rgb(228 237 253);
  --label-bluish: rgb(14 48 116);
  --warn: rgb(245 158 11);
  --warn-secondary: rgb(247 173 49);
  --warn-tertiary: rgb(254 245 231);
  --warn-label: rgb(221 134 41);
  --error: rgb(236 19 19);
  --success: rgb(34 197 94);
  --idle: rgb(212 212 212);
  --deep-diving: color-mix(in srgb, rgb(65 118 230) 70%, rgb(23 37 84));
  --shimmer: color-mix(in srgb, rgb(0 0 0) 30%, transparent);
  --scrollbar: rgb(229 229 229);
  --scrollbar-hover: rgb(212 212 212);
  --toast: rgb(53 54 56);
  --stroke-color: var(--border-l4);
  --shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, 0.02), 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --bg-layer-1: rgb(255 255 255); --bg-layer-2: rgb(255 255 255); --bg-layer-3: rgb(255 255 255);
  --module-platform: rgb(245 246 247);
  --label-dimmed: rgb(228 231 235);
  --nav-active: rgb(235 238 242); --nav-hover: rgb(241 243 245);
  --menu-fill: rgba(248, 249, 250, 0.58); --menu-blur: blur(40px) saturate(150%); --menu-group-fill: rgba(248, 249, 250, 0.94);
  --tooltip: rgb(44 44 46);
  --code-banner: rgb(249 250 251);
  --tip: rgb(245 246 247);
  --elev-stroke: var(--border-l4);
  --elev-soft: 0 0 0 0.5px var(--elev-stroke), 0 4px 16px 0 rgba(0, 0, 0, 0.03), 0 0 24px 0 rgba(0, 0, 0, 0.03);
  --elev-panel: 0 0 0 0.5px var(--elev-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.03), 0 0 16px 0 rgba(0, 0, 0, 0.02);
  --elev-prominent: 0 0 0 0.5px var(--elev-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --bg-base: rgb(21 21 23);
  --sidebar-fill: rgb(27 27 28);
  --label-primary: rgb(249 250 251);
  --label-secondary: rgb(207 211 214);
  --label-tertiary: rgb(173 178 184);
  --label-caption: rgb(129 133 140);
  --label-inverted: rgb(53 54 56);
  --border-l1: rgba(255, 255, 255, 0.06);
  --border-l2: rgba(255, 255, 255, 0.12);
  --border-l3: rgba(255, 255, 255, 0.16);
  --border-l4: rgba(255, 255, 255, 0.2);
  --hover: rgba(255, 255, 255, 0.08);
  --active: rgba(255, 255, 255, 0.14);
  --hover-solid: rgb(53 54 56);
  --hover-danger: rgba(242, 90, 90, 0.15);
  --elevated-fill: rgb(67 69 74);
  --floating-hover: rgb(53 54 56);
  --input-major: rgb(44 44 46);
  --selector: rgb(53 54 56);
  --bubble: rgb(44 44 46);
  --info: rgb(122 170 255);
  --info-hover: rgb(65 118 230);
  --link: rgb(122 170 255);
  --primary-fill: rgb(249 250 251);
  --primary-hover: rgb(235 238 242);
  --primary-label: rgb(15 17 21);
  --code-block: rgb(27 27 28);
  --inline-code: rgb(41 41 41);
  --business-tertiary: rgb(52 65 91);
  --label-bluish: rgb(249 250 251);
  --warn-tertiary: rgb(39 36 31);
  --error: rgb(242 90 90);
  --idle: rgb(84 85 87);
  --deep-diving: color-mix(in srgb, rgb(86 134 254) 55%, rgb(173 178 184));
  --shimmer: color-mix(in srgb, rgb(255 255 255) 45%, transparent);
  --scrollbar: rgb(60 60 61);
  --scrollbar-hover: rgb(84 85 87);
  --toast: rgb(67 69 74);
  --stroke-color: var(--border-l3);
  --bg-layer-1: rgb(35 35 36); --bg-layer-2: rgb(44 44 46); --bg-layer-3: rgb(53 54 56);
  --module-platform: rgb(53 54 56);
  --label-dimmed: rgb(67 69 74);
  --nav-active: rgb(67 69 74); --nav-hover: rgb(44 44 46);
  --menu-fill: rgba(67, 69, 74, 0.45); --menu-group-fill: rgba(48, 49, 54, 0.94);
  --tooltip: rgb(67 69 74);
  --code-banner: rgb(44 44 46);
  --tip: rgb(53 54 56);
  --elev-stroke: var(--border-l3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
*, *::before, *::after { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-base); color: var(--label-primary); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--info); outline-offset: -2px; }
svg { display: block; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
::-webkit-scrollbar-track { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
.elev-soft { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 4px 16px 0 rgba(0, 0, 0, 0.03), 0 0 24px 0 rgba(0, 0, 0, 0.03); }
.elev-panel { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 3px 8px 0 rgba(0, 0, 0, 0.03), 0 0 16px 0 rgba(0, 0, 0, 0.02); }
.elev-prominent { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05); }
@supports (corner-shape: superellipse(1.5)) { * { corner-shape: superellipse(1.5); } }

/* ---------- frame ---------- */
.frame { display: grid; grid-template-columns: 260px minmax(0, 1fr) 0px; height: 100%; transition: grid-template-columns 0.3s var(--ease); }
.frame[data-rightbar] { grid-template-columns: 260px minmax(0, 1fr) var(--rb-width, 380px); }
.frame[data-collapsed][data-rightbar] { grid-template-columns: 56px minmax(0, 1fr) var(--rb-width, 380px); }
.frame[data-resizing] { transition: none; user-select: none; }
.rightbar { position: relative; min-width: 0; display: flex; flex-direction: column; overflow: hidden; border-left: 0.5px solid var(--border-l3); background: var(--bg-base); }
.rightbar[hidden] { display: none; }
.rightbar[data-fullscreen] { position: fixed; inset: 0; z-index: 40; border-left: none; }
.rightbar[data-fullscreen] .rbHandle { display: none; }
.rbHandle { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 5; }
.rbHandle:hover { background: color-mix(in srgb, var(--info) 30%, transparent); }
.rbStrip { flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px 0 10px; border-bottom: 0.5px solid var(--border-l3); }
.rbTabs { flex: 1; display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.rbTabs::-webkit-scrollbar { display: none; }
.rbChip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 10px; border-radius: var(--r-sm); color: var(--label-secondary); font-size: 13px; white-space: nowrap; flex: 0 1 auto; min-width: 0; max-width: 200px; cursor: default; }
.rbChip[data-quiet] { padding-right: 10px; }
.rbChip .label { overflow: hidden; text-overflow: ellipsis; }
.rbChip .ico { width: 16px; height: 16px; flex: none; }
.rbChip[aria-selected='true'] { background: var(--hover); color: var(--label-primary); }
.rbChip .close { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px; background: transparent; color: var(--label-tertiary); opacity: 0; }
.rbChip:hover .close, .rbChip[aria-selected='true'] .close, .rbChip:focus-within .close { opacity: 1; }
.rbChip .close .ico { width: 12px; height: 12px; }
.rbAdd { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-tertiary); }
.rbTools { flex: none; display: flex; align-items: center; gap: 2px; }
.rbBody { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
.rbBody > * { flex: none; }
.rbBody > .fileTree, .rbBody > .docBody, .rbBody > .rbGuide, .rbBody > .rbScroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
.rbEmpty { padding: 24px 16px; font-size: 13px; color: var(--label-tertiary); }
.fileHead { position: relative; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px 0 12px; font: 12px/18px var(--mono); border-bottom: 0.5px solid var(--border-l2); }
.fileHead .headTools { display: flex; align-items: center; gap: 2px; flex: none; }
.fileHead .btn.sm { height: 24px; padding: 0 6px 0 8px; font-family: var(--font); }
.pathLabel { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; direction: rtl; text-align: left; color: var(--label-tertiary); }
.pathLabel bdi { unicode-bidi: isolate; direction: ltr; }
.pathLabel b { font-weight: 500; color: var(--label-primary); }
.pathLabel[data-overflow] { mask-image: linear-gradient(to right, transparent, #000 28px); }
.fileTree { padding: 4px 0 12px; }
.fileRow { display: flex; align-items: center; gap: 7px; width: 100%; height: 28px; padding: 0 12px; border: none; border-radius: 0; background: transparent; color: var(--label-primary); font-size: 13px; text-align: left; }
.fileRow .ico { width: 16px; height: 16px; flex: none; }
.fileRow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fileRow .size { font-size: 11px; color: var(--label-caption); font-variant-numeric: tabular-nums; }
.fileRow[data-hidden] { color: var(--label-tertiary); }
.fileNote { display: flex; align-items: center; min-height: 28px; padding: 0 12px; font-size: 12px; color: var(--label-tertiary); }
.fileNote[data-tone='error'] { color: var(--error); }
.fileNote[data-tone='warn'] { color: var(--warn-label); padding: 8px 14px; }
.fileHead .iconButton[aria-pressed='true'] { color: var(--label-primary); }
.fileSearch { position: relative; flex: none; display: flex; align-items: center; padding: 8px 10px 4px; }
.fileSearch .input { height: 30px; padding: 0 30px; font-size: 13px; }
.fileSearch > .ico { position: absolute; left: 19px; width: 14px; height: 14px; color: var(--label-tertiary); pointer-events: none; }
.fileSearch .iconButton { position: absolute; right: 14px; width: 22px; height: 22px; }
.fileStatus { flex: none; min-height: 24px; }
.fileRow mark { border-radius: 3px; background: color-mix(in srgb, var(--info) 24%, transparent); color: inherit; }
.fileRow[data-context] .name { color: var(--label-secondary); }
.fileRow:focus-visible { background: var(--hover); }
.ft-folder { color: #e3a93a; } .ft-md { color: var(--info); } .ft-code { color: #c9a227; } .ft-data { color: #d9674b; } .ft-image { color: #9b6fd3; } .ft-text, .ft-bin { color: var(--label-tertiary); }
.docMd { padding: 14px 16px 24px; }
.docCode { padding: 8px 10px; }
.docCode .codeBlock { margin: 0; }
.docCode[data-wrap] pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.filePreview { margin: 0; padding: 12px 14px; font: 12px/19px var(--mono); white-space: pre; overflow: auto; color: var(--label-primary); }
.filePreview[data-wrap] { white-space: pre-wrap; overflow-wrap: anywhere; }
.docImage { padding: 16px; display: flex; justify-content: center; }
.docImage img { max-width: 100%; height: auto; border-radius: var(--r-md); }
.docEmpty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px; color: var(--label-tertiary); font-size: 13px; text-align: center; }
.docEmpty .ico { width: 32px; height: 32px; }
.docEmpty p { margin: 0; }
.rbGuide { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px 16px; }
.guideMark { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; color: var(--label-caption); box-shadow: inset 0 0 0 0.5px var(--border-l4); }
.guideMark .ico { width: 22px; height: 22px; }
.guideCards { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 8px; }
.guideCard { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border: none; border-radius: 20px; background: color-mix(in srgb, var(--label-primary) 4%, transparent); color: inherit; text-align: left; }
.guideCard .ico { width: 20px; height: 20px; flex: none; }
.guideMain { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.guideTitle { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--label-primary); }
.guideDesc { font-size: 12px; line-height: 16px; color: var(--label-tertiary); }
.fileHead .menu.rbMenu { top: calc(100% + 4px); bottom: auto; right: 8px; left: auto; min-width: 160px; }
.kvTable { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 14px; font-size: 13px; }
.kvTable dt { color: var(--label-tertiary); } .kvTable dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
pre.hl, code.hl { color: inherit; }
.turnTail { width: 100%; margin: 6px 0 10px; }
.changesCard { border-radius: 16px; box-shadow: inset 0 0 0 0.5px var(--border-l3); overflow: hidden; }
.changesHead { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: none; background: transparent; color: var(--label-primary); font-size: 13px; text-align: left; }
.changesHead .iconBox { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 10px; background: color-mix(in srgb, var(--label-primary) 5%, transparent); box-shadow: inset 0 0 0 0.5px var(--border-l3); flex: none; }
.changesHead .iconBox .ico { width: 16px; height: 16px; }
.changesTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.changesHead .hint { display: none; font-size: 12px; color: var(--label-tertiary); white-space: nowrap; }
.changesHead:hover .stat, .changesHead:focus-visible .stat { display: none; }
.changesHead:hover .hint, .changesHead:focus-visible .hint { display: inline; }
.stat { font: 12px/18px var(--mono); white-space: nowrap; color: var(--label-tertiary); }
.stat .plus { color: var(--success); } .stat .minus { color: var(--error); }
.changesRows { border-top: 0.5px solid var(--border-l2); }
.changesRow { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 14px; border: none; background: transparent; color: var(--label-primary); font-size: 13px; text-align: left; }
.changesRow .ico { width: 16px; height: 16px; flex: none; }
.changesRow .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.changesRow[hidden] { display: none; }
.changesMore { width: 100%; height: 30px; border: none; border-top: 0.5px solid var(--border-l2); background: transparent; color: var(--label-tertiary); font-size: 12px; }
.changesSelect { flex: 1 1 auto; min-width: 0; height: 26px; padding: 0 26px 0 8px; font: 12px var(--mono); }
.diffScroll { overflow: auto; padding: 6px 0 16px; }
.diffNote { padding: 6px 14px; font-size: 12px; color: var(--label-tertiary); }
table.diff { min-width: 100%; border-collapse: collapse; font: 12px/20px var(--mono); }
table.diff td { padding: 0; vertical-align: top; }
table.diff td.no { width: 40px; min-width: 40px; padding: 0 8px 0 4px; text-align: right; color: var(--label-caption); user-select: none; white-space: nowrap; }
table.diff td.code { padding: 0 12px 0 2px; white-space: pre; }
table.diff[data-wrap] td.code { white-space: pre-wrap; overflow-wrap: anywhere; }
table.diff[data-split] { table-layout: fixed; width: 100%; min-width: 0; }
table.diff[data-split] td.code { width: auto; overflow: hidden; }
table.diff col.colNo { width: 40px; }
table.diff .sign { display: inline-block; width: 12px; color: var(--label-caption); user-select: none; }
table.diff tr.k-add td.code, table.diff td.code.k-add { background: color-mix(in srgb, var(--success) 10%, transparent); }
table.diff tr.k-add td.no, table.diff td.no.k-add { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
table.diff tr.k-add .sign, table.diff td.k-add .sign { color: var(--success); }
table.diff tr.k-del td.code, table.diff td.code.k-del { background: color-mix(in srgb, var(--error) 10%, transparent); }
table.diff tr.k-del td.no, table.diff td.no.k-del { background: color-mix(in srgb, var(--error) 18%, transparent); color: var(--error); }
table.diff tr.k-del .sign, table.diff td.k-del .sign { color: var(--error); }
table.diff td.k-empty { background: color-mix(in srgb, var(--label-primary) 3%, transparent); }
table.diff tr.hunk td { padding: 3px 12px; background: color-mix(in srgb, var(--info) 8%, transparent); color: var(--label-tertiary); font-size: 11px; white-space: nowrap; }
.turn { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.process { display: flex; flex-direction: column; min-width: 0; }
.process[data-empty] { display: none; }
.processHead { display: flex; align-items: center; gap: 0; height: 24px; padding: 0; border: none; background: none; color: var(--label-tertiary); font-size: 13px; line-height: 24px; text-align: left; }
.processHead .lead { margin-right: 6px; }
.processHead .chev { margin-left: 6px; width: 12px; height: 12px; }
.processHead .lead { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; flex: none; }
.processHead .ico { width: 14px; height: 14px; }
.processHead .chev { opacity: 0; transition: transform 0.15s var(--ease); }
.process:hover .processHead .chev, .process[data-open] .processHead .chev { opacity: 1; }
.process[data-open] .processHead .chev { transform: rotate(90deg); }
.processHead[data-state='running'] { color: var(--deep-diving); }
.processHead[data-state='error'] .lead { color: var(--error); }
.processHead[data-state='interrupted'] .lead { color: var(--warn); }
.processBody { display: none; flex-direction: column; gap: 6px; }
.process[data-open] .processBody { display: flex; }
html[data-work='compact'] .processBody .reasoning { display: none; }
.turnUsage { display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0; border: none; background: none; color: var(--label-caption); font: 12px/16px var(--mono); font-variant-numeric: tabular-nums; text-align: left; }
.turnUsage .ico { width: 12px; height: 12px; }
.turnUsageDetail { display: none; grid-template-columns: auto 1fr; gap: 2px 14px; padding: 4px 0 6px; font: 11px/16px var(--mono); color: var(--label-tertiary); }
.turnUsageDetail[data-open] { display: grid; }
.statsRow { position: relative; width: 100%; max-width: calc(var(--chat-width) + 32px); display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 26px; padding: 4px 6px 0; }
.statsRow[hidden] { display: none; }
.statChip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: none; border-radius: 999px; background: transparent; color: var(--label-tertiary); font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.statChip .ico { width: 12px; height: 12px; }
.statChip .ring { width: 14px; height: 14px; }
.statChip[data-static] { cursor: default; }
.statPop { top: auto; bottom: calc(100% + 6px); left: 4px; right: auto; min-width: 264px; padding: 10px 8px 8px; }
.statPop .menuGroup { padding: 0 8px 6px; font-size: 12px; }
.statPop .kv { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 8px; font-size: 12px; color: var(--label-secondary); }
.statPop .kv b { font: 12px var(--mono); font-weight: 500; color: var(--label-primary); }
.viewTabs { display: flex; align-items: flex-start; gap: 32px; min-height: 25px; margin: 10px 0 0 8px; }
.viewTabs[hidden] { display: none; }
.viewTab { position: relative; height: 25px; padding: 0 0 9px; border: none; border-radius: 0; background: transparent; color: var(--label-tertiary); font-size: 13px; font-weight: 500; line-height: 16px; }
.viewTab::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: transparent; }
.viewTab[aria-selected='true'] { color: var(--info); }

.codeBlock { margin: 16px 0; border-radius: var(--r-lg); background: var(--code-block); font: 11px/19px var(--mono); }
.codeBanner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px 0 22px; font: 11px/18px var(--font); color: var(--label-secondary); }
.codeBanner .lang { font-family: var(--mono); color: var(--label-tertiary); }
.codeBanner button { border: none; background: none; padding: 0; color: var(--label-tertiary); display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
.codeBlock pre { margin: 0; padding: 6px 22px 20px; overflow-x: auto; font: 11px/19px var(--mono); white-space: pre; }
.codeBlock[data-diff] pre { padding-left: 0; padding-right: 0; }
.codeBlock[data-diff] code { display: inline-block; min-width: 100%; vertical-align: top; }
.codeBlock[data-diff] .dl { display: block; padding: 0 22px; }
.codeBlock[data-diff] .dl[data-k='add'] { background: color-mix(in srgb, var(--success) 14%, transparent); }
.codeBlock[data-diff] .dl[data-k='del'] { background: color-mix(in srgb, var(--error) 11%, transparent); }
.codeBlock[data-diff] .dl[data-k='hunk'] { background: color-mix(in srgb, var(--info) 8%, transparent); color: var(--info); }
.codeBlock[data-diff] .dl[data-k='meta'] { color: var(--label-tertiary); }
.math math { font-family: 'STIX Two Math', 'Cambria Math', 'Latin Modern Math', 'Noto Sans Math', 'STIX Math', math; font-size: 1.15em; }
.math mtable[columnalign^='right left'] > mtr > mtd:nth-child(odd) { padding-right: 0; text-align: right; }
.math mtable[columnalign^='right left'] > mtr > mtd:nth-child(even) { padding-left: 0; text-align: left; }
.math mtable[columnalign^='left'] > mtr > mtd { text-align: left; }
.math[data-display] { display: block; margin: 16px 0; overflow-x: auto; overflow-y: hidden; text-align: center; }
.math[data-display] > code { display: block; padding: 10px 14px; border-radius: var(--r-md); background: var(--code-block); font: 11px/19px var(--mono); white-space: pre-wrap; text-align: left; }
.compact .math[data-display] { margin: 4px 0; }
.compact { font-size: 13px; line-height: 20px; color: var(--label-tertiary); }
.compact p, .compact ul, .compact ol, .compact blockquote { margin: 4px 0; }
.compact h1, .compact h2, .compact h3, .compact h4 { margin: 8px 0 4px; font: inherit; font-weight: 600; }
.compact .codeBlock { margin: 4px 0; }

/* disclosure rows (tools, reasoning) */
.disclosure { display: flex; flex-direction: column; min-width: 0; }
.drow { position: relative; display: flex; align-items: center; height: 24px; min-width: 0; padding: 0; border: none; background: none; color: var(--label-tertiary); text-align: left; width: 100%; }
.drow .lead { position: relative; flex: none; width: 16px; height: 16px; margin-right: 6px; display: inline-flex; align-items: center; justify-content: center; }
.drow .lead .ico { width: 14px; height: 14px; }
.drow .lead .chevron { position: absolute; inset: 0; margin: auto; opacity: 0; transition: transform 0.15s var(--ease); }
.disclosure[data-open] .drow .lead .chevron { transform: rotate(90deg); }
.drow .dtitle { flex: none; font-size: 13px; line-height: 24px; }
.drow .sep { flex: none; width: 2px; height: 2px; margin: 0 8px; border-radius: 1px; background: var(--label-caption); }
.drow .summary { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 24px; }
.drow[data-state='error'] .summary { color: var(--error); }
.drow[data-state='rejected'] .summary { color: var(--warn-label); }
.drow[data-state='waiting'] .leadIcon { color: var(--warn); }
.dbody { display: none; }
.disclosure[data-open] .dbody { display: block; }
.ioCard { display: flex; flex-direction: column; margin: 4px 0 6px 4px; border: 0.5px solid var(--border-l1); border-radius: var(--r-lg); background: var(--code-block); font: 11px/16px var(--mono); overflow: hidden; }
.ioSection { display: grid; grid-template-columns: 48px 1fr; align-items: baseline; padding: 12px 16px; max-height: 180px; overflow-y: auto; }
.ioLabel { color: var(--label-caption); font-family: var(--font); position: sticky; top: 0; align-self: start; }
.ioText { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--label-secondary); }
.ioText[data-error] { color: var(--error); }
.ioDivider { height: 0.5px; background: var(--border-l2); }
.reasoningBody { padding: 4px 0 4px 22px; }
.spin { animation: spin 0.9s linear infinite; transform-origin: center; }
.running { display: inline-flex; align-items: center; gap: 6px; height: 28px; margin-top: 4px; color: var(--deep-diving); font-size: 12px; }
.shimmer { background: linear-gradient(90deg, var(--deep-diving) 0%, var(--deep-diving) 40%, var(--shimmer) 50%, var(--deep-diving) 60%, var(--deep-diving) 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sweep 2.2s linear infinite; }

/* composer */
.composerSeat { flex: none; position: relative; bottom: auto; display: flex; flex-direction: column; align-items: center; padding: 0 16px 12px; background: linear-gradient(180deg, color-mix(in srgb, var(--bg-base) 0%, transparent) 0, var(--bg-base) 36px); }
.conversation[data-phase='hero'] .composerSeat { position: static; background: none; padding: 0; }
.conversation[data-phase='hero'] .card { max-width: none; }
#approval { width: 100%; display: flex; flex-direction: column; align-items: center; }
.conversation[data-phase='hero'] .hero .composerSlot { display: contents; }
.notice { width: 100%; max-width: calc(var(--chat-width) + 32px); margin-bottom: 6px; padding: 4px 8px; border-radius: var(--r-md); background: var(--hover); color: var(--label-secondary); font-size: 12px; line-height: 18px; display: flex; align-items: center; gap: 6px; }
.notice[hidden] { display: none; }
.card { position: relative; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: calc(var(--chat-width) + 32px); padding-top: 8px; border-radius: var(--r-panel); background: var(--input-major); --stroke-color: var(--border-l2); }
.card textarea { display: block; width: 100%; min-height: 36px; max-height: 336px; resize: none; border: none; outline: none; background: transparent; padding: 4px 14px 0; color: var(--label-primary); font: 14px/24px var(--font); overflow-y: auto; }
.card textarea::placeholder { color: var(--label-caption); }
.conversation[data-phase='hero'] .card textarea { min-height: 52px; }
.cardRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 8px 6px; min-width: 0; }
.cardRow .left, .cardRow .right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cardRow .left { flex: 1 1 auto; overflow: hidden; }
.cardRow .left .selectChip { flex: 0 1 auto; min-width: 28px; }
.cardRow .right { margin-left: auto; flex: none; max-width: 55%; }
.cardRow .right #modelChip { flex: 0 1 auto; min-width: 60px; }
.selectChip { display: inline-flex; align-items: center; gap: 4px; max-width: 240px; height: 28px; padding: 0 6px 0 8px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-secondary); font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.selectChip .label { overflow: hidden; text-overflow: ellipsis; }
.selectChip .sub { color: var(--label-caption); font-weight: 400; }
.add { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; padding: 0; border: none; border-radius: 999px; corner-shape: round; background: var(--selector); color: var(--label-primary); }
.add:disabled { opacity: 0.5; }
.send { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 34px; height: 34px; border: none; border-radius: 999px; corner-shape: round; background: var(--info); color: #fff; transform: translateY(-2px); }
.send:disabled { opacity: 0.4; }
.send[data-mode='stop'] { opacity: 1; background: var(--primary-fill); color: var(--primary-label); }
.send .ico { width: 18px; height: 18px; stroke-width: 2; }

/* approval */
.approval { width: 100%; max-width: var(--chat-width); margin-bottom: 8px; overflow: hidden; border: 1px solid var(--warn-secondary); border-radius: var(--r-xl); background: var(--input-major); box-shadow: var(--shadow-lv2); }
.approval .strip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--warn-tertiary); color: var(--warn); font-size: 13px; line-height: 18px; }
.approval .body { display: flex; flex-direction: column; gap: 6px; max-height: 336px; overflow-y: auto; padding: 12px 16px 0; }
.approval .headline2 { font-size: 15px; font-weight: 500; line-height: 24px; color: var(--label-primary); }
.approval .description { margin: 0; color: var(--label-secondary); font-size: 13px; line-height: 20px; }
.approval .command { color: var(--label-tertiary); font: 13px/20px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.approval .actionRow { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 16px; }
.composerMenu { position: absolute; left: 8px; right: 8px; bottom: calc(100% + 8px); z-index: 46; max-height: 320px; overflow-y: auto; padding: 4px; border-radius: var(--r-lg); background: var(--menu-fill); backdrop-filter: var(--menu-blur); -webkit-backdrop-filter: var(--menu-blur); box-shadow: var(--elev-prominent); }
.composerMenu .menuRow { width: 100%; }
.composerMenu .menuRow .cmdName { font-family: var(--mono); font-size: 12px; color: var(--label-tertiary); margin-left: auto; padding-left: 12px; flex: none; }
.composerMenu .menuRow[aria-selected='true'] { background: var(--nav-active, var(--layer-2)); }
.composerMenu .menuEmpty { padding: 10px 12px; font-size: 13px; color: var(--label-tertiary); }
.refChips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.refChip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font: 12px/18px var(--mono); color: var(--label-secondary); background: var(--layer-2); box-shadow: inset 0 0 0 0.5px var(--border-l2); cursor: pointer; }
.refChip .ico { width: 12px; height: 12px; }
.approval[data-kind='question'] { border-color: var(--border-l3); }
.approval[data-kind='question'] .strip { background: var(--layer-2); color: var(--label-secondary); }
.question { display: flex; flex-direction: column; gap: 8px; padding: 6px 0 10px; border-bottom: 0.5px solid var(--border-l2); }
.question:last-child { border-bottom: none; }
.question .qhead { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--label-tertiary); }
.question .qtext { font-size: 14px; line-height: 22px; color: var(--label-primary); }
.question .qopts { display: flex; flex-direction: column; gap: 6px; }
.question .qopt { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-l2); background: var(--layer-1); cursor: pointer; text-align: left; color: var(--label-primary); font-size: 13px; line-height: 20px; }
.question .qopt:hover { border-color: var(--border-l3); background: var(--layer-2); }
.question .qopt[aria-pressed='true'] { border-color: var(--accent); background: var(--accent-tertiary, var(--layer-2)); }
.question .qopt .mark { width: 16px; height: 16px; flex: none; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--border-l3); display: inline-flex; align-items: center; justify-content: center; }
.question .qopt[data-multi] .mark { border-radius: 4px; }
.question .qopt[aria-pressed='true'] .mark { border-color: var(--accent); background: var(--accent); color: #fff; }
.question .qopt[aria-pressed='true'] .mark::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.question .qopt .odesc { display: block; color: var(--label-tertiary); font-size: 12px; }
.question .qcustom { width: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 36px; padding: 0 14px; border: none; border-radius: var(--r-md); background: transparent; font-size: 14px; line-height: 22px; color: var(--label-primary); }
.btn.sm { height: 28px; padding: 0 10px; border-radius: var(--r-sm); font-size: 12px; line-height: 18px; }
.btn.primary { background: var(--primary-fill); color: var(--primary-label); }
.btn.outline { box-shadow: inset 0 0 0 0.5px var(--border-l3); }
.btn:disabled { opacity: 0.4; }

/* plugins page */
.page { flex: 1; min-height: 0; overflow-y: auto; padding: 0 32px 48px; }
.page > * { max-width: 960px; margin-left: auto; margin-right: auto; }
.pageHead { display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 28px 0 8px; }
.pageHead > div:first-child { flex: 1 1 auto; min-width: 0; }
.pageHead .headTools { flex: none; padding-top: 2px; }
.pageTitle { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; }
.pageIntro { margin: 4px 0 0; font-size: 13px; line-height: 20px; color: var(--label-secondary); max-width: 640px; }
.group { display: flex; flex-direction: column; gap: 8px; margin-top: 32px; }
.groupHead { display: flex; align-items: center; gap: 8px; }
.groupTitle { flex: 1; margin: 0; font-size: 15px; line-height: 22px; font-weight: 500; }
.groupMeta { font-size: 13px; color: var(--label-tertiary); }
.cards { display: flex; flex-direction: column; gap: 2px; }
.pcard { display: flex; align-items: center; gap: 20px; padding: 10px 8px; margin: 0 -8px; border-radius: var(--r-xl); }
.pcardIcon { flex: none; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background: color-mix(in srgb, var(--info) 10%, transparent); color: var(--info); }
.pcardIcon .ico { width: 18px; height: 18px; }
.pcardMain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pcardActions { display: inline-flex; align-items: center; gap: 4px; flex: none; margin-left: auto; }
.switch { position: relative; width: 36px; height: 20px; padding: 0; border: none; border-radius: 999px; background: var(--label-dimmed); flex: none; transition: background 0.15s var(--ease); }
.switch[aria-checked='true'] { background: var(--info); }
.switch:disabled { opacity: 0.5; cursor: default; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 0.15s var(--ease); }
.switch[aria-checked='true'] .knob { transform: translateX(16px); }
.installRow { display: flex; gap: 8px; align-items: center; margin: 8px 0 4px; }
.checkRow { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; font-size: 13px; color: var(--label-secondary); }
.checkRow input { accent-color: var(--info); }
textarea.input { height: auto; padding: 8px 12px; line-height: 20px; resize: vertical; }
.segTabs { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 4px; margin: 4px 0 8px; border-radius: var(--r-lg); background: var(--module-platform); }
.segTab { height: 32px; padding: 0 12px; border: none; border-radius: var(--r-md); background: transparent; color: var(--label-secondary); font-size: 13px; }
.segTab[aria-selected='true'] { background: var(--bg-layer-3); color: var(--label-primary); font-weight: 600; box-shadow: 0 0 0 0.5px var(--border-l3); }
.installRow .input { flex: 1; min-width: 0; }
.titleRow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.pcardTitle { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcardDesc { font-size: 13px; line-height: 18px; color: var(--label-tertiary); overflow-wrap: anywhere; }
.pcardDesc code { font-family: var(--mono); font-size: 12px; }
.tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; corner-shape: round; font-size: 11px; line-height: 17px; font-weight: 500; font-weight: 500; white-space: nowrap; }
.tag[data-tone='success'] { background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success); }
.tag[data-tone='info'] { background: color-mix(in srgb, var(--info) 10%, transparent); color: var(--info); }
.tag[data-tone='warning'] { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
.tag[data-tone='danger'] { background: color-mix(in srgb, var(--error) 10%, transparent); color: var(--error); }
.tag[data-tone='outline'] { box-shadow: inset 0 0 0 0.5px var(--border-l4); color: var(--label-tertiary); }
.tag[data-tone='quiet'] { color: var(--label-tertiary); padding: 0; }
.tip { margin-top: 32px; padding: 12px 16px; border-radius: var(--r-xl); background: var(--tip); color: var(--label-secondary); font-size: 13px; line-height: 20px; }
.tip code { font-family: var(--mono); font-size: 12px; }

/* settings: model routes */
.statusCard { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 0.5px solid var(--border-l3); border-radius: var(--r-xl); background: var(--input-major); flex-wrap: wrap; }
.statusCard .pcardMain { flex: 1 1 260px; }
.statusCard .selectWrap { flex: 1 1 240px; }
.form { display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 14px; border: 0.5px solid var(--border-l3); border-radius: var(--r-xl); background: var(--input-major); }
.editor { margin: 2px 0 10px; }
.editorHead { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.editorHead .pcardTitle { font-size: 15px; }
.field { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 20px; align-items: start; }
.fieldLabel { font-size: 13px; line-height: 36px; font-weight: 500; }
.fieldMain { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.fieldHint { font-size: 12px; line-height: 18px; color: var(--label-tertiary); overflow-wrap: anywhere; }
.fieldHint[data-tone='error'] { color: var(--error); }
.fieldHint[data-tone='ok'] { color: var(--success); }
.fieldHint[data-tone='warn'] { color: var(--warn-label); }
.inputRow { display: flex; gap: 8px; align-items: center; min-width: 0; }
.inputRow .input, .inputRow .selectWrap { flex: 1; }
.input, .select { width: 100%; height: 34px; padding: 0 12px; border: 0.5px solid var(--border-l4); border-radius: var(--r-md); background: var(--bg-layer-1); color: var(--label-primary); font: 13px/20px var(--font); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
.input::placeholder { color: var(--label-caption); }
.input:focus, .select:focus { border-color: var(--info); box-shadow: 0 0 0 2px color-mix(in srgb, var(--info) 18%, transparent); }
.input:disabled, .select:disabled { opacity: 0.5; }
.input.mono { font-family: var(--mono); font-size: 13px; }
.input[aria-invalid='true'] { border-color: var(--error); }
.selectWrap { position: relative; }
.select { appearance: none; padding-right: 32px; cursor: pointer; }
.selectWrap .chev { position: absolute; right: 10px; top: 9px; pointer-events: none; color: var(--label-tertiary); }
.result { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--hover); color: var(--label-secondary); font-size: 13px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.result .ico { margin-top: 2px; }
.result[data-tone='ok'] { background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success); }
.result[data-tone='error'] { background: color-mix(in srgb, var(--error) 8%, transparent); color: var(--error); }
.result[data-tone='warn'] { background: var(--warn-tertiary); color: var(--warn-label); }
.formFoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 12px; border-top: 0.5px solid var(--border-l2); }
.formFoot .spacer { flex: 1; }
.btn.danger { color: var(--error); }
.prow { display: flex; align-items: center; gap: 14px; width: calc(100% + 16px); margin: 0 -8px; padding: 8px; border: none; border-radius: var(--r-xl); background: transparent; color: inherit; text-align: left; cursor: pointer; }
.prow[aria-expanded='true'] { background: var(--hover); }
.prow .pcardDesc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kdot { width: 7px; height: 7px; border-radius: 50%; corner-shape: round; background: var(--label-caption); flex: none; display: inline-block; }
.kdot[data-state='on'] { background: var(--success); }
.kdot[data-state='off'] { background: var(--error); }
.segmented { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-md); background: var(--selector); }
.segmented button { border: none; background: transparent; padding: 5px 12px; border-radius: var(--r-sm); font-size: 13px; line-height: 20px; color: var(--label-secondary); }
.segmented button[aria-pressed='true'] { background: var(--elevated-fill); color: var(--label-primary); box-shadow: 0 0 0 0.5px var(--border-l2); }
.fold > summary { display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 500; color: var(--label-secondary); }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary .chevron { transition: transform 0.15s var(--ease); }
.fold[open] > summary .chevron { transform: rotate(90deg); }
.fold .foldBody { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.mscroll { width: 100%; overflow-x: auto; }
.mtable { width: 100%; min-width: 620px; border-collapse: collapse; }
.mtable td:first-child { min-width: 200px; }
.mtable th { padding: 2px 6px; text-align: left; font-size: 11px; font-weight: 500; color: var(--label-tertiary); white-space: nowrap; }
.mtable td { padding: 3px 4px; vertical-align: middle; }
.mtable .input { height: 30px; font-size: 13px; padding: 0 8px; }
.mtable .input.mono { font-size: 12px; }
.mtable .num { width: 96px; }
.mtable .rowDel { width: 28px; }
.mtable .inputs { white-space: nowrap; }
.checkOpt { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-size: 12px; color: var(--label-secondary); cursor: pointer; }
.checkOpt input { accent-color: var(--info); margin: 0; }
.retryCodes { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-top: 6px; }
.retryBox { margin-top: 22px; }
.mtable:empty { display: none; }
.actionsRow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.emptyNote { font-size: 13px; color: var(--label-tertiary); padding: 2px 0; }
.modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.3); }
.modalCard { width: min(560px, 100%); max-height: min(80vh, 640px); display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-panel); background: var(--bg-layer-2); box-shadow: var(--elev-prominent); }
.modalHead { padding: 22px 24px 12px; font-size: 16px; line-height: 24px; font-weight: 500; }
.modalBody { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px; }
.modalBody p { margin: 6px 4px 10px; font-size: 13px; line-height: 20px; color: var(--label-secondary); }
.modalBody .input { margin: 4px 4px 8px; width: calc(100% - 8px); }
.modalCard.narrow { width: min(440px, 100%); height: auto; }
.modalFoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 24px 24px; }
.modalFoot .spacer { flex: 1; }
.modalFoot .count { font-size: 12px; color: var(--label-tertiary); }
.pickSearch { margin: 4px 4px 8px; }
.pickRow { display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-radius: var(--r-sm); font-size: 13px; cursor: pointer; }
.pickRow .mono { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickRow .sub { margin-left: auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--label-tertiary); }
.pickRow input { accent-color: var(--info); }
.menu { position: absolute; right: 8px; bottom: calc(100% + 8px); z-index: 45; min-width: 260px; max-width: min(380px, 100%); max-height: 360px; overflow-y: auto; padding: 4px; border-radius: var(--r-lg); background: var(--menu-fill); backdrop-filter: var(--menu-blur); -webkit-backdrop-filter: var(--menu-blur); box-shadow: var(--elev-prominent); }
.menuGroup { padding: 8px 8px 2px; font-size: 11px; color: var(--label-tertiary); }
.menuRow { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 34px; padding: 6px 8px; border: none; border-radius: var(--r-md); background: transparent; color: var(--label-primary); font-size: 13px; line-height: 20px; text-align: left; }
.menuRow .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menuRow .check { order: 3; width: 14px; height: 14px; flex: none; color: var(--label-primary); visibility: hidden; }
.menuRow > .label, .menuRow .col { flex: 1 1 auto; min-width: 0; order: 1; }
.menuRow .sub { order: 2; }
.menuRow[aria-checked='true'] .check { visibility: visible; }
.menuRow .sub { flex: none; font-size: 11px; color: var(--label-tertiary); }
.menuFoot { margin-top: 4px; padding-top: 4px; border-top: 0.5px solid var(--border-l2); }
.menuEmpty { padding: 10px; font-size: 13px; color: var(--label-tertiary); }
#modelChip { cursor: pointer; }
#modelChip .chev { color: var(--label-caption); }

/* settings dialog */
.settingsCard { width: min(800px, 100%); height: min(800px, 100%); display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-panel); background: var(--bg-layer-2); box-shadow: var(--elev-prominent); }
.settingsHead { display: flex; align-items: center; gap: 8px; padding: 22px 14px 14px 24px; }
.settingsHead h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
.settingsBody { flex: 1; min-height: 0; display: flex; }
.settingsNav { flex: none; width: 188px; display: flex; flex-direction: column; gap: 4px; padding: 0 12px 12px; }
.settingsNav button { display: flex; align-items: center; gap: 8px; height: 40px; padding: 9px 16px 9px 12px; border: none; border-radius: var(--r-md); background: transparent; color: var(--label-primary); font-size: 14px; line-height: 22px; text-align: left; }
.settingsNav button[aria-current='page'] { background: var(--nav-active); }
.settingsContent { flex: 1; min-width: 0; overflow-y: auto; padding: 0 29px 32px 24px; }
.pluginSearch { position: relative; margin: 0 0 16px; }
.pluginSearch .ico { position: absolute; left: 12px; top: 10px; width: 16px; height: 16px; color: var(--label-tertiary); pointer-events: none; }
.pluginSearch .input { height: 36px; padding-left: 36px; }
.pluginGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pluginCard { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 12px 14px; border: 0.5px solid var(--border-l2); border-radius: var(--r-lg); background: var(--bg-layer-1); }
.pluginCard .titleRow { gap: 6px; flex-wrap: nowrap; }
.pluginCard .pcardTitle { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; }
.pluginCard .pcardDesc { font-size: 12px; line-height: 16px; }
.pluginGroupHead { margin: 4px 0 10px; font-size: 14px; line-height: 22px; color: var(--label-primary); }
.pluginGroupHead small { display: block; font-size: 12px; line-height: 16px; color: var(--label-tertiary); }
@media (max-width: 760px) { .pluginGrid { grid-template-columns: minmax(0, 1fr); } }
.settingsContent .group:first-child { margin-top: 0; }
.settingsContent .sectionTitle { margin: 4px 0 2px; font-size: 16px; line-height: 24px; font-weight: 500; }
.settingsContent .sectionIntro { margin: 0 0 18px; font-size: 13px; line-height: 20px; color: var(--label-secondary); }
.srow { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 0.5px solid var(--border-l2); }
.srow:last-child { border-bottom: none; }
.srow .main { flex: 1; min-width: 0; }
.srow .title { font-size: 14px; line-height: 20px; font-weight: 500; }
.srow .title:has(.ico.lead) { display: flex; align-items: center; gap: 8px; }
.srow .title .ico.lead { width: 16px; height: 16px; flex: none; color: var(--label-secondary); }
.srow .desc { margin-top: 2px; font-size: 12px; line-height: 18px; color: var(--label-tertiary); }
.srow .ctl { flex: none; max-width: 50%; }
.srow .ctl .selectWrap { min-width: 180px; }
.subTitle { font-size: 14px; font-weight: 600; margin: 22px 0 4px; }
.subTitle + .sectionIntro { margin-bottom: 4px; }
.numField { display: inline-flex; align-items: center; gap: 6px; }
.numField .unit { font-size: 12px; color: var(--label-tertiary); }
.numField input.num { text-align: right; }
.themeCards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.themeCard { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 8px 14px; border: 0.5px solid var(--border-l3); border-radius: var(--r-lg); background: var(--input-major); color: var(--label-primary); font-size: 13px; cursor: pointer; }
.themeCard[aria-pressed='true'] { border-color: var(--label-primary); box-shadow: 0 0 0 1px var(--label-primary); }
.subhead { margin: 14px 0 8px; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--label-tertiary); }
.presetCard .meta { margin-left: auto; font: 11px/16px var(--mono); color: var(--label-tertiary); }
.presetCard .pcardTitle .tag { white-space: nowrap; }
.pageHead .headTools { display: flex; align-items: center; gap: 8px; }
.btn.dashed { width: 100%; height: 40px; border: 1px dashed var(--border-l4); border-radius: var(--r-lg); color: var(--label-primary); }
@media (max-width: 760px) {
  .settingsBody { flex-direction: column; }
  .settingsNav { width: auto; flex-direction: row; overflow-x: auto; padding: 0 12px 8px; }
  .settingsContent { padding: 4px 16px 24px; }
  .themeCards { grid-template-columns: 1fr; }
}

/* toast */
.tipBubble { position: fixed; z-index: 200; max-width: min(50vw, calc(100vw - 24px)); padding: 3px 7px; border-radius: var(--r-sm); background: var(--tooltip); color: #fff; font-size: 13px; line-height: 20px; white-space: pre-line; overflow-wrap: break-word; pointer-events: none; animation: tipIn 0.15s var(--ease); }
@keyframes tipIn { from { opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 8px); padding: 8px 14px; border-radius: var(--r-md); background: var(--toast); color: #fff; font-size: 13px; line-height: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast[data-show] { opacity: 1; transform: translate(-50%, 0); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes sweep { 0% { background-position: 100% 0; } 100% { background-position: -50% 0; } }

@media (hover: hover) {

  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn.reject:hover:not(:disabled), .btn.danger:hover:not(:disabled) { background: var(--hover-danger); color: var(--error); }
  .moreRow:hover, .settingsNav button:hover { background: var(--hover); }
  .fileRow:hover { background: var(--hover); }
  .rbChip:hover { color: var(--label-primary); }
  .rbAdd:hover, .rbChip .close:hover { background: var(--hover); color: var(--label-primary); }
  .guideCard:hover { background: var(--hover); }
  .changesHead:hover, .changesRow:hover, .changesMore:hover { background: var(--hover); }
  .processHead:hover { color: var(--label-secondary); }
  .statChip:not([data-static]):hover { background: var(--hover); color: var(--label-secondary); }
  .trajRow:hover, .trajTurnHead:hover, .trajTrack:hover { background: var(--hover); }
  .turnUsage:hover { color: var(--label-tertiary); }
  .themeCard:hover { background: var(--hover-solid); }
  .prow:hover { background: var(--hover); }
  .menuRow:hover { background: var(--hover); }
  .dirRow:hover { background: var(--hover); }
  .presetCard:hover { background: var(--hover-solid); }
  .pickRow:hover { background: var(--hover); }
  .codeBanner button:hover { color: var(--label-primary); }
}
.disclosure[data-open] .drow .lead .leadIcon { opacity: 0; }
.disclosure[data-open] .drow .lead .chevron { opacity: 1; }

@media (max-width: 760px) {

  .frame[data-drawer] .sidebar { transform: none; visibility: visible; transition: transform 0.25s var(--ease); box-shadow: 0 0 40px rgba(0, 0, 0, 0.12); }
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.24); }

  .openSidebar { display: inline-flex !important; }
  .topBar[data-panel] { display: flex; }

  .conversation { --chat-width: calc(100% - 32px); }
  .column { padding-left: 0; padding-right: 0; }
  .composerSeat { padding: 0 8px 8px; }
  .headline { font-size: 22px; line-height: 28px; }
  .page { padding: 0 16px 32px; }
  .bubble { max-width: 88%; }
  .field { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .fieldLabel { line-height: 20px; }
  .form { padding: 14px; }
  .menu, .menu.left { right: 0; left: 0; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }

/* ---------- time ---------- */
function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - (ts || 0));
  if (s < 60) return T.timeNow;
  if (s < 3600) return `${Math.floor(s / 60)}${zh ? ' ' : ''}${T.min}`;
  if (s < 86400) return `${Math.floor(s / 3600)}${zh ? ' ' : ''}${T.hour}`;
  return `${Math.floor(s / 86400)}${zh ? ' ' : ''}${T.day}`;
}

async function consume(res) {

      showRunning(true); scrollToEnd();
    });

          case 'reasoning':
            if (!reasoning) { reasoning = addReasoning(''); ai = null; }
            reasoning._raw += ev.text; repaint(); break;
          case 'token':
            if (!ai) ai = addAI('');
            ai._raw += ev.text; repaint(); break;
          case 'image':
            if (!ai) ai = addAI('');
            addImages(ai, [ev.url]); scrollToEnd(); break;
          case 'tool_call': {
            ai = null; reasoning = null;
            if (!findTool(ev.id)) addTool(ev);
            showRunning(true); scrollToEnd(); break;
          }
          case 'tool_result':
            ai = null; reasoning = null;
            finishTool(findTool(ev.id) || addTool({ id: ev.id, name: ev.name, args: {} }), ev);
            showRunning(true); scrollToEnd(); break;
          case 'compact': ai = null; reasoning = null; addCompact(ev, ev.summary); showRunning(true); scrollToEnd(); break;
          case 'references': { const rows = log().querySelectorAll('.userRow'); attachRefs(rows[rows.length - 1], ev.refs); break; }

          case 'retry':  // the failed attempt's partial answer is void: the call runs again

    if (!restart) addLine(err.message, 'error');
  } finally {
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    if (ai) ai.querySelector('.md').innerHTML = markdown(ai._raw);
    if (reasoning) reasoning.querySelector('.reasoningBody').innerHTML = markdown(reasoning._raw);
    showRunning(false);
    endTurn(queuedTurn ? queuedTurn.outcome : 'completed', queuedTurn?.record || null);
    if (queuedChanges) { addChangesCard(queuedChanges); queuedChanges = null; scrollToEnd(); }
    markLast(); highlightBlocks(log()); renderStats(); if (state.convView === 'trajectory') renderTrajectory();

  const input = m.input && m.input.length ? m.input : ['text'];
  const box = (k, label) => `<label class="checkOpt"><input type="checkbox" data-mf="input" value="${k}" ${input.includes(k) ? 'checked' : ''}><span>${esc(label)}</span></label>`;
  return `<tr data-row="${i}"><td><input class="input mono" data-mf="id" value="${esc(m.id)}" placeholder="model-id" spellcheck="false"></td><td><input class="input" data-mf="name" value="${esc(m.name || '')}"></td><td class="num"><input class="input num" data-mf="context_window" type="number" min="1" value="${m.context_window || ''}"></td><td class="num"><input class="input num" data-mf="max_tokens" type="number" min="1" value="${m.max_tokens || ''}"></td><td class="inputs">${box('text', T.inputText)}${box('image', T.inputImage)}</td><td class="rowDel"><button type="button" class="iconButton" data-del="${i}" title="${esc(T.remove)}">${icon('trash')}</button></td></tr>`;
}
function mountEditor(slot) {
  const dr = models.draft; if (!slot || !dr) return;
  slot.innerHTML = editorMarkup(dr);
  const f = slot.querySelector('[data-field="form"]');
  const q = (n) => f.querySelector(`[data-field="${n}"]`);
  f.onsubmit = (e) => { e.preventDefault(); applyDraft(f); };
  mountRouteRetry(f, dr);
  q('cancel').onclick = closeEditor;
  if (q('toggleKey')) q('toggleKey').onclick = () => { const k = q('api_key'); const show = k.type === 'password'; k.type = show ? 'text' : 'password'; q('toggleKey').innerHTML = icon(show ? 'eye-off' : 'eye'); };
  if (q('api_key')) q('api_key').oninput = (e) => { dr.api_key = e.target.value; };
  q('base_url').oninput = (e) => { dr.base_url = e.target.value; };
  if (q('type')) {
    const typeHint = () => { const info = dr.info || {}; const h = q('typeHint'); h.textContent = info.package ? (info.installed ? `${info.package} · ${T.installed}` : T.notInstalled(info.package)) : ''; h.dataset.tone = info.installed === false ? 'error' : ''; };
    q('type').onchange = (e) => { const info = typeById(e.target.value); dr.type = dr.id = info.id; dr.info = info; dr.models = info.models.map((m) => ({ ...m })); dr.base_url = ''; dr.api_key = ''; mountEditor(slot); };
    typeHint();
  }
  if (q('id')) q('id').oninput = (e) => { dr.id = e.target.value.trim(); const h = q('keyHint'); if (h) { const [tone, text] = keyHint(dr); h.textContent = text; h.dataset.tone = tone; } };
  if (q('title')) q('title').oninput = (e) => { dr.title = e.target.value; };
  if (q('protocol')) q('protocol').onchange = (e) => { dr.protocol = e.target.value; dr.type = (models.data.protocols.find((p) => p.id === dr.protocol) || {}).type || 'openai'; dr.info = typeById(dr.type); q('urlHint').textContent = T.customBaseUrlHint(dr.protocol); };
  f.querySelectorAll('[data-mode]').forEach((b) => { b.onclick = () => { if (dr.mode !== b.dataset.mode) { models.draft = draftForAdd(b.dataset.mode); mountEditor(slot); } }; });
  const table = q('mtable');
  table.oninput = (e) => {
    const tr = e.target.closest('[data-row]'); if (!tr) return; const m = dr.models[+tr.dataset.row]; const k = e.target.dataset.mf;
    if (k === 'input') { const picked = [...tr.querySelectorAll('[data-mf="input"]')].filter((b) => b.checked).map((b) => b.value); if (!picked.length) { e.target.checked = true; return; } m.input = picked; }
    else if (k === 'context_window' || k === 'max_tokens') m[k] = e.target.value ? +e.target.value : null;
    else m[k] = e.target.value;
  };
  table.onclick = (e) => { const del = e.target.closest('[data-del]'); if (del) { dr.models.splice(+del.dataset.del, 1); rerenderRows(f); } };
  q('addModel').onclick = () => { dr.models.push({ id: '', name: '' }); rerenderRows(f); f.querySelector('tbody tr:last-child input')?.focus(); };
  if (q('restore')) q('restore').onclick = () => { dr.models = (dr.info.models || []).map((m) => ({ ...m })); rerenderRows(f); };
  q('fetch').onclick = () => fetchForDraft(f);
  q('test').onclick = () => testDraft(f);
  if (q('remove')) q('remove').onclick = () => removeRoute(dr.saved);
  setEditorBusy(f, false);
}
function rerenderRows(f) {
  const dr = models.draft; const table = f.querySelector('[data-field="mtable"]');
  const rows = dr.models.map((m, i) => modelRowMarkup(m, i)).join('');
  table.innerHTML = rows ? `${HEAD_ROW()}<tbody>${rows}</tbody>` : '';
  f.querySelector('[data-field="modelCount"]').textContent = dr.models.length;
  const note = f.querySelector('[data-field="emptyNote"]');
  if (!rows && !note) table.insertAdjacentHTML('afterend', `<div class="emptyNote" data-field="emptyNote">${esc(T.noModelsYet)}</div>`);
  if (rows && note) note.remove();
  f.querySelector('.fold').open = true;
}
function showEditorResult(f, tone, text, spinning) {
  const el = f.querySelector('[data-field="result"]'); el.hidden = false; el.dataset.tone = tone || '';
  el.innerHTML = `${spinning ? icon('spinner', 'ico spin') : icon(tone === 'ok' ? 'check' : tone === 'error' ? 'x-circle' : 'alert')}<span></span>`;
  el.querySelector('span').textContent = text;
}
function setEditorBusy(f, on) {
  models.busy = on;
  for (const n of ['fetch', 'test', 'apply', 'remove']) { const b = f.querySelector(`[data-field="${n}"]`); if (b) b.disabled = on || (n === 'apply' && !models.data.editable); }
}
function draftPayload(dr, withModels = true) {
  const body = { base_url: dr.base_url.trim(), api_key: dr.api_key ? dr.api_key : null };
  if (dr.mode === 'catalog') body.type = dr.type;
  if (dr.mode === 'custom') { body.protocol = dr.protocol; body.title = dr.title.trim() || null; }
  if (withModels) body.retry = dr.retry ? dr.retry : dr.mode === 'route' ? { mode: 'inherit' } : null;
  if (withModels) body.models = dr.models.map((m) => ({ id: m.id.trim(), name: (m.name || '').trim() || null, context_window: m.context_window || null, max_tokens: m.max_tokens || null, input: m.input && m.input.length ? m.input : ['text'] }));
  return body;
}
function routeIdOf(dr, f) {
  const id = (dr.id || '').trim();
  if (dr.mode === 'custom' && !ROUTE_ID.test(id)) { showEditorResult(f, 'error', T.needId); f.querySelector('[data-field="id"]')?.focus(); return null; }
  return id;
}
async function fetchForDraft(f) {
  const dr = models.draft; const id = routeIdOf(dr, f); if (!id) return;
  if (dr.mode === 'custom' && !dr.base_url.trim()) { showEditorResult(f, 'error', T.needUrl); return; }
  setEditorBusy(f, true); showEditorResult(f, '', T.fetching, true);
  try {
    const r = await json(`/settings/models/${encodeURIComponent(id)}/discover`, { method: 'POST', body: JSON.stringify(draftPayload(dr, false)) });
    if (!r.ok) { showEditorResult(f, 'error', r.error); return; }
    if (!r.supported) { showEditorResult(f, 'warn', T.modelsNone); return; }
    f.querySelector('[data-field="result"]').hidden = true;
    const picked = await pickModels(r.models, new Set(dr.models.map((m) => m.id)));
    if (!picked) return;
    for (const m of picked) if (!dr.models.some((x) => x.id === m.id)) dr.models.push({ id: m.id, name: m.name !== m.id ? m.name : '', context_window: m.context_window || null, max_tokens: m.max_tokens || null, input: m.input && m.input.length ? m.input : ['text'] });
    rerenderRows(f); showEditorResult(f, 'ok', T.modelsFound(r.models.length));
  } catch (err) { showEditorResult(f, 'error', err.message); }
  finally { setEditorBusy(f, false); }
}
async function testDraft(f) {
  const dr = models.draft; const id = routeIdOf(dr, f); if (!id) return;
  const model = (dr.models.find((m) => m.id.trim()) || {}).id;
  if (!model) { showEditorResult(f, 'error', T.needModel); return; }
  setEditorBusy(f, true); showEditorResult(f, '', T.testing, true);
  try {
    const r = await json(`/settings/models/${encodeURIComponent(id)}/test`, { method: 'POST', body: JSON.stringify({ ...draftPayload(dr, false), model: model.trim() }) });
    showEditorResult(f, r.ok ? 'ok' : 'error', r.ok ? `${T.testOk(r.latency_ms)} · ${model} · ${r.reply}` : r.error);
  } catch (err) { showEditorResult(f, 'error', err.message); }
  finally { setEditorBusy(f, false); }
}
async function applyDraft(f) {
  const dr = models.draft; const id = routeIdOf(dr, f); if (!id) return;
  if (dr.mode !== 'route' && routeById(id)) { showEditorResult(f, 'error', T.dupId); return; }
  if (dr.mode === 'custom' && !dr.base_url.trim()) { showEditorResult(f, 'error', T.needUrl); return; }
  const ids = dr.models.map((m) => m.id.trim()).filter(Boolean);
  if (dr.mode === 'custom' && !ids.length) { showEditorResult(f, 'error', T.needModel); return; }
  dr.models = dr.models.filter((m) => m.id.trim());
  setEditorBusy(f, true); showEditorResult(f, '', T.applying, true);
  try {
    models.data = await json(`/settings/models/${encodeURIComponent(id)}`, { method: 'PUT', body: JSON.stringify(draftPayload(dr)) });
    models.open = null; models.draft = null; renderModels(); toast(T.applied); loadDirectory();
  } catch (err) { showEditorResult(f, 'error', err.message); setEditorBusy(f, false); }
}
async function removeRoute(r) {
  if (!(await confirmDialog(T.removeConfirm(r.title), T.remove, T.remove))) return;
  try { models.data = await json(`/settings/models/${encodeURIComponent(r.id)}`, { method: 'DELETE' }); models.open = null; models.draft = null; renderModels(); toast(T.removed); loadDirectory(); }
  catch (err) { toast(err.message); }
}
function modal(inner) {
  const el = document.createElement('div'); el.className = 'modal'; el.innerHTML = `<div class="modalCard" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(el); return el;
}
function confirmDialog(text, label, title) {
  return new Promise((resolve) => {
    const el = modal(`${title ? `<div class="modalHead">${esc(title)}</div>` : ''}<div class="modalBody"><p>${esc(text)}</p></div><div class="modalFoot"><span class="spacer"></span><button type="button" class="btn outline" data-no>${esc(T.cancel)}</button><button type="button" class="btn outline danger" data-yes>${esc(label || T.remove)}</button></div>`);
    el.querySelector('.modalCard').classList.add('narrow');
    const done = (v) => { el.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey, true);
    el.querySelector('[data-no]').onclick = () => done(false); el.querySelector('[data-yes]').onclick = () => done(true);
    el.onclick = (e) => { if (e.target === el) done(false); };
    el.querySelector('[data-yes]').focus();
  });
}
function pickModels(candidates, existing) {
  return new Promise((resolve) => {
    const chosen = new Set();
    const el = modal(`<div class="modalHead">${esc(T.pickTitle)}</div><div class="modalBody"><input class="input pickSearch" data-search placeholder="${esc(T.pickSearch)}" autocomplete="off"><div data-list></div></div>
      <div class="modalFoot"><button type="button" class="btn outline sm" data-all>${esc(T.selectAll)}</button><button type="button" class="btn outline sm" data-none>${esc(T.deselectAll)}</button><span class="count" data-count></span><span class="spacer"></span><button type="button" class="btn outline" data-cancel>${esc(T.cancel)}</button><button type="button" class="btn primary" data-add disabled>${esc(T.addSelected)}</button></div>`);
    const list = el.querySelector('[data-list]'); const search = el.querySelector('[data-search]');
    const visible = () => { const q = search.value.trim().toLowerCase(); return candidates.filter((m) => !q || m.id.toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q)); };
    const render = () => {
      const rows = visible();
      list.innerHTML = rows.length ? rows.map((m) => `<label class="pickRow"><input type="checkbox" data-id="${esc(m.id)}" ${chosen.has(m.id) ? 'checked' : ''} ${existing.has(m.id) ? 'disabled checked' : ''}><span class="mono" title="${esc(m.id)}">${esc(m.id)}</span>${m.input && m.input.includes('image') ? `<span class="tag" data-tone="outline">${esc(T.inputImage)}</span>` : ''}${m.name && m.name !== m.id ? `<span class="sub" title="${esc(m.name)}">${esc(m.name)}</span>` : ''}</label>`).join('') : `<div class="emptyNote">${esc(T.noMatch)}</div>`;
      el.querySelector('[data-count]').textContent = T.selected(chosen.size); el.querySelector('[data-add]').disabled = !chosen.size;
    };
    const done = (v) => { el.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey, true);
    list.onchange = (e) => { const cb = e.target.closest('[data-id]'); if (!cb) return; if (cb.checked) chosen.add(cb.dataset.id); else chosen.delete(cb.dataset.id); render(); };
    search.oninput = render;
    el.querySelector('[data-all]').onclick = () => { for (const m of visible()) if (!existing.has(m.id)) chosen.add(m.id); render(); };
    el.querySelector('[data-none]').onclick = () => { chosen.clear(); render(); };
    el.querySelector('[data-cancel]').onclick = () => done(null);
    el.querySelector('[data-add]').onclick = () => done(candidates.filter((m) => chosen.has(m.id)));
    el.onclick = (e) => { if (e.target === el) done(null); };
    render(); search.focus();
  });
}

/* ---------- boot ---------- */
(async () => {
  setPhase('hero'); updateComposer();
  await refreshHealth(); await refreshSessions(); loadPluginCount(); loadDirectory(); loadAgentOptions();
  await loadPins(); await loadClientModules(); renderDock(); renderRightbar();
  input.focus();
  setInterval(() => { if (!state.streaming) refreshSessions(); }, 15000);
})();
})();
</script>
