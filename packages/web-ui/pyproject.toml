[project]
name = "pyharness-web-ui"
version = "0.1.0"
description = "pyharness plugin: Web UI at / and the client-module registry (ctx.webui)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "fastapi>=0.110"]

[project.entry-points."pyharness.plugins"]
pyharness-web-ui = "pyharness_web_ui:WebUIService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyharness_web_ui"]
