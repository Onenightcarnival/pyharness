[project]
name = "pyxis-harness-web-ui"
version = "0.1.1.dev3"
description = "PyxisHarness plugin: Web UI at / and the client-module registry (ctx.webui)"
license = "MIT"
requires-python = ">=3.12"
readme = "AGENTS.md"
authors = [{ name = "Onenightcarnival" }]
keywords = ["agent", "llm", "harness", "plugin", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["pyxis-harness-core==0.1.1.dev3", "fastapi==0.162.0"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-web-ui = "pyxis_harness_web_ui:WebUIService"

[project.urls]
Homepage = "https://github.com/Onenightcarnival/pyharness"
Repository = "https://github.com/Onenightcarnival/pyharness"
Issues = "https://github.com/Onenightcarnival/pyharness/issues"
Documentation = "https://github.com/Onenightcarnival/pyharness/tree/main/packages/web-ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_web_ui"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_web_ui/AGENTS.md"
"../../LICENSE" = "pyxis_harness_web_ui/LICENSE"
