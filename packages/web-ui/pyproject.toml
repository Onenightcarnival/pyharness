[project]
name = "pyxis-harness-web-ui"
version = "0.1.0"
description = "PyxisHarness plugin: Web UI at / and the client-module registry (ctx.webui)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness-core==0.1.0", "fastapi==0.162.0"]

[project.entry-points."pyxis_harness.plugins"]
pyxis-harness-web-ui = "pyxis_harness_web_ui:WebUIService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyxis_harness_web_ui"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyxis_harness_web_ui/AGENTS.md"
