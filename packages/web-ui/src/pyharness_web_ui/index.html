<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pyharness</title>
<style>
/* Design tokens: DeepSeek Harness Web theme. Neutral-bluish scale, 0.5px hairlines,
   radius ladder 4–28, soft elevation. Token names: local to this page. */
:root {
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-panel: 28px;

  --bg-base: rgb(255 255 255);
  --sidebar-fill: rgb(249 250 251);
  --label-primary: rgb(15 17 21);
  --label-secondary: rgb(97 102 107);
  --label-tertiary: rgb(129 133 140);
  --label-caption: rgb(173 178 184);
  --label-inverted: rgb(255 255 255);
  --border-l1: rgba(0, 0, 0, 0.04);
  --border-l2: rgba(0, 0, 0, 0.1);
  --border-l3: rgba(0, 0, 0, 0.12);
  --border-l4: rgba(0, 0, 0, 0.16);
  --hover: rgba(38, 49, 72, 0.06);
  --active: rgba(38, 49, 72, 0.1);
  --hover-solid: rgb(241 243 245);
  --hover-danger: rgba(236, 19, 19, 0.05);
  --elevated-fill: rgb(255 255 255);
  --floating-hover: rgb(241 243 245);
  --input-major: rgb(255 255 255);
  --selector: rgb(245 246 247);
  --bubble: rgb(237 243 254);
  --info: rgb(65 118 230);
  --info-hover: rgb(122 170 255);
  --link: rgb(65 118 230);
  --primary-fill: rgb(15 17 21);
  --primary-hover: rgb(67 69 74);
  --primary-label: rgb(255 255 255);
  --code-block: rgb(249 250 251);
  --inline-code: rgb(250 250 250);
  --business-tertiary: rgb(228 237 253);
  --label-bluish: rgb(14 48 116);
  --warn: rgb(245 158 11);
  --warn-secondary: rgb(247 173 49);
  --warn-tertiary: rgb(254 245 231);
  --warn-label: rgb(221 134 41);
  --error: rgb(236 19 19);
  --success: rgb(34 197 94);
  --idle: rgb(212 212 212);
  --deep-diving: color-mix(in srgb, rgb(65 118 230) 70%, rgb(23 37 84));
  --shimmer: color-mix(in srgb, rgb(0 0 0) 30%, transparent);
  --scrollbar: rgb(229 229 229);
  --scrollbar-hover: rgb(212 212 212);
  --toast: rgb(53 54 56);
  --stroke-color: var(--border-l4);
  --shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, 0.02), 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --bg-base: rgb(21 21 23);
  --sidebar-fill: rgb(27 27 28);
  --label-primary: rgb(249 250 251);
  --label-secondary: rgb(207 211 214);
  --label-tertiary: rgb(173 178 184);
  --label-caption: rgb(129 133 140);
  --label-inverted: rgb(53 54 56);
  --border-l1: rgba(255, 255, 255, 0.06);
  --border-l2: rgba(255, 255, 255, 0.12);
  --border-l3: rgba(255, 255, 255, 0.16);
  --border-l4: rgba(255, 255, 255, 0.2);
  --hover: rgba(255, 255, 255, 0.08);
  --active: rgba(255, 255, 255, 0.14);
  --hover-solid: rgb(53 54 56);
  --hover-danger: rgba(242, 90, 90, 0.15);
  --elevated-fill: rgb(67 69 74);
  --floating-hover: rgb(53 54 56);
  --input-major: rgb(44 44 46);
  --selector: rgb(53 54 56);
  --bubble: rgb(44 44 46);
  --info: rgb(122 170 255);
  --info-hover: rgb(65 118 230);
  --link: rgb(122 170 255);
  --primary-fill: rgb(249 250 251);
  --primary-hover: rgb(235 238 242);
  --primary-label: rgb(15 17 21);
  --code-block: rgb(27 27 28);
  --inline-code: rgb(41 41 41);
  --business-tertiary: rgb(52 65 91);
  --label-bluish: rgb(249 250 251);
  --warn-tertiary: rgb(39 36 31);
  --error: rgb(242 90 90);
  --idle: rgb(84 85 87);
  --deep-diving: color-mix(in srgb, rgb(86 134 254) 55%, rgb(173 178 184));
  --shimmer: color-mix(in srgb, rgb(255 255 255) 45%, transparent);
  --scrollbar: rgb(60 60 61);
  --scrollbar-hover: rgb(84 85 87);
  --toast: rgb(67 69 74);
  --stroke-color: var(--border-l3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
*, *::before, *::after { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-base); color: var(--label-primary); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--info); outline-offset: -2px; }
svg { display: block; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
::-webkit-scrollbar-track { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
.elev-soft { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 4px 16px 0 rgba(0, 0, 0, 0.03), 0 0 24px 0 rgba(0, 0, 0, 0.03); }
.elev-panel { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 3px 8px 0 rgba(0, 0, 0, 0.03), 0 0 16px 0 rgba(0, 0, 0, 0.02); }
.elev-prominent { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05); }
@supports (corner-shape: superellipse(1.5)) { * { corner-shape: superellipse(1.5); } }

/* ---------- frame ---------- */
.frame { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100%; transition: grid-template-columns 0.3s var(--ease); }
.frame[data-collapsed] { grid-template-columns: 0 minmax(0, 1fr); }
.sidebar { min-width: 0; overflow: hidden; display: flex; flex-direction: column; padding: 6px 8px; background: var(--sidebar-fill); border-right: 0.5px solid var(--border-l3); }
.frame[data-collapsed] .sidebar { border-right: none; }
.center { min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.logoRow { flex: none; display: flex; align-items: center; gap: 8px; height: 60px; padding: 8px 4px 8px 8px; }
.brand { flex: 1; min-width: 0; display: inline-flex; align-items: center; gap: 6px; height: 24px; }
.brandMark { width: 22px; height: 22px; flex: none; }
.brandName { font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: 0.02em; white-space: nowrap; }
.buildBadge { flex: none; display: inline-flex; align-items: center; height: 12px; padding: 0 4px; border-radius: 2px; background: var(--label-primary); color: var(--bg-base); font: 500 7px/12px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.iconButton { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; border-radius: var(--r-sm); padding: 0; background: transparent; color: var(--label-secondary); }
.newSession { flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 8px 12px; margin: 0 4px 10px; border: 0.5px solid var(--border-l3); border-radius: var(--r-md); background: var(--elevated-fill); color: var(--label-primary); font-size: 14px; font-weight: 500; line-height: 22px; }
.panelList { flex: none; display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.panelRow { display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 7px 9px; margin: 0 3px; border: none; border-radius: var(--r-md); background: transparent; color: var(--label-primary); line-height: 22px; text-align: left; }
.panelRow[aria-current='page'] { background: var(--hover); }
.panelRow .count { margin-left: auto; color: var(--label-tertiary); font-size: 12px; }
.region { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.regionHead { flex: none; display: flex; align-items: center; height: 32px; padding: 0 12px; color: var(--label-tertiary); font-size: 12px; line-height: 20px; }
.sessions { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.projectRow, .sessionRow { display: flex; align-items: center; border-radius: var(--r-md); margin: 0 3px; padding: 0 8px 0 9px; color: var(--label-primary); }
.projectRow { height: 34px; gap: 6px; }
.projectRow .folder { color: var(--info); }
.projectRow .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px; }
.sessionRow { position: relative; height: 32px; padding-inline-start: 31px; cursor: pointer; border: none; background: transparent; width: calc(100% - 6px); text-align: left; }
.sessionRow.selected { background: var(--hover); }
.sessionRow .title { flex: 1; min-width: 0; margin-right: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px; }
.sessionRow .time { flex: none; font-size: 10px; line-height: 16px; color: var(--label-tertiary); }
.sessionRow .busyDot { position: absolute; left: 15px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; corner-shape: round; background: var(--info); animation: pulse 1.6s var(--ease) infinite; }
.sessionRow .rowAction { display: none; width: 22px; height: 22px; margin: -3px -4px -3px 0; border: none; border-radius: var(--r-xs); padding: 0; background: transparent; color: var(--label-tertiary); align-items: center; justify-content: center; }
.empty { padding: 6px 12px 0 31px; color: var(--label-caption); font-size: 12px; }
.foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 4px 2px 8px; border-top: 0.5px solid var(--border-l2); margin: 0 4px; }
.avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; corner-shape: round; display: inline-flex; align-items: center; justify-content: center; background: var(--selector); color: var(--label-secondary); }
.profileText { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 18px; }
.profileName { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profileMeta { font-size: 11px; color: var(--label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 6px; height: 6px; border-radius: 50%; corner-shape: round; background: var(--success); flex: none; }
.dot[data-state='off'] { background: var(--error); }
.dot[data-state='warn'] { background: var(--warn); }

/* ---------- header ---------- */
.topBar { flex: none; display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 10px 20px 10px 16px; }
.topBar[data-bordered] { border-bottom: 0.5px solid var(--border-l3); }
.topBar .crumb { min-width: 0; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 8px; font-size: 14px; line-height: 20px; font-weight: 500; }
.topBar .spacer { flex: 1; }
.openSidebar { display: none; }
.frame[data-collapsed] .openSidebar { display: inline-flex; }

/* ---------- conversation ---------- */
.conversation { flex: 1; min-height: 0; display: flex; flex-direction: column; --chat-width: clamp(min(680px, 100% - 32px), 64%, 920px); }
.scrollBody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
.conversation[data-phase='hero'] .scrollBody { justify-content: center; }
.column { width: 100%; max-width: var(--chat-width); margin: 0 auto; padding: 16px 0 24px; display: flex; flex-direction: column; gap: 4px; }
.conversation[data-phase='hero'] .column { display: none; }
.hero { display: none; flex-direction: column; align-items: stretch; gap: 12px; width: 100%; max-width: calc(var(--chat-width) + 32px); margin: 0 auto; padding: 0 16px; }
.conversation[data-phase='hero'] .hero { display: flex; }
.headline { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 26px; line-height: 32px; font-weight: 500; }
.headline .heroMark { width: 32px; height: 32px; }
.previewBadge { align-self: flex-start; margin-top: 2px; padding: 1px 7px 0; border: 0.5px solid var(--hover); border-radius: 999px; corner-shape: round; background: var(--business-tertiary); color: var(--label-bluish); font: 500 12px/18px var(--mono); white-space: nowrap; }
.workspaceRow { display: flex; align-items: center; padding-left: 8px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; max-width: min(100%, 360px); min-height: 28px; padding: 0 8px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-primary); font-size: 13px; line-height: 20px; font-weight: 500; }
.chip .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .chev { color: var(--label-caption); }

.userRow { display: flex; flex-direction: column; align-items: flex-end; margin: 12px 0 8px; }
.bubble { max-width: min(calc(var(--chat-width) * 0.702), 82%); padding: 10px 16px; border-radius: var(--r-xl); background: var(--bubble); font-size: 14px; line-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.aiBlock { min-width: 0; }
.actions { display: flex; align-items: center; gap: 8px; height: 28px; margin-top: 2px; color: var(--label-tertiary); opacity: 0; transition: opacity 0.1s; }
.aiBlock:hover .actions, .aiBlock:focus-within .actions, .aiBlock[data-last] .actions { opacity: 1; }
.action { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 6px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-tertiary); }
.actions .meta { font-size: 12px; color: var(--label-tertiary); margin-left: 4px; }
.notice-line { color: var(--label-tertiary); font-size: 13px; line-height: 20px; padding: 2px 0; display: flex; align-items: center; gap: 8px; }
.notice-line.error { color: var(--label-secondary); }
.notice-line.error b { color: var(--error); font-weight: 600; }
.notice-line .dot { background: var(--error); }
.systemRow { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; color: var(--label-tertiary); font-size: 12px; line-height: 18px; }
.systemRow::before, .systemRow::after { content: ''; flex: 1; height: 0.5px; background: var(--border-l2); }
.systemRow .ico { width: 14px; height: 14px; }
.systemRow span { display: inline-flex; align-items: center; gap: 6px; max-width: 80%; text-align: center; }
.systemRow[data-tone='warn'] { color: var(--warn-label); }

/* markdown */
.md { min-width: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 24px; color: var(--label-primary); }
.md > :first-child { margin-top: 0 !important; }
.md > :last-child { margin-bottom: 0 !important; }
.md p { margin: 16px 0; }
.md h1 { font-size: 21px; line-height: 30px; font-weight: 700; margin: 32px 0 16px; }
.md h2 { font-size: 19px; line-height: 28px; font-weight: 700; margin: 32px 0 16px; }
.md h3 { font-size: 18px; line-height: 26px; font-weight: 700; margin: 32px 0 16px; }
.md h4, .md h5, .md h6 { font-size: 14px; line-height: 24px; font-weight: 600; margin: 16px 0; }
.md strong { font-weight: 600; }
.md a { color: var(--link); font-weight: 500; text-decoration: none; }
.md a:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
.md ul, .md ol { margin: 16px 0; padding-left: 18px; }
.md li + li { margin-top: 6px; }
.md li::marker { color: var(--label-secondary); }
.md li > ul, .md li > ol { margin: 4px 0 0; }
.md hr { border: none; height: 0.5px; margin: 32px 0; background: var(--border-l2); }
.md blockquote { margin: 16px 0; padding-left: 14px; border-left: 2px solid var(--label-caption); color: var(--label-secondary); }
.md :not(pre) > code { font-family: var(--mono); font-size: 0.875em; padding: 0 5px; border: 0.5px solid var(--border-l1); border-radius: var(--r-sm); background: var(--inline-code); }
.md .tableScroll { max-width: 100%; overflow-x: auto; margin: 16px 0; }
.md table { border-collapse: collapse; width: max-content; max-width: 100%; }
.md th, .md td { text-align: start; padding: 10px 16px; font-size: 13px; line-height: 22px; min-width: 80px; }
.md th { font-weight: 500; border-bottom: 0.5px solid var(--border-l3); }
.md td { border-bottom: 0.5px solid var(--border-l2); }
.md th:first-child, .md td:first-child { padding-left: 0; }
.codeBlock { margin: 16px 0; border-radius: var(--r-lg); background: var(--code-block); }
.codeBanner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 14px 0; font: 11px/18px var(--font); color: var(--label-secondary); }
.codeBanner .lang { font-family: var(--mono); color: var(--label-primary); }
.codeBanner button { border: none; background: none; padding: 0; color: var(--label-tertiary); display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
.codeBlock pre { margin: 0; padding: 10px 16px 16px; overflow-x: auto; font: 12px/19px var(--mono); white-space: pre; }
.compact { font-size: 13px; line-height: 20px; color: var(--label-tertiary); }
.compact p, .compact ul, .compact ol, .compact blockquote { margin: 4px 0; }
.compact h1, .compact h2, .compact h3, .compact h4 { margin: 8px 0 4px; font: inherit; font-weight: 600; }
.compact .codeBlock { margin: 4px 0; }

/* disclosure rows (tools, reasoning) */
.disclosure { display: flex; flex-direction: column; min-width: 0; }
.drow { position: relative; display: flex; align-items: center; height: 24px; min-width: 0; padding: 0; border: none; background: none; color: var(--label-tertiary); text-align: left; width: 100%; }
.drow .lead { position: relative; flex: none; width: 16px; height: 16px; margin-right: 6px; display: inline-flex; align-items: center; justify-content: center; }
.drow .lead .ico { width: 14px; height: 14px; }
.drow .lead .chevron { position: absolute; inset: 0; margin: auto; opacity: 0; transition: transform 0.15s var(--ease); }
.disclosure[data-open] .drow .lead .chevron { transform: rotate(90deg); }
.drow .dtitle { flex: none; font-size: 13px; line-height: 24px; }
.drow .sep { flex: none; width: 2px; height: 2px; margin: 0 8px; border-radius: 1px; background: var(--label-caption); }
.drow .summary { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 24px; }
.drow[data-state='error'] .summary { color: var(--error); }
.drow[data-state='rejected'] .summary { color: var(--warn-label); }
.drow[data-state='waiting'] .leadIcon { color: var(--warn); }
.dbody { display: none; }
.disclosure[data-open] .dbody { display: block; }
.ioCard { display: flex; flex-direction: column; margin: 4px 0 6px 4px; border: 0.5px solid var(--border-l1); border-radius: var(--r-lg); background: var(--code-block); font: 11px/16px var(--mono); overflow: hidden; }
.ioSection { display: grid; grid-template-columns: 48px 1fr; align-items: baseline; padding: 12px 16px; max-height: 180px; overflow-y: auto; }
.ioLabel { color: var(--label-caption); font-family: var(--font); }
.ioText { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--label-secondary); }
.ioText[data-error] { color: var(--error); }
.ioDivider { height: 0.5px; background: var(--border-l2); }
.reasoningBody { padding: 2px 0 6px 22px; }
.spin { animation: spin 0.9s linear infinite; transform-origin: center; }
.running { display: inline-flex; align-items: center; gap: 6px; height: 28px; margin-top: 4px; color: var(--deep-diving); font-size: 12px; }
.shimmer { background: linear-gradient(90deg, var(--deep-diving) 0%, var(--deep-diving) 40%, var(--shimmer) 50%, var(--deep-diving) 60%, var(--deep-diving) 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sweep 2.2s linear infinite; }

/* composer */
.composerSeat { flex: none; position: sticky; bottom: 0; display: flex; flex-direction: column; align-items: center; padding: 0 16px 12px; background: linear-gradient(180deg, color-mix(in srgb, var(--bg-base) 0%, transparent) 0, var(--bg-base) 36px); }
.conversation[data-phase='hero'] .composerSeat { position: static; background: none; padding: 0; }
#approval { width: 100%; display: flex; flex-direction: column; align-items: center; }
.conversation[data-phase='hero'] .hero .composerSlot { display: contents; }
.notice { width: 100%; max-width: calc(var(--chat-width) + 32px); margin-bottom: 6px; padding: 4px 8px; border-radius: var(--r-md); background: var(--hover); color: var(--label-secondary); font-size: 12px; line-height: 18px; display: flex; align-items: center; gap: 6px; }
.notice[hidden] { display: none; }
.card { position: relative; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: calc(var(--chat-width) + 32px); padding-top: 8px; border-radius: var(--r-panel); background: var(--input-major); --stroke-color: var(--border-l2); }
.card textarea { display: block; width: 100%; min-height: 36px; max-height: 336px; resize: none; border: none; outline: none; background: transparent; padding: 4px 14px 0; color: var(--label-primary); font: 16px/24px var(--font); overflow-y: auto; }
.card textarea::placeholder { color: var(--label-caption); }
.conversation[data-phase='hero'] .card textarea { min-height: 52px; }
.cardRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 8px 6px; min-width: 0; }
.cardRow .left, .cardRow .right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cardRow .right { margin-left: auto; flex: none; }
.selectChip { display: inline-flex; align-items: center; gap: 4px; max-width: 240px; height: 28px; padding: 0 6px 0 8px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-secondary); font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.selectChip .label { overflow: hidden; text-overflow: ellipsis; }
.selectChip .sub { color: var(--label-caption); font-weight: 400; }
.add { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; padding: 0; border: none; border-radius: 999px; corner-shape: round; background: var(--selector); color: var(--label-primary); }
.add:disabled { opacity: 0.5; }
.send { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 34px; height: 34px; border: none; border-radius: 999px; corner-shape: round; background: var(--info); color: #fff; transform: translateY(-2px); }
.send:disabled { opacity: 0.4; }
.send[data-mode='stop'] { opacity: 1; background: var(--primary-fill); color: var(--primary-label); }
.send .ico { width: 18px; height: 18px; stroke-width: 2; }

/* approval */
.approval { width: 100%; max-width: var(--chat-width); margin-bottom: 8px; overflow: hidden; border: 1px solid var(--warn-secondary); border-radius: var(--r-xl); background: var(--input-major); box-shadow: var(--shadow-lv2); }
.approval .strip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--warn-tertiary); color: var(--warn); font-size: 13px; line-height: 18px; }
.approval .body { display: flex; flex-direction: column; gap: 6px; max-height: 336px; overflow-y: auto; padding: 12px 16px 0; }
.approval .headline2 { font-size: 15px; font-weight: 500; line-height: 24px; color: var(--label-primary); }
.approval .description { margin: 0; color: var(--label-secondary); font-size: 13px; line-height: 20px; }
.approval .command { color: var(--label-tertiary); font: 13px/20px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.approval .actionRow { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 36px; padding: 0 14px; border: none; border-radius: var(--r-md); background: transparent; font-size: 14px; line-height: 22px; color: var(--label-primary); }
.btn.sm { height: 28px; padding: 0 10px; border-radius: var(--r-sm); font-size: 12px; line-height: 18px; }
.btn.primary { background: var(--primary-fill); color: var(--primary-label); }
.btn.outline { box-shadow: inset 0 0 0 0.5px var(--border-l3); }
.btn:disabled { opacity: 0.4; }

/* plugins page */
.page { flex: 1; min-height: 0; overflow-y: auto; padding: 0 32px 48px; }
.page > * { max-width: 960px; margin-left: auto; margin-right: auto; }
.pageHead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 0 8px; }
.pageTitle { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; }
.pageIntro { margin: 4px 0 0; font-size: 13px; line-height: 20px; color: var(--label-secondary); max-width: 640px; }
.group { display: flex; flex-direction: column; gap: 8px; margin-top: 32px; }
.groupHead { display: flex; align-items: center; gap: 8px; }
.groupTitle { flex: 1; margin: 0; font-size: 14px; line-height: 22px; font-weight: 500; }
.groupMeta { font-size: 13px; color: var(--label-tertiary); }
.cards { display: flex; flex-direction: column; gap: 2px; }
.pcard { display: flex; align-items: center; gap: 14px; padding: 8px; margin: 0 -8px; border-radius: var(--r-xl); }
.pcardIcon { flex: none; width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 0.5px solid var(--border-l3); border-radius: var(--r-lg); color: var(--label-secondary); }
.pcardIcon .ico { width: 20px; height: 20px; }
.pcardMain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.titleRow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.pcardTitle { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcardDesc { font-size: 13px; line-height: 18px; color: var(--label-tertiary); overflow-wrap: anywhere; }
.pcardDesc code { font-family: var(--mono); font-size: 12px; }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; corner-shape: round; font-size: 10px; line-height: 1; font-weight: 500; white-space: nowrap; }
.tag[data-tone='success'] { background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success); }
.tag[data-tone='info'] { background: color-mix(in srgb, var(--info) 10%, transparent); color: var(--info); }
.tag[data-tone='warning'] { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
.tag[data-tone='danger'] { background: color-mix(in srgb, var(--error) 10%, transparent); color: var(--error); }
.tag[data-tone='outline'] { box-shadow: inset 0 0 0 0.5px var(--border-l4); color: var(--label-tertiary); }
.tag[data-tone='quiet'] { color: var(--label-tertiary); padding: 0; }
.tip { margin-top: 32px; padding: 12px 16px; border-radius: var(--r-xl); background: var(--hover); color: var(--label-secondary); font-size: 13px; line-height: 20px; }
.tip code { font-family: var(--mono); font-size: 12px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 8px); padding: 8px 14px; border-radius: var(--r-md); background: var(--toast); color: #fff; font-size: 13px; line-height: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast[data-show] { opacity: 1; transform: translate(-50%, 0); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes sweep { 0% { background-position: 100% 0; } 100% { background-position: -50% 0; } }

@media (hover: hover) {
  .iconButton:hover, .panelRow:hover, .projectRow:hover, .sessionRow:hover, .chip:hover, .selectChip:hover:not(:disabled) { background: var(--hover); }
  .newSession:hover { background: var(--floating-hover); }

  .sessionRow:hover .rowAction { display: inline-flex; }

  .drow:hover { color: var(--label-secondary); }
  .drow:hover .lead .leadIcon { opacity: 0; }
  .drow:hover .lead .chevron { opacity: 1; }
  .action:hover { background: var(--hover); color: var(--label-secondary); }
  .add:hover:not(:disabled) { background: var(--hover-solid); }
  .send:hover:not(:disabled) { background: var(--info-hover); }
  .send[data-mode='stop']:hover { background: var(--primary-hover); }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn.reject:hover:not(:disabled) { background: var(--hover-danger); color: var(--error); }
  .codeBanner button:hover { color: var(--label-primary); }
}
.disclosure[data-open] .drow .lead .leadIcon { opacity: 0; }
.disclosure[data-open] .drow .lead .chevron { opacity: 1; }

@media (max-width: 760px) {
  .frame, .frame[data-collapsed] { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-100%); visibility: hidden; transition: transform 0.25s var(--ease), visibility 0s 0.25s; }
  .frame[data-drawer] .sidebar { transform: none; visibility: visible; transition: transform 0.25s var(--ease); box-shadow: 0 0 40px rgba(0, 0, 0, 0.12); }
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.24); }

  .openSidebar { display: inline-flex !important; }
  .collapseSidebar { display: none; }
  .conversation { --chat-width: calc(100% - 32px); }
  .column { padding-left: 0; padding-right: 0; }
  .composerSeat { padding: 0 8px 8px; }
  .headline { font-size: 22px; line-height: 28px; }
  .page { padding: 0 16px 32px; }
  .bubble { max-width: 88%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { headers: { 'content-type': 'application/json' }, ...opts });
  if (!res.ok && res.status !== 204) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch { /* non-JSON error body */ }
    const err = new Error(detail); err.status = res.status; throw err;
  }
  return res;
}
const json = async (path, opts) => (await api(path, opts)).json();

  clearTimeout(toastTimer); toastTimer = setTimeout(() => delete el.dataset.show, 2400);
}

/* ---------- markdown: escaped input, CommonMark subset ---------- */
function inline(text) {
  const codes = [];
  let s = text.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u.replace(/"/g, '%22')}" target="_blank" rel="noopener noreferrer">${t}</a>`)
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
}
function markdown(src) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isBlockStart = (l) => /^(#{1,6})\s|^```|^\s*([-*+]|\d+[.)])\s|^>\s?|^(\*\s*){3,}$|^(-\s*){3,}$|^\|/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(/^```\s*([\w+.#-]*)/))) {
      const lang = m[1]; const body = []; i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) body.push(lines[i++]);
      i++;
      out.push(`<div class="codeBlock"><div class="codeBanner"><span class="lang">${esc(lang || 'text')}</span><button type="button" data-copy>${icon('copy')}<span>${T.copy}</span></button></div><pre><code>${esc(body.join('\n'))}</code></pre></div>`);
      continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^(\*\s*){3,}$|^(-\s*){3,}$|^(_\s*){3,}$/.test(line.trim())) { out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(line)) {
      const body = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) body.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${markdown(body.join('\n'))}</blockquote>`);
      continue;
    }
    if (/^\|/.test(line) && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const head = cells(line); i += 2; const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="tableScroll"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s/.test(line)) { const [html, next] = list(lines, i); out.push(html); i = next; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}
function list(lines, start) {
  const indentOf = (l) => l.match(/^\s*/)[0].length;
  const base = indentOf(lines[start]);
  const ordered = /^\s*\d+[.)]\s/.test(lines[start]);
  const items = []; let i = start;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { if (i + 1 < lines.length && indentOf(lines[i + 1]) > base) { i++; continue; } break; }
    const ind = indentOf(l);
    const m = l.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/);
    if (m && ind === base) { items.push({ text: m[2], children: [] }); i++; continue; }
    if (ind > base && items.length) {
      if (/^\s*([-*+]|\d+[.)])\s/.test(l)) { const [html, next] = list(lines, i); items[items.length - 1].children.push(html); i = next; continue; }
      items[items.length - 1].text += ' ' + l.trim(); i++; continue;
    }
    break;
  }
  const tag = ordered ? 'ol' : 'ul';
  return [`<${tag}>${items.map((it) => `<li>${inline(it.text)}${it.children.join('')}</li>`).join('')}</${tag}>`, i];
}
document.addEventListener('click', (e) => {

async function copyText(text, btn) {

  if (btn) { const old = btn.innerHTML; btn.innerHTML = btn.dataset.copy !== undefined ? `${icon('check')}<span>${T.copied}</span>` : icon('check'); setTimeout(() => (btn.innerHTML = old), 1400); }
}

/* ---------- time ---------- */
function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - (ts || 0));
  if (s < 60) return T.timeNow;
  if (s < 3600) return `${Math.floor(s / 60)}${zh ? ' ' : ''}${T.min}`;
  if (s < 86400) return `${Math.floor(s / 3600)}${zh ? ' ' : ''}${T.hour}`;
  return `${Math.floor(s / 86400)}${zh ? ' ' : ''}${T.day}`;
}

/* ---------- transcript ---------- */
const log = () => $('log');
function scrollToEnd(force) {
  const el = $('scroll');

}
function addUser(text) {

  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text; row.appendChild(b);
  log().appendChild(row); return row;
}
function toolGlyph(name) {
  if (/^(read_file|write_file|edit_file|delete)$/.test(name)) return 'file';
  if (/^(ls|glob)$/.test(name)) return 'list';
  if (name === 'grep') return 'search';
  if (name === 'execute') return 'terminal';
  if (name === 'task') return 'branch';
  if (name === 'write_todos') return 'list';
  if (name === 'harness_inspect') return 'eye';
  if (name === 'plugin_manager') return 'plug';
  return 'tool';
}
function argSummary(name, args) {
  if (!args || typeof args !== 'object') return '';
  const pick = args.file_path || args.path || args.pattern || args.command || args.description || args.action || args.query || args.target || args.topic;
  if (typeof pick === 'string') return pick + (name === 'plugin_manager' && args.target ? ' ' + args.target : '');
  const s = JSON.stringify(args);
  return s === '{}' ? '' : s;
}
function addTool(call) {
  const el = document.createElement('div');
  el.className = 'disclosure tool'; el.dataset.toolId = call.id || '';
  el.innerHTML = `<button class="drow" type="button" data-state="running"><span class="lead"><span class="leadIcon">${icon('spinner', 'ico spin')}</span>${icon('chev-right', 'ico chevron')}</span><span class="dtitle"></span><span class="sep"></span><span class="summary"></span></button>
    <div class="dbody"><div class="ioCard"><div class="ioSection"><span class="ioLabel">${esc(T.input)}</span><span class="ioText" data-in></span></div></div></div>`;

}
function finishTool(el, result) {

  row.dataset.state = failed ? (/reject/i.test(result.content || '') ? 'rejected' : 'error') : 'done';
  el.querySelector('.leadIcon').innerHTML = icon(failed ? 'x-circle' : toolGlyph(el.querySelector('.dtitle').textContent));
  if (failed) el.querySelector('.summary').textContent = String(result.content || T.error).split('\n')[0];
  const card = el.querySelector('.ioCard');
  if (!card.querySelector('[data-out]')) {
    card.insertAdjacentHTML('beforeend', `<div class="ioDivider"></div><div class="ioSection"><span class="ioLabel">${esc(failed ? T.error : T.output)}</span><span class="ioText" data-out${failed ? ' data-error' : ''}></span></div>`);
  }
  card.querySelector('[data-out]').textContent = result.content ?? '';
}
function findTool(id) { return id ? log().querySelector(`.tool[data-tool-id="${CSS.escape(id)}"]`) : null; }

}
function addAI(text) {

  el.innerHTML = `<div class="md"></div><div class="actions"><button class="action" type="button" title="${esc(T.copy)}" aria-label="${esc(T.copy)}">${icon('copy')}</button></div>`;

  const blocks = log().querySelectorAll('.aiBlock'); if (blocks.length) blocks[blocks.length - 1].setAttribute('data-last', '');

function addLine(text, kind) {
  const el = document.createElement('div'); el.className = 'notice-line' + (kind ? ' ' + kind : '');
  el.innerHTML = kind === 'error' ? `<span class="dot"></span><span><b>${esc(T.error)}</b> ${esc(text)}</span>` : esc(text);
  log().appendChild(el); return el;

function addSystem(marker) {
  const el = document.createElement('div'); el.className = 'systemRow';
  if (marker.rollback) el.dataset.tone = 'warn';
  const reasons = (marker.reasons || []).join('；');
  const text = marker.rollback ? T.rolledBack(marker.generation) : T.restarted(marker.generation);
  el.innerHTML = `<span>${icon(marker.rollback ? 'alert' : 'check')}${esc(text)}${reasons ? ' · ' + esc(reasons) : ''}</span>`;
  if (marker.rollback_error) el.title = marker.rollback_error;
  log().appendChild(el); return el;
}
function renderHistory(messages) {
  log().innerHTML = '';
  for (const m of messages) {
    if (m.role === 'human' && m.harness) addSystem(m.harness);
    else if (m.role === 'human') addUser(m.content);
    else if (m.role === 'ai') {
      if (m.reasoning) addReasoning(m.reasoning);
      if (m.content) addAI(m.content);
      for (const tc of m.tool_calls || []) addTool(tc);
    } else if (m.role === 'tool') {
      const el = findTool(m.tool_call_id) || addTool({ id: m.tool_call_id, name: m.name || 'tool', args: {} });
      finishTool(el, m);
    }
  }
  markLast();
}

/* ---------- streaming ---------- */
async function consume(res) {
  state.streaming = true; updateComposer();
  showRunning(true); scrollToEnd(true);
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = '', ai = null, reasoning = null, restart = false, frame = 0;
  const repaint = () => {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      if (ai) ai.querySelector('.md').innerHTML = markdown(ai._raw);
      if (reasoning) reasoning.querySelector('.reasoningBody').innerHTML = markdown(reasoning._raw);
      showRunning(true); scrollToEnd();
    });
  };
  try {
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
        if (!chunk.startsWith('data: ')) continue;
        const ev = JSON.parse(chunk.slice(6));
        switch (ev.type) {
          case 'reasoning':
            if (!reasoning) { reasoning = addReasoning(''); ai = null; }
            reasoning._raw += ev.text; repaint(); break;
          case 'token':
            if (!ai) ai = addAI('');
            ai._raw += ev.text; repaint(); break;
          case 'tool_call': {
            ai = null; reasoning = null;
            if (!findTool(ev.id)) addTool(ev);
            showRunning(true); scrollToEnd(); break;
          }
          case 'tool_result':
            ai = null; reasoning = null;
            finishTool(findTool(ev.id) || addTool({ id: ev.id, name: ev.name, args: {} }), ev);
            showRunning(true); scrollToEnd(); break;
          case 'interrupt': renderApproval(ev.interrupts); break;
          case 'error': addLine(ev.message, 'error'); break;
          case 'done':
            restart = ev.restart_pending;
            if (ev.outcome === 'cancelled') addLine(T.cancelled);
            break;
        }
      }
    }
  } catch (err) {
    if (!restart) addLine(err.message, 'error');
  } finally {
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    if (ai) ai.querySelector('.md').innerHTML = markdown(ai._raw);
    if (reasoning) reasoning.querySelector('.reasoningBody').innerHTML = markdown(reasoning._raw);
    showRunning(false); markLast();
    state.streaming = false; updateComposer(); refreshSessions();
    if (restart) waitForRestart();
  }
}
async function attach() {
  const id = state.current;
  const res = await api(`/sessions/${id}/stream`);
  if (res.status === 200 && state.current === id) await consume(res);
}

/* ---------- approvals ---------- */
function renderApproval(interrupts) {
  const box = $('approval'); box.innerHTML = '';
  const reqs = (interrupts || []).flatMap((i) => (i.value && i.value.action_requests) || []);
  state.pending = reqs.length > 0; updateComposer();
  // Calls under this decision: tool rows without a result.
  log().querySelectorAll('.tool .drow[data-state="running"], .tool .drow[data-state="waiting"]').forEach((row) => {
    row.dataset.state = reqs.length ? 'waiting' : 'running';
    row.querySelector('.leadIcon').innerHTML = reqs.length ? icon('alert') : icon('spinner', 'ico spin');
  });
  if (!reqs.length) return;
  const card = document.createElement('div'); card.className = 'approval';
  const desc = reqs.map((r) => r.description || '').find((d) => d && !/^Tool execution requires approval/.test(d));
  card.innerHTML = `<div class="strip">${icon('alert')}<span>${esc(T.approvalStrip)}</span></div>
    <div class="body"><div class="headline2">${esc(reqs.length === 1 ? T.approvalOne : T.approvalMany(reqs.length))}</div>
    ${desc ? `<p class="description">${esc(desc.split('\n')[0])}</p>` : ''}
    ${reqs.map((r) => `<div class="command">${esc(r.name)} ${esc(JSON.stringify(r.args))}</div>`).join('')}</div>
    <div class="actionRow"><button class="btn outline reject" type="button">${esc(T.reject)}</button><button class="btn primary" type="button">${esc(T.approve)}</button></div>`;
  card.querySelector('.reject').onclick = () => decide(reqs.map(() => ({ type: 'reject' })));
  card.querySelector('.primary').onclick = () => decide(reqs.map(() => ({ type: 'approve' })));
  box.appendChild(card);
  requestAnimationFrame(() => scrollToEnd(true));
}
async function decide(decisions) {
  renderApproval([]);
  try { await consume(await api(`/sessions/${state.current}/approvals`, { method: 'POST', body: JSON.stringify({ decisions }) })); }
  catch (err) { addLine(err.message, 'error'); updateComposer(); }
}

/* ---------- restart hand-off ---------- */
async function waitForRestart() {
  const before = state.generation; const notice = $('notice');
  notice.innerHTML = `${icon('spinner', 'ico spin')}<span>${esc(T.restarting)}</span>`; notice.hidden = false;
  for (let i = 0; i < 240; i++) {
    await sleep(1000);
    const h = await refreshHealth();
    if (h && h.generation !== before) {
      notice.innerHTML = `${icon('check')}<span>${esc(T.restarted(h.generation))}</span>`;
      setTimeout(() => { notice.hidden = true; }, 4000);
      loadPluginCount();
      if (state.current) {
        for (let j = 0; j < 20; j++) {
          const s = await json('/sessions/' + state.current);
          if (s.busy) break;
          await sleep(400);
        }
        await openSession(state.current);
      }
      return;
    }
  }
  notice.innerHTML = `${icon('alert')}<span>${esc(T.restartFailed)}</span>`;
}

/* ---------- composer ---------- */
const input = $('input');
function updateComposer() {
  const send = $('send');
  if (state.streaming) {
    send.dataset.mode = 'stop'; send.disabled = false; send.innerHTML = icon('stop'); send.title = T.stop;
    input.placeholder = T.placeholderBusy;
  } else {
    delete send.dataset.mode; send.innerHTML = icon('arrow-up'); send.title = T.send;
    send.disabled = !input.value.trim() || state.pending;
    input.placeholder = T.placeholder;
  }
}
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 336) + 'px'; }
input.addEventListener('input', () => { autosize(); updateComposer(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); }
});
$('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (state.streaming) { if (state.current) api(`/sessions/${state.current}/cancel`, { method: 'POST' }).catch(() => {}); return; }
  const text = input.value.trim(); if (!text) return;
  if (state.pending) { toast(T.approvalPending); return; }
  if (!state.current) {
    let s;
    try { s = await json('/sessions', { method: 'POST', body: JSON.stringify({ title: text.slice(0, 60) }) }); } catch (err) { toast(err.message); return; }
    state.current = s.id; log().innerHTML = '';
    $('crumb').textContent = s.title || T.untitled;
    setPhase('active'); refreshSessions();
  }
  input.value = ''; autosize();
  addUser(text); scrollToEnd(true);
  try { await consume(await api(`/sessions/${state.current}/messages`, { method: 'POST', body: JSON.stringify({ content: text }) })); }
  catch (err) { addLine(err.status === 409 ? T.busy : err.message, 'error'); state.streaming = false; updateComposer(); }
});

/* ---------- plugins page ---------- */
const STATE_TAG = { active: ['success', 'running'], pending: ['warning', 'pending'], disabled: ['quiet', 'disabled'], failed: ['danger', 'failed'], stopped: ['quiet', 'stopped'] };
function entryGlyph(e) {
  const n = e.name || '';
  if (/llm/.test(n)) return 'bulb';
  if (/tools|inspect/.test(n)) return 'tool';
  if (/checkpoint|store/.test(n)) return 'box';
  if (/workspace/.test(n)) return 'folder';
  if (/http|api|web-ui/.test(n)) return 'terminal';
  if (/plugin-manager/.test(n)) return 'plug';
  if (/agent/.test(n)) return 'branch';
  return 'plug';
}
async function loadPluginCount() {
  try { const d = await json('/plugins'); $('pluginCount').textContent = d.entries.filter((e) => e.state === 'active').length; return d; } catch { return null; }
}
async function showPlugins() {
  setView('plugins');
  $('crumb').textContent = T.pluginsTitle;
  const d = await loadPluginCount();
  if (!d) return;
  const bundleCards = d.bundles.map((b) => `<div class="pcard"><span class="pcardIcon">${icon('box')}</span><span class="pcardMain"><span class="titleRow"><span class="pcardTitle">${esc(b.bundle)}</span><span class="tag" data-tone="${b.enabled ? 'success' : 'outline'}">${esc(b.enabled ? T.enabled : T.off)}</span></span><span class="pcardDesc"><code>${esc(b.dist || '')}</code> ${esc(b.version || '')} · ${esc(b.installed === 'profile' ? T.fromProfile : T.fromEnv)}</span></span></div>`).join('');
  const entryCards = d.entries.map((e) => {
    const [tone, key] = STATE_TAG[e.state] || ['outline', e.state];
    const detail = e.state === 'pending' ? `${T.missing}: ${(e.missing || []).join(', ')}` : e.state === 'failed' ? e.error : (e.provides ? `ctx.${e.provides}` : '');
    return `<div class="pcard"><span class="pcardIcon">${icon(entryGlyph(e))}</span><span class="pcardMain"><span class="titleRow"><span class="pcardTitle">${esc(e.id)}</span><span class="tag" data-tone="${tone}">${esc(T[key] || key)}</span></span><span class="pcardDesc"><code>${esc(e.name || '')}</code>${e.source ? ' · ' + esc(e.source) : ''}${detail ? ' · ' + esc(detail) : ''}</span></span></div>`;
  }).join('');
  $('pluginsView').innerHTML = `
    <div class="pageHead"><div><h1 class="pageTitle">${esc(T.pluginsTitle)}</h1><p class="pageIntro">${esc(T.pluginsIntro)}</p></div></div>
    <div class="group"><div class="groupHead"><h2 class="groupTitle">${esc(T.bundles)}</h2><span class="groupMeta">${d.bundles.length}</span></div><div class="cards">${bundleCards}</div></div>
    <div class="group"><div class="groupHead"><h2 class="groupTitle">${esc(T.entries)}</h2><span class="groupMeta">${d.entries.length}</span></div><div class="cards">${entryCards}</div></div>
    <div class="tip">${T.tip}</div>`;
}

/* ---------- boot ---------- */
(async () => {
  setPhase('hero'); updateComposer();
  await refreshHealth(); await refreshSessions(); loadPluginCount();
  input.focus();
  setInterval(() => { if (!state.streaming) refreshSessions(); }, 15000);
})();
})();
</script>
</body>
