<!doctype html>
<html lang="zh-CN">
<head>

<title>pyharness</title>
<style>
/* Design tokens: DeepSeek Harness Web theme. Neutral-bluish scale, 0.5px hairlines,
   radius ladder 4–28, soft elevation. Token names: local to this page. */
:root {
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-panel: 28px;

  --bg-base: rgb(255 255 255);
  --sidebar-fill: rgb(249 250 251);
  --label-primary: rgb(15 17 21);
  --label-secondary: rgb(97 102 107);
  --label-tertiary: rgb(129 133 140);
  --label-caption: rgb(173 178 184);
  --label-inverted: rgb(255 255 255);
  --border-l1: rgba(0, 0, 0, 0.04);
  --border-l2: rgba(0, 0, 0, 0.1);
  --border-l3: rgba(0, 0, 0, 0.12);
  --border-l4: rgba(0, 0, 0, 0.16);
  --hover: rgba(38, 49, 72, 0.06);
  --active: rgba(38, 49, 72, 0.1);
  --hover-solid: rgb(241 243 245);
  --hover-danger: rgba(236, 19, 19, 0.05);
  --elevated-fill: rgb(255 255 255);
  --floating-hover: rgb(241 243 245);
  --input-major: rgb(255 255 255);
  --selector: rgb(245 246 247);
  --bubble: rgb(237 243 254);
  --info: rgb(65 118 230);
  --info-hover: rgb(122 170 255);
  --link: rgb(65 118 230);
  --primary-fill: rgb(15 17 21);
  --primary-hover: rgb(67 69 74);
  --primary-label: rgb(255 255 255);
  --code-block: rgb(249 250 251);
  --inline-code: rgb(250 250 250);
  --business-tertiary: rgb(228 237 253);
  --label-bluish: rgb(14 48 116);
  --warn: rgb(245 158 11);
  --warn-secondary: rgb(247 173 49);
  --warn-tertiary: rgb(254 245 231);
  --warn-label: rgb(221 134 41);
  --error: rgb(236 19 19);
  --success: rgb(34 197 94);
  --idle: rgb(212 212 212);
  --deep-diving: color-mix(in srgb, rgb(65 118 230) 70%, rgb(23 37 84));
  --shimmer: color-mix(in srgb, rgb(0 0 0) 30%, transparent);
  --scrollbar: rgb(229 229 229);
  --scrollbar-hover: rgb(212 212 212);
  --toast: rgb(53 54 56);
  --stroke-color: var(--border-l4);
  --shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, 0.02), 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --bg-base: rgb(21 21 23);
  --sidebar-fill: rgb(27 27 28);
  --label-primary: rgb(249 250 251);
  --label-secondary: rgb(207 211 214);
  --label-tertiary: rgb(173 178 184);
  --label-caption: rgb(129 133 140);
  --label-inverted: rgb(53 54 56);
  --border-l1: rgba(255, 255, 255, 0.06);
  --border-l2: rgba(255, 255, 255, 0.12);
  --border-l3: rgba(255, 255, 255, 0.16);
  --border-l4: rgba(255, 255, 255, 0.2);
  --hover: rgba(255, 255, 255, 0.08);
  --active: rgba(255, 255, 255, 0.14);
  --hover-solid: rgb(53 54 56);
  --hover-danger: rgba(242, 90, 90, 0.15);
  --elevated-fill: rgb(67 69 74);
  --floating-hover: rgb(53 54 56);
  --input-major: rgb(44 44 46);
  --selector: rgb(53 54 56);
  --bubble: rgb(44 44 46);
  --info: rgb(122 170 255);
  --info-hover: rgb(65 118 230);
  --link: rgb(122 170 255);
  --primary-fill: rgb(249 250 251);
  --primary-hover: rgb(235 238 242);
  --primary-label: rgb(15 17 21);
  --code-block: rgb(27 27 28);
  --inline-code: rgb(41 41 41);
  --business-tertiary: rgb(52 65 91);
  --label-bluish: rgb(249 250 251);
  --warn-tertiary: rgb(39 36 31);
  --error: rgb(242 90 90);
  --idle: rgb(84 85 87);
  --deep-diving: color-mix(in srgb, rgb(86 134 254) 55%, rgb(173 178 184));
  --shimmer: color-mix(in srgb, rgb(255 255 255) 45%, transparent);
  --scrollbar: rgb(60 60 61);
  --scrollbar-hover: rgb(84 85 87);
  --toast: rgb(67 69 74);
  --stroke-color: var(--border-l3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
*, *::before, *::after { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-base); color: var(--label-primary); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--info); outline-offset: -2px; }
svg { display: block; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
::-webkit-scrollbar-track { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
.elev-soft { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 4px 16px 0 rgba(0, 0, 0, 0.03), 0 0 24px 0 rgba(0, 0, 0, 0.03); }
.elev-panel { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 3px 8px 0 rgba(0, 0, 0, 0.03), 0 0 16px 0 rgba(0, 0, 0, 0.02); }
.elev-prominent { box-shadow: 0 0 0 0.5px var(--stroke-color), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05); }
@supports (corner-shape: superellipse(1.5)) { * { corner-shape: superellipse(1.5); } }

/* ---------- frame ---------- */
.frame { display: grid; grid-template-columns: 260px minmax(0, 1fr) 0px; height: 100%; transition: grid-template-columns 0.3s var(--ease); }
.frame[data-rightbar] { grid-template-columns: 260px minmax(0, 1fr) var(--rb-width, 380px); }
.frame[data-collapsed][data-rightbar] { grid-template-columns: 56px minmax(0, 1fr) var(--rb-width, 380px); }
.frame[data-resizing] { transition: none; user-select: none; }
.rightbar { position: relative; min-width: 0; display: flex; flex-direction: column; overflow: hidden; border-left: 0.5px solid var(--border-l3); background: var(--bg-base); }
.rightbar[hidden] { display: none; }
.rbHandle { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 5; }
.rbHandle:hover { background: color-mix(in srgb, var(--info) 30%, transparent); }
.rbStrip { flex: none; display: flex; align-items: center; gap: 4px; min-height: 50px; padding: 10px 8px 10px 12px; border-bottom: 0.5px solid var(--border-l3); }
.rbTabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; }
.rbTab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-secondary); font-size: 13px; white-space: nowrap; }
.rbTab[aria-selected='true'] { background: var(--hover); color: var(--label-primary); }
.rbBody { flex: 1; min-height: 0; overflow: auto; }
.rbEmpty { padding: 24px 16px; font-size: 13px; color: var(--label-tertiary); }
.fileHead { display: flex; align-items: center; gap: 6px; padding: 8px 10px; font: 12px/18px var(--mono); color: var(--label-tertiary); border-bottom: 0.5px solid var(--border-l2); min-width: 0; }
.fileHead .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--label-secondary); }
.fileRow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 12px; border: none; background: transparent; color: var(--label-primary); font-size: 13px; text-align: left; }
.fileRow .ico { color: var(--label-tertiary); }
.fileRow[data-dir] .ico { color: var(--info); }
.fileRow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fileRow .size { font-size: 11px; color: var(--label-caption); }
.fileRow[data-hidden] { color: var(--label-tertiary); }
.filePreview { margin: 0; padding: 12px 14px; font: 12px/19px var(--mono); white-space: pre; overflow: auto; color: var(--label-primary); }
.kvTable { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 14px; font-size: 13px; }
.kvTable dt { color: var(--label-tertiary); } .kvTable dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.mainSlot { flex: 1; min-height: 0; overflow: auto; }
.dock { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.dock:empty { display: none; }
.pluginFail { padding: 10px 12px; }
.frame[data-collapsed] { grid-template-columns: 56px minmax(0, 1fr); }
.sidebar { min-width: 0; overflow: hidden; display: flex; flex-direction: column; padding: 6px 8px; background: var(--sidebar-fill); border-right: 0.5px solid var(--border-l3); }
.frame[data-collapsed] .sidebar { padding: 6px 6px; }
.frame[data-collapsed] .brandName, .frame[data-collapsed] .buildBadge, .frame[data-collapsed] .newSession span, .frame[data-collapsed] .panelRow span, .frame[data-collapsed] .region, .frame[data-collapsed] .moreRow span, .frame[data-collapsed] .collapseSidebar { display: none; }
.frame[data-collapsed] .logoRow { justify-content: center; padding: 8px 0; cursor: pointer; }
.frame[data-collapsed] .newSession { width: 40px; height: 40px; padding: 0; margin: 0 auto 8px; }
.frame[data-collapsed] .panelRow { justify-content: center; padding: 7px 0; margin: 0; }
.frame[data-collapsed] .foot { justify-content: center; margin: auto 0 0; padding-left: 0; padding-right: 0; }
.frame[data-collapsed] .moreRow { justify-content: center; padding: 7px 0; }
.frame[data-collapsed] .moreRow .profileMeta { display: none; }
.center { min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.logoRow { flex: none; display: flex; align-items: center; gap: 8px; height: 60px; padding: 8px 4px 8px 8px; }
.brand { flex: 1; min-width: 0; display: inline-flex; align-items: center; gap: 6px; height: 24px; }
.brandMark { width: 22px; height: 22px; flex: none; }
.brandName { font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: 0.02em; white-space: nowrap; }
.buildBadge { flex: none; display: inline-flex; align-items: center; height: 12px; padding: 0 4px; border-radius: 2px; background: var(--label-primary); color: var(--bg-base); font: 500 7px/12px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.iconButton { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; border-radius: var(--r-sm); padding: 0; background: transparent; color: var(--label-secondary); }
.newSession { flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 8px 12px; margin: 0 4px 10px; border: 0.5px solid var(--border-l3); border-radius: var(--r-md); background: var(--elevated-fill); color: var(--label-primary); font-size: 14px; font-weight: 500; line-height: 22px; }
.panelList { flex: none; display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.panelRow { display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 7px 9px; margin: 0 3px; border: none; border-radius: var(--r-md); background: transparent; color: var(--label-primary); line-height: 22px; text-align: left; }
.panelRow[aria-current='page'] { background: var(--hover); }
.iconButton[aria-current='page'] { background: var(--hover); color: var(--label-primary); }
.panelRow .count { margin-left: auto; color: var(--label-tertiary); font-size: 12px; }
.region { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.regionHead { flex: none; display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px 0 12px; color: var(--label-tertiary); font-size: 12px; line-height: 20px; }
.regionHead > span:first-child { flex: 1; }
.iconButton.sm { width: 24px; height: 24px; }
.iconButton.sm .ico { width: 14px; height: 14px; }
.sessions { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.projectRow, .sessionRow { display: flex; align-items: center; border-radius: var(--r-md); margin: 0 3px; padding: 0 8px 0 9px; color: var(--label-primary); }
.projectRow { height: 34px; gap: 6px; cursor: pointer; }
.projectRow .fold { display: none; width: 16px; height: 16px; color: var(--label-tertiary); transition: transform 0.15s var(--ease); }
.projectRow[data-folded] .fold { transform: rotate(-90deg); }
.projectRow .rowActions { display: none; margin-left: auto; gap: 2px; }
.projectRow .rowActions .iconButton, .sessionRow .rowActions .iconButton { width: 22px; height: 22px; border-radius: var(--r-xs); color: var(--label-tertiary); }
.projectRow .rowActions .iconButton .ico, .sessionRow .rowActions .iconButton .ico { width: 14px; height: 14px; }
.projectRow[data-menu-open] .rowActions, .sessionRow[data-menu-open] .rowActions { display: inline-flex; }
.sessionRow .rowActions { display: none; margin: -3px -4px -3px 0; gap: 2px; }
.sidebar .menu.rowMenu { position: fixed; bottom: auto; right: auto; min-width: 200px; }
.menuRow[data-danger] { color: var(--error); }
.menuRow[data-danger] .ico.lead { color: var(--error); }
.searchRow { padding: 0 8px 6px; }
.searchRow .input { height: 30px; font-size: 13px; }
.regionHead .iconButton[aria-pressed='true'] { background: var(--hover); color: var(--label-primary); }
.sessionRow .tag { margin-right: 6px; }
.projectRow .folder { color: var(--info); }
.projectRow .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px; }
.sessionRow { position: relative; height: 32px; padding-inline-start: 31px; cursor: pointer; border: none; background: transparent; width: calc(100% - 6px); text-align: left; }
.sessionRow.selected { background: var(--hover); }
.sessionRow .title { flex: 1; min-width: 0; margin-right: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px; }
.sessionRow .time { flex: none; font-size: 10px; line-height: 16px; color: var(--label-tertiary); }
.sessionRow .busyDot { position: absolute; left: 15px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; corner-shape: round; background: var(--info); animation: pulse 1.6s var(--ease) infinite; }
.sessionRow .rowAction { display: none; }
.empty { padding: 6px 12px 0 31px; color: var(--label-caption); font-size: 12px; }
.foot { position: relative; flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 0 2px; border-top: 0.5px solid var(--border-l2); margin: 0 4px; }
.moreRow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 7px 9px; border: none; border-radius: var(--r-md); background: transparent; color: var(--label-primary); font-size: 13px; line-height: 20px; text-align: left; }
.moreRow .profileMeta { margin-left: auto; }
.foot .menu { left: 0; right: auto; bottom: calc(100% + 6px); min-width: 220px; }
.menuRow .ico.lead { color: var(--label-secondary); flex: none; }
.menuInfo { padding: 8px 10px 6px; font-size: 11px; line-height: 16px; color: var(--label-tertiary); border-top: 0.5px solid var(--border-l2); margin-top: 4px; }
.menuInfo b { color: var(--label-secondary); font-weight: 500; }
.avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; corner-shape: round; display: inline-flex; align-items: center; justify-content: center; background: var(--selector); color: var(--label-secondary); }
.profileText { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 18px; }
.profileName { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profileMeta { font-size: 11px; color: var(--label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 6px; height: 6px; border-radius: 50%; corner-shape: round; background: var(--success); flex: none; }
.dot[data-state='off'] { background: var(--error); }
.dot[data-state='warn'] { background: var(--warn); }

/* ---------- header ---------- */
.topBar { flex: none; display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 10px 20px 10px 16px; }
.topBar[data-bordered] { border-bottom: 0.5px solid var(--border-l3); }
.topBar .crumb { min-width: 0; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 8px; font-size: 14px; line-height: 20px; font-weight: 500; }
.topBar .spacer { flex: 1; }
.openSidebar { display: none; }
.crumbTags { display: inline-flex; align-items: center; gap: 6px; min-width: 0; margin-left: 8px; }
.crumbTags .tag { max-width: 200px; overflow: hidden; text-overflow: ellipsis; display: inline-flex; gap: 4px; align-items: center; }
.crumbTags .tag .ico { width: 12px; height: 12px; }

/* ---------- conversation ---------- */
.conversation { flex: 1; min-height: 0; display: flex; flex-direction: column; --chat-width: clamp(min(680px, 100% - 32px), 64%, 920px); }
.scrollBody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
.conversation[data-phase='hero'] .scrollBody { justify-content: center; }
.column { width: 100%; max-width: var(--chat-width); margin: 0 auto; padding: 16px 0 24px; display: flex; flex-direction: column; gap: 4px; }
.conversation[data-phase='hero'] .column { display: none; }
.hero { display: none; flex-direction: column; align-items: stretch; gap: 12px; width: 100%; max-width: calc(var(--chat-width) + 32px); margin: 0 auto; padding: 0 16px; }
.conversation[data-phase='hero'] .hero { display: flex; }
.headline { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 26px; line-height: 32px; font-weight: 500; }
.headline .heroMark { width: 32px; height: 32px; }
.previewBadge { align-self: flex-start; margin-top: 2px; padding: 1px 7px 0; border: 0.5px solid var(--hover); border-radius: 999px; corner-shape: round; background: var(--business-tertiary); color: var(--label-bluish); font: 500 12px/18px var(--mono); white-space: nowrap; }
.workspaceRow { display: flex; align-items: center; padding-left: 8px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; max-width: min(100%, 360px); min-height: 28px; padding: 0 8px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-primary); font-size: 13px; line-height: 20px; font-weight: 500; }
.chip .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .chev { color: var(--label-caption); }
.chip[role='button'], .selectChip[role='button'] { cursor: pointer; }
.workspaceRow { gap: 4px; flex-wrap: wrap; }
.menuRow .desc { display: block; font-size: 11px; line-height: 15px; color: var(--label-tertiary); white-space: normal; }
.menuRow .col { min-width: 0; display: flex; flex-direction: column; }
.menu.left { left: 8px; right: auto; }
.workspaceRow { position: relative; }
.workspaceRow .menu { top: calc(100% + 6px); bottom: auto; left: 8px; right: auto; z-index: 46; }
.dirList { display: flex; flex-direction: column; }
.dirRow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-primary); font-size: 13px; text-align: left; }
.dirRow .ico { color: var(--info); }
.dirRow[data-hidden] { color: var(--label-tertiary); }
.dirPath { display: flex; gap: 8px; align-items: center; margin: 4px 4px 8px; }
.dirPath .input { font-family: var(--mono); font-size: 12px; }
.presetCards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.presetCard { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 0.5px solid var(--border-l3); border-radius: var(--r-lg); background: var(--input-major); text-align: left; color: inherit; cursor: pointer; }
.presetCard[aria-pressed='true'] { border-color: var(--info); box-shadow: 0 0 0 1px var(--info); }
.presetCard .pcardTitle { display: flex; align-items: center; gap: 8px; }
.presetCard .pcardDesc { white-space: normal; }

.userRow { display: flex; flex-direction: column; align-items: flex-end; margin: 12px 0 8px; }
.bubble { max-width: min(calc(var(--chat-width) * 0.702), 82%); padding: 10px 16px; border-radius: var(--r-xl); background: var(--bubble); font-size: 14px; line-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble:empty { display: none; }
.bubbleImages { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: min(calc(var(--chat-width) * 0.702), 82%); margin-bottom: 6px; }
.bubbleImages img { max-width: 240px; max-height: 240px; border-radius: var(--r-md); cursor: zoom-in; display: block; }
.aiImages { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.aiImages img, .md img { max-width: min(100%, 560px); max-height: 420px; border-radius: var(--r-md); cursor: zoom-in; display: block; }
.md img { margin: 12px 0; }
.attachStrip { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 14px 0; }
.attachStrip:empty { display: none; }
.attachThumb { position: relative; width: 64px; height: 64px; border-radius: var(--r-md); overflow: hidden; box-shadow: 0 0 0 0.5px var(--border-l3); }
.attachThumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attachThumb button { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border: none; border-radius: 50%; corner-shape: round; background: rgba(0, 0, 0, 0.6); color: #fff; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.attachThumb button .ico { width: 12px; height: 12px; stroke-width: 2; }
.card[data-dragover] { outline: 2px dashed var(--info); outline-offset: -2px; }
.viewer { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0, 0, 0, 0.7); cursor: zoom-out; }
.viewer img { max-width: 100%; max-height: 100%; border-radius: var(--r-md); box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4); }
.aiBlock { min-width: 0; }
.actions { display: flex; align-items: center; gap: 8px; height: 28px; margin-top: 2px; color: var(--label-tertiary); opacity: 0; transition: opacity 0.1s; }
.aiBlock:hover .actions, .aiBlock:focus-within .actions, .aiBlock[data-last] .actions { opacity: 1; }
.action { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 6px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-tertiary); }
.actions .meta { font-size: 12px; color: var(--label-tertiary); margin-left: 4px; }
.notice-line { color: var(--label-tertiary); font-size: 13px; line-height: 20px; padding: 2px 0; display: flex; align-items: center; gap: 8px; }
.notice-line.error { color: var(--label-secondary); }
.notice-line.error b { color: var(--error); font-weight: 600; }
.notice-line .dot { background: var(--error); }
.systemRow { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; color: var(--label-tertiary); font-size: 12px; line-height: 18px; }
.systemRow::before, .systemRow::after { content: ''; flex: 1; height: 0.5px; background: var(--border-l2); }
.systemRow .ico { width: 14px; height: 14px; }
.systemRow span { display: inline-flex; align-items: center; gap: 6px; max-width: 80%; text-align: center; }
.systemRow[data-tone='warn'] { color: var(--warn-label); }

/* markdown */
.md { min-width: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 24px; color: var(--label-primary); }
.md > :first-child { margin-top: 0 !important; }
.md > :last-child { margin-bottom: 0 !important; }
.md p { margin: 16px 0; }
.md h1 { font-size: 21px; line-height: 30px; font-weight: 700; margin: 32px 0 16px; }
.md h2 { font-size: 19px; line-height: 28px; font-weight: 700; margin: 32px 0 16px; }
.md h3 { font-size: 18px; line-height: 26px; font-weight: 700; margin: 32px 0 16px; }
.md h4, .md h5, .md h6 { font-size: 14px; line-height: 24px; font-weight: 600; margin: 16px 0; }
.md strong { font-weight: 600; }
.md a { color: var(--link); font-weight: 500; text-decoration: none; }
.md a:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
.md ul, .md ol { margin: 16px 0; padding-left: 18px; }
.md li + li { margin-top: 6px; }
.md li::marker { color: var(--label-secondary); }
.md li > ul, .md li > ol { margin: 4px 0 0; }
.md hr { border: none; height: 0.5px; margin: 32px 0; background: var(--border-l2); }
.md blockquote { margin: 16px 0; padding-left: 14px; border-left: 2px solid var(--label-caption); color: var(--label-secondary); }
.md :not(pre) > code { font-family: var(--mono); font-size: 0.875em; padding: 0 5px; border: 0.5px solid var(--border-l1); border-radius: var(--r-sm); background: var(--inline-code); }
.md .tableScroll { max-width: 100%; overflow-x: auto; margin: 16px 0; }
.md table { border-collapse: collapse; width: max-content; max-width: 100%; }
.md th, .md td { text-align: start; padding: 10px 16px; font-size: 13px; line-height: 22px; min-width: 80px; }
.md th { font-weight: 500; border-bottom: 0.5px solid var(--border-l3); }
.md td { border-bottom: 0.5px solid var(--border-l2); }
.md th:first-child, .md td:first-child { padding-left: 0; }
.codeBlock { margin: 16px 0; border-radius: var(--r-lg); background: var(--code-block); }
.codeBanner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 14px 0; font: 11px/18px var(--font); color: var(--label-secondary); }
.codeBanner .lang { font-family: var(--mono); color: var(--label-primary); }
.codeBanner button { border: none; background: none; padding: 0; color: var(--label-tertiary); display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
.codeBlock pre { margin: 0; padding: 10px 16px 16px; overflow-x: auto; font: 12px/19px var(--mono); white-space: pre; }
.compact { font-size: 13px; line-height: 20px; color: var(--label-tertiary); }
.compact p, .compact ul, .compact ol, .compact blockquote { margin: 4px 0; }
.compact h1, .compact h2, .compact h3, .compact h4 { margin: 8px 0 4px; font: inherit; font-weight: 600; }
.compact .codeBlock { margin: 4px 0; }

/* disclosure rows (tools, reasoning) */
.disclosure { display: flex; flex-direction: column; min-width: 0; }
.drow { position: relative; display: flex; align-items: center; height: 24px; min-width: 0; padding: 0; border: none; background: none; color: var(--label-tertiary); text-align: left; width: 100%; }
.drow .lead { position: relative; flex: none; width: 16px; height: 16px; margin-right: 6px; display: inline-flex; align-items: center; justify-content: center; }
.drow .lead .ico { width: 14px; height: 14px; }
.drow .lead .chevron { position: absolute; inset: 0; margin: auto; opacity: 0; transition: transform 0.15s var(--ease); }
.disclosure[data-open] .drow .lead .chevron { transform: rotate(90deg); }
.drow .dtitle { flex: none; font-size: 13px; line-height: 24px; }
.drow .sep { flex: none; width: 2px; height: 2px; margin: 0 8px; border-radius: 1px; background: var(--label-caption); }
.drow .summary { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 24px; }
.drow[data-state='error'] .summary { color: var(--error); }
.drow[data-state='rejected'] .summary { color: var(--warn-label); }
.drow[data-state='waiting'] .leadIcon { color: var(--warn); }
.dbody { display: none; }
.disclosure[data-open] .dbody { display: block; }
.ioCard { display: flex; flex-direction: column; margin: 4px 0 6px 4px; border: 0.5px solid var(--border-l1); border-radius: var(--r-lg); background: var(--code-block); font: 11px/16px var(--mono); overflow: hidden; }
.ioSection { display: grid; grid-template-columns: 48px 1fr; align-items: baseline; padding: 12px 16px; max-height: 180px; overflow-y: auto; }
.ioLabel { color: var(--label-caption); font-family: var(--font); }
.ioText { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--label-secondary); }
.ioText[data-error] { color: var(--error); }
.ioDivider { height: 0.5px; background: var(--border-l2); }
.reasoningBody { padding: 2px 0 6px 22px; }
.spin { animation: spin 0.9s linear infinite; transform-origin: center; }
.running { display: inline-flex; align-items: center; gap: 6px; height: 28px; margin-top: 4px; color: var(--deep-diving); font-size: 12px; }
.shimmer { background: linear-gradient(90deg, var(--deep-diving) 0%, var(--deep-diving) 40%, var(--shimmer) 50%, var(--deep-diving) 60%, var(--deep-diving) 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sweep 2.2s linear infinite; }

/* composer */
.composerSeat { flex: none; position: sticky; bottom: 0; display: flex; flex-direction: column; align-items: center; padding: 0 16px 12px; background: linear-gradient(180deg, color-mix(in srgb, var(--bg-base) 0%, transparent) 0, var(--bg-base) 36px); }
.conversation[data-phase='hero'] .composerSeat { position: static; background: none; padding: 0; }
#approval { width: 100%; display: flex; flex-direction: column; align-items: center; }
.conversation[data-phase='hero'] .hero .composerSlot { display: contents; }
.notice { width: 100%; max-width: calc(var(--chat-width) + 32px); margin-bottom: 6px; padding: 4px 8px; border-radius: var(--r-md); background: var(--hover); color: var(--label-secondary); font-size: 12px; line-height: 18px; display: flex; align-items: center; gap: 6px; }
.notice[hidden] { display: none; }
.card { position: relative; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: calc(var(--chat-width) + 32px); padding-top: 8px; border-radius: var(--r-panel); background: var(--input-major); --stroke-color: var(--border-l2); }
.card textarea { display: block; width: 100%; min-height: 36px; max-height: 336px; resize: none; border: none; outline: none; background: transparent; padding: 4px 14px 0; color: var(--label-primary); font: 16px/24px var(--font); overflow-y: auto; }
.card textarea::placeholder { color: var(--label-caption); }
.conversation[data-phase='hero'] .card textarea { min-height: 52px; }
.cardRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 8px 6px; min-width: 0; }
.cardRow .left, .cardRow .right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cardRow .left { flex: 1 1 auto; overflow: hidden; }
.cardRow .left .selectChip { flex: 0 1 auto; min-width: 28px; }
.cardRow .right { margin-left: auto; flex: none; max-width: 55%; }
.cardRow .right #modelChip { flex: 0 1 auto; min-width: 60px; }
.selectChip { display: inline-flex; align-items: center; gap: 4px; max-width: 240px; height: 28px; padding: 0 6px 0 8px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-secondary); font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; }
.selectChip .label { overflow: hidden; text-overflow: ellipsis; }
.selectChip .sub { color: var(--label-caption); font-weight: 400; }
.add { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; padding: 0; border: none; border-radius: 999px; corner-shape: round; background: var(--selector); color: var(--label-primary); }
.add:disabled { opacity: 0.5; }
.send { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 34px; height: 34px; border: none; border-radius: 999px; corner-shape: round; background: var(--info); color: #fff; transform: translateY(-2px); }
.send:disabled { opacity: 0.4; }
.send[data-mode='stop'] { opacity: 1; background: var(--primary-fill); color: var(--primary-label); }
.send .ico { width: 18px; height: 18px; stroke-width: 2; }

/* approval */
.approval { width: 100%; max-width: var(--chat-width); margin-bottom: 8px; overflow: hidden; border: 1px solid var(--warn-secondary); border-radius: var(--r-xl); background: var(--input-major); box-shadow: var(--shadow-lv2); }
.approval .strip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--warn-tertiary); color: var(--warn); font-size: 13px; line-height: 18px; }
.approval .body { display: flex; flex-direction: column; gap: 6px; max-height: 336px; overflow-y: auto; padding: 12px 16px 0; }
.approval .headline2 { font-size: 15px; font-weight: 500; line-height: 24px; color: var(--label-primary); }
.approval .description { margin: 0; color: var(--label-secondary); font-size: 13px; line-height: 20px; }
.approval .command { color: var(--label-tertiary); font: 13px/20px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.approval .actionRow { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 36px; padding: 0 14px; border: none; border-radius: var(--r-md); background: transparent; font-size: 14px; line-height: 22px; color: var(--label-primary); }
.btn.sm { height: 28px; padding: 0 10px; border-radius: var(--r-sm); font-size: 12px; line-height: 18px; }
.btn.primary { background: var(--primary-fill); color: var(--primary-label); }
.btn.outline { box-shadow: inset 0 0 0 0.5px var(--border-l3); }
.btn:disabled { opacity: 0.4; }

/* plugins page */
.page { flex: 1; min-height: 0; overflow-y: auto; padding: 0 32px 48px; }
.page > * { max-width: 960px; margin-left: auto; margin-right: auto; }
.pageHead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 0 8px; }
.pageTitle { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; }
.pageIntro { margin: 4px 0 0; font-size: 13px; line-height: 20px; color: var(--label-secondary); max-width: 640px; }
.group { display: flex; flex-direction: column; gap: 8px; margin-top: 32px; }
.groupHead { display: flex; align-items: center; gap: 8px; }
.groupTitle { flex: 1; margin: 0; font-size: 14px; line-height: 22px; font-weight: 500; }
.groupMeta { font-size: 13px; color: var(--label-tertiary); }
.cards { display: flex; flex-direction: column; gap: 2px; }
.pcard { display: flex; align-items: center; gap: 14px; padding: 8px; margin: 0 -8px; border-radius: var(--r-xl); }
.pcardIcon { flex: none; width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 0.5px solid var(--border-l3); border-radius: var(--r-lg); color: var(--label-secondary); }
.pcardIcon .ico { width: 20px; height: 20px; }
.pcardMain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.titleRow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.pcardTitle { font-size: 14px; line-height: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcardDesc { font-size: 13px; line-height: 18px; color: var(--label-tertiary); overflow-wrap: anywhere; }
.pcardDesc code { font-family: var(--mono); font-size: 12px; }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; corner-shape: round; font-size: 10px; line-height: 1; font-weight: 500; white-space: nowrap; }
.tag[data-tone='success'] { background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success); }
.tag[data-tone='info'] { background: color-mix(in srgb, var(--info) 10%, transparent); color: var(--info); }
.tag[data-tone='warning'] { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
.tag[data-tone='danger'] { background: color-mix(in srgb, var(--error) 10%, transparent); color: var(--error); }
.tag[data-tone='outline'] { box-shadow: inset 0 0 0 0.5px var(--border-l4); color: var(--label-tertiary); }
.tag[data-tone='quiet'] { color: var(--label-tertiary); padding: 0; }
.tip { margin-top: 32px; padding: 12px 16px; border-radius: var(--r-xl); background: var(--hover); color: var(--label-secondary); font-size: 13px; line-height: 20px; }
.tip code { font-family: var(--mono); font-size: 12px; }

/* settings: model routes */
.statusCard { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 0.5px solid var(--border-l3); border-radius: var(--r-xl); background: var(--input-major); flex-wrap: wrap; }
.statusCard .pcardMain { flex: 1 1 260px; }
.statusCard .selectWrap { flex: 1 1 240px; }
.form { display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 14px; border: 0.5px solid var(--border-l3); border-radius: var(--r-xl); background: var(--input-major); }
.editor { margin: 2px 0 10px; }
.editorHead { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.editorHead .pcardTitle { font-size: 15px; }
.field { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 20px; align-items: start; }
.fieldLabel { font-size: 13px; line-height: 36px; font-weight: 500; }
.fieldMain { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.fieldHint { font-size: 12px; line-height: 18px; color: var(--label-tertiary); overflow-wrap: anywhere; }
.fieldHint[data-tone='error'] { color: var(--error); }
.fieldHint[data-tone='ok'] { color: var(--success); }
.fieldHint[data-tone='warn'] { color: var(--warn-label); }
.inputRow { display: flex; gap: 8px; align-items: center; min-width: 0; }
.inputRow .input, .inputRow .selectWrap { flex: 1; }
.input, .select { width: 100%; height: 36px; padding: 0 12px; border: 0.5px solid var(--border-l3); border-radius: var(--r-md); background: var(--bg-base); color: var(--label-primary); font: 14px/22px var(--font); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
.input::placeholder { color: var(--label-caption); }
.input:focus, .select:focus { border-color: var(--info); box-shadow: 0 0 0 2px color-mix(in srgb, var(--info) 18%, transparent); }
.input:disabled, .select:disabled { opacity: 0.5; }
.input.mono { font-family: var(--mono); font-size: 13px; }
.input[aria-invalid='true'] { border-color: var(--error); }
.selectWrap { position: relative; }
.select { appearance: none; padding-right: 32px; cursor: pointer; }
.selectWrap .chev { position: absolute; right: 10px; top: 10px; pointer-events: none; color: var(--label-tertiary); }
.result { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--hover); color: var(--label-secondary); font-size: 13px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.result .ico { margin-top: 2px; }
.result[data-tone='ok'] { background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success); }
.result[data-tone='error'] { background: color-mix(in srgb, var(--error) 8%, transparent); color: var(--error); }
.result[data-tone='warn'] { background: var(--warn-tertiary); color: var(--warn-label); }
.formFoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 12px; border-top: 0.5px solid var(--border-l2); }
.formFoot .spacer { flex: 1; }
.btn.danger { color: var(--error); }
.prow { display: flex; align-items: center; gap: 14px; width: calc(100% + 16px); margin: 0 -8px; padding: 8px; border: none; border-radius: var(--r-xl); background: transparent; color: inherit; text-align: left; cursor: pointer; }
.prow[aria-expanded='true'] { background: var(--hover); }
.prow .pcardDesc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kdot { width: 7px; height: 7px; border-radius: 50%; corner-shape: round; background: var(--label-caption); flex: none; display: inline-block; }
.kdot[data-state='on'] { background: var(--success); }
.kdot[data-state='off'] { background: var(--error); }
.segmented { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-md); background: var(--selector); }
.segmented button { border: none; background: transparent; padding: 5px 12px; border-radius: var(--r-sm); font-size: 13px; line-height: 20px; color: var(--label-secondary); }
.segmented button[aria-pressed='true'] { background: var(--elevated-fill); color: var(--label-primary); box-shadow: 0 0 0 0.5px var(--border-l2); }
.fold > summary { display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 500; color: var(--label-secondary); }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary .chevron { transition: transform 0.15s var(--ease); }
.fold[open] > summary .chevron { transform: rotate(90deg); }
.fold .foldBody { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.mscroll { width: 100%; overflow-x: auto; }
.mtable { width: 100%; min-width: 620px; border-collapse: collapse; }
.mtable td:first-child { min-width: 200px; }
.mtable th { padding: 2px 6px; text-align: left; font-size: 11px; font-weight: 500; color: var(--label-tertiary); white-space: nowrap; }
.mtable td { padding: 3px 4px; vertical-align: middle; }
.mtable .input { height: 30px; font-size: 13px; padding: 0 8px; }
.mtable .input.mono { font-size: 12px; }
.mtable .num { width: 96px; }
.mtable .rowDel { width: 28px; }
.mtable .inputs { white-space: nowrap; }
.checkOpt { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-size: 12px; color: var(--label-secondary); cursor: pointer; }
.checkOpt input { accent-color: var(--info); margin: 0; }
.mtable:empty { display: none; }
.actionsRow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.emptyNote { font-size: 13px; color: var(--label-tertiary); padding: 2px 0; }
.modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.3); }
.modalCard { width: min(560px, 100%); max-height: min(80vh, 640px); display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-xl); background: var(--elevated-fill); box-shadow: var(--shadow-lv2), 0 0 0 0.5px var(--border-l3); }
.modalHead { padding: 14px 16px 6px; font-size: 15px; font-weight: 500; }
.modalBody { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 12px; }
.modalBody p { margin: 6px 4px 10px; font-size: 13px; line-height: 20px; color: var(--label-secondary); }
.modalBody .input { margin: 4px 4px 8px; width: calc(100% - 8px); }
.modalCard.narrow { width: min(440px, 100%); height: auto; }
.modalFoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-top: 0.5px solid var(--border-l2); }
.modalFoot .spacer { flex: 1; }
.modalFoot .count { font-size: 12px; color: var(--label-tertiary); }
.pickSearch { margin: 4px 4px 8px; }
.pickRow { display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-radius: var(--r-sm); font-size: 13px; cursor: pointer; }
.pickRow .mono { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickRow .sub { margin-left: auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--label-tertiary); }
.pickRow input { accent-color: var(--info); }
.menu { position: absolute; right: 8px; bottom: calc(100% + 8px); z-index: 45; min-width: 260px; max-width: min(380px, 100%); max-height: 360px; overflow-y: auto; padding: 6px; border-radius: var(--r-lg); background: var(--elevated-fill); box-shadow: var(--shadow-lv2), 0 0 0 0.5px var(--border-l3); }
.menuGroup { padding: 8px 8px 2px; font-size: 11px; color: var(--label-tertiary); }
.menuRow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: none; border-radius: var(--r-sm); background: transparent; color: var(--label-primary); font-size: 13px; line-height: 20px; text-align: left; }
.menuRow .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menuRow .check { order: 3; width: 14px; height: 14px; flex: none; color: var(--label-primary); visibility: hidden; }
.menuRow > .label, .menuRow .col { flex: 1 1 auto; min-width: 0; order: 1; }
.menuRow .sub { order: 2; }
.menuRow[aria-checked='true'] .check { visibility: visible; }
.menuRow .sub { flex: none; font-size: 11px; color: var(--label-tertiary); }
.menuFoot { margin-top: 4px; padding-top: 4px; border-top: 0.5px solid var(--border-l2); }
.menuEmpty { padding: 10px; font-size: 13px; color: var(--label-tertiary); }
#modelChip { cursor: pointer; }
#modelChip .chev { color: var(--label-caption); }

/* settings dialog */
.settingsCard { width: min(1000px, 100%); height: min(720px, 100%); display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-xl); background: var(--sidebar-fill); box-shadow: var(--shadow-lv2), 0 0 0 0.5px var(--border-l3); }
.settingsHead { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px 20px; }
.settingsHead h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
.settingsBody { flex: 1; min-height: 0; display: flex; }
.settingsNav { flex: none; width: 200px; display: flex; flex-direction: column; gap: 2px; padding: 4px 12px 12px; }
.settingsNav button { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: none; border-radius: var(--r-md); background: transparent; color: var(--label-primary); font-size: 13px; text-align: left; }
.settingsNav button[aria-current='page'] { background: var(--hover-solid); }
.settingsContent { flex: 1; min-width: 0; overflow-y: auto; padding: 4px 28px 32px 20px; }
.settingsContent .group:first-child { margin-top: 0; }
.settingsContent .sectionTitle { margin: 4px 0 2px; font-size: 16px; line-height: 24px; font-weight: 500; }
.settingsContent .sectionIntro { margin: 0 0 18px; font-size: 13px; line-height: 20px; color: var(--label-secondary); }
.srow { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 0.5px solid var(--border-l2); }
.srow:last-child { border-bottom: none; }
.srow .main { flex: 1; min-width: 0; }
.srow .title { font-size: 14px; line-height: 20px; font-weight: 500; }
.srow .desc { margin-top: 2px; font-size: 12px; line-height: 18px; color: var(--label-tertiary); }
.srow .ctl { flex: none; max-width: 50%; }
.srow .ctl .selectWrap { min-width: 180px; }
.themeCards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.themeCard { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 8px 14px; border: 0.5px solid var(--border-l3); border-radius: var(--r-lg); background: var(--input-major); color: var(--label-primary); font-size: 13px; cursor: pointer; }
.themeCard[aria-pressed='true'] { border-color: var(--label-primary); box-shadow: 0 0 0 1px var(--label-primary); }
.subhead { margin: 14px 0 8px; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--label-tertiary); }
.presetCard .meta { margin-left: auto; font: 11px/16px var(--mono); color: var(--label-tertiary); }
.presetCard .pcardTitle .tag { white-space: nowrap; }
.pageHead .headTools { display: flex; align-items: center; gap: 8px; }
.btn.dashed { width: 100%; height: 40px; border: 1px dashed var(--border-l4); border-radius: var(--r-lg); color: var(--label-primary); }
@media (max-width: 760px) {
  .settingsBody { flex-direction: column; }
  .settingsNav { width: auto; flex-direction: row; overflow-x: auto; padding: 0 12px 8px; }
  .settingsContent { padding: 4px 16px 24px; }
  .themeCards { grid-template-columns: 1fr; }
}

/* toast */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 8px); padding: 8px 14px; border-radius: var(--r-md); background: var(--toast); color: #fff; font-size: 13px; line-height: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast[data-show] { opacity: 1; transform: translate(-50%, 0); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes sweep { 0% { background-position: 100% 0; } 100% { background-position: -50% 0; } }

@media (hover: hover) {
  .iconButton:hover, .panelRow:hover, .projectRow:hover, .sessionRow:hover, .chip:hover, .selectChip:hover:not(:disabled) { background: var(--hover); }
  .newSession:hover { background: var(--floating-hover); }
  .sessionRow:hover .time { display: none; }
  .sessionRow:hover .rowActions, .projectRow:hover .rowActions { display: inline-flex; }
  .projectRow:hover .folder { display: none; }
  .projectRow:hover .fold { display: block; }
  .rowActions .iconButton:hover { color: var(--label-primary); background: var(--active); }
  .drow:hover { color: var(--label-secondary); }
  .drow:hover .lead .leadIcon { opacity: 0; }
  .drow:hover .lead .chevron { opacity: 1; }
  .action:hover { background: var(--hover); color: var(--label-secondary); }
  .add:hover:not(:disabled) { background: var(--hover-solid); }
  .send:hover:not(:disabled) { background: var(--info-hover); }
  .send[data-mode='stop']:hover { background: var(--primary-hover); }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn.reject:hover:not(:disabled), .btn.danger:hover:not(:disabled) { background: var(--hover-danger); color: var(--error); }
  .moreRow:hover, .settingsNav button:hover { background: var(--hover); }
  .fileRow:hover { background: var(--hover); }
  .rbTab:hover { background: var(--hover); color: var(--label-primary); }
  .themeCard:hover { background: var(--hover-solid); }
  .prow:hover { background: var(--hover); }
  .menuRow:hover { background: var(--hover); }
  .dirRow:hover { background: var(--hover); }
  .presetCard:hover { background: var(--hover-solid); }
  .pickRow:hover { background: var(--hover); }
  .codeBanner button:hover { color: var(--label-primary); }
}
.disclosure[data-open] .drow .lead .leadIcon { opacity: 0; }
.disclosure[data-open] .drow .lead .chevron { opacity: 1; }

@media (max-width: 760px) {
  .frame, .frame[data-collapsed], .frame[data-rightbar], .frame[data-collapsed][data-rightbar] { grid-template-columns: minmax(0, 1fr) 0px; }
  .rightbar { position: fixed; inset: 0 0 0 auto; width: min(420px, 100vw); z-index: 35; box-shadow: 0 0 40px rgba(0, 0, 0, 0.2); }
  .rbHandle { display: none; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-100%); visibility: hidden; transition: transform 0.25s var(--ease), visibility 0s 0.25s; }
  .frame[data-drawer] .sidebar { transform: none; visibility: visible; transition: transform 0.25s var(--ease); box-shadow: 0 0 40px rgba(0, 0, 0, 0.12); }
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.24); }
  .frame[data-drawer] .scrim { display: block; }
  .openSidebar { display: inline-flex !important; }
  .collapseSidebar { display: none; }
  .conversation { --chat-width: calc(100% - 32px); }
  .column { padding-left: 0; padding-right: 0; }
  .composerSeat { padding: 0 8px 8px; }
  .headline { font-size: 22px; line-height: 28px; }
  .page { padding: 0 16px 32px; }
  .bubble { max-width: 88%; }
  .field { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .fieldLabel { line-height: 20px; }
  .form { padding: 14px; }
  .menu, .menu.left { right: 0; left: 0; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { headers: { 'content-type': 'application/json' }, ...opts });
  if (!res.ok && res.status !== 204) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch { /* non-JSON error body */ }
    const err = new Error(detail); err.status = res.status; throw err;
  }
  return res;
}

/* ---------- running indicator ---------- */
let runningEl = null;
function showRunning(on) {
  if (on && !runningEl) {
    runningEl = document.createElement('div'); runningEl.className = 'running';
    runningEl.innerHTML = `${icon('spinner', 'ico spin')}<span class="shimmer">${esc(T.thinking)}</span>`;
  }
  if (on) log().appendChild(runningEl); else if (runningEl) runningEl.remove();
}

/* ---------- streaming ---------- */
async function consume(res) {
  state.streaming = true; updateComposer();
  showRunning(true); scrollToEnd(true);
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = '', ai = null, reasoning = null, restart = false, frame = 0;
  const repaint = () => {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      if (ai) ai.querySelector('.md').innerHTML = markdown(ai._raw);
      if (reasoning) reasoning.querySelector('.reasoningBody').innerHTML = markdown(reasoning._raw);
      showRunning(true); scrollToEnd();
    });
  };
  try {
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
        if (!chunk.startsWith('data: ')) continue;
        const ev = JSON.parse(chunk.slice(6));
        emitPlugin('run', ev);
        switch (ev.type) {
          case 'reasoning':
            if (!reasoning) { reasoning = addReasoning(''); ai = null; }
            reasoning._raw += ev.text; repaint(); break;
          case 'token':
            if (!ai) ai = addAI('');
            ai._raw += ev.text; repaint(); break;
          case 'image':
            if (!ai) ai = addAI('');
            addImages(ai, [ev.url]); scrollToEnd(); break;
          case 'tool_call': {
            ai = null; reasoning = null;
            if (!findTool(ev.id)) addTool(ev);
            showRunning(true); scrollToEnd(); break;
          }
          case 'tool_result':
            ai = null; reasoning = null;
            finishTool(findTool(ev.id) || addTool({ id: ev.id, name: ev.name, args: {} }), ev);
            showRunning(true); scrollToEnd(); break;
          case 'interrupt': renderApproval(ev.interrupts); break;
          case 'error': addLine(ev.message, 'error'); break;
          case 'done':
            restart = ev.restart_pending;
            if (ev.outcome === 'cancelled') addLine(T.cancelled);
            break;
        }
      }
    }
  } catch (err) {
    if (!restart) addLine(err.message, 'error');
  } finally {
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    if (ai) ai.querySelector('.md').innerHTML = markdown(ai._raw);
    if (reasoning) reasoning.querySelector('.reasoningBody').innerHTML = markdown(reasoning._raw);
    showRunning(false); markLast();
    state.streaming = false; updateComposer(); refreshSessions();
    if (restart) waitForRestart();
  }
}
async function attach() {
  const id = state.current;
  const res = await api(`/sessions/${id}/stream`);
  if (res.status === 200 && state.current === id) await consume(res);
}

/* ---------- approvals ---------- */
function renderApproval(interrupts) {
  const box = $('approval'); box.innerHTML = '';
  const reqs = (interrupts || []).flatMap((i) => (i.value && i.value.action_requests) || []);
  state.pending = reqs.length > 0; updateComposer();
  // Calls under this decision: tool rows without a result.
  log().querySelectorAll('.tool .drow[data-state="running"], .tool .drow[data-state="waiting"]').forEach((row) => {
    row.dataset.state = reqs.length ? 'waiting' : 'running';
    row.querySelector('.leadIcon').innerHTML = reqs.length ? icon('alert') : icon('spinner', 'ico spin');
  });
  if (!reqs.length) return;
  const card = document.createElement('div'); card.className = 'approval';
  const desc = reqs.map((r) => r.description || '').find((d) => d && !/^Tool execution requires approval/.test(d));
  card.innerHTML = `<div class="strip">${icon('alert')}<span>${esc(T.approvalStrip)}</span></div>
    <div class="body"><div class="headline2">${esc(reqs.length === 1 ? T.approvalOne : T.approvalMany(reqs.length))}</div>
    ${desc ? `<p class="description">${esc(desc.split('\n')[0])}</p>` : ''}
    ${reqs.map((r) => `<div class="command">${esc(r.name)} ${esc(JSON.stringify(r.args))}</div>`).join('')}</div>
    <div class="actionRow"><button class="btn outline reject" type="button">${esc(T.reject)}</button><button class="btn primary" type="button">${esc(T.approve)}</button></div>`;
  card.querySelector('.reject').onclick = () => decide(reqs.map(() => ({ type: 'reject' })));
  card.querySelector('.primary').onclick = () => decide(reqs.map(() => ({ type: 'approve' })));
  box.appendChild(card);
  requestAnimationFrame(() => scrollToEnd(true));
}
async function decide(decisions) {
  renderApproval([]);
  try { await consume(await api(`/sessions/${state.current}/approvals`, { method: 'POST', body: JSON.stringify({ decisions }) })); }
  catch (err) { addLine(err.message, 'error'); updateComposer(); }
}

/* ---------- restart hand-off ---------- */
async function waitForRestart() {
  const before = state.generation; const notice = $('notice');
  notice.innerHTML = `${icon('spinner', 'ico spin')}<span>${esc(T.restarting)}</span>`; notice.hidden = false;
  for (let i = 0; i < 240; i++) {
    await sleep(1000);
    const h = await refreshHealth();
    if (h && h.generation !== before) {
      notice.innerHTML = `${icon('check')}<span>${esc(T.restarted(h.generation))}</span>`;
      setTimeout(() => { notice.hidden = true; }, 4000);
      loadPluginCount();
      if (state.current) {
        for (let j = 0; j < 20; j++) {
          const s = await json('/sessions/' + state.current);
          if (s.busy) break;
          await sleep(400);
        }
        await openSession(state.current);
      }
      return h;
    }
  }
  notice.innerHTML = `${icon('alert')}<span>${esc(T.restartFailed)}</span>`;
  return null;
}

/* ---------- composer ---------- */
const input = $('input');
const MAX_IMAGES = 8, MAX_IMAGE_BYTES = 8 * 1024 * 1024, MAX_IMAGE_SIDE = 2048;
const attachments = [];
function renderAttachments() {
  const strip = $('attachStrip');
  strip.innerHTML = attachments.map((a, i) => `<span class="attachThumb"><img src="${a.url}" alt=""><button type="button" data-remove="${i}" title="${esc(T.removeImage)}" aria-label="${esc(T.removeImage)}">${icon('x')}</button></span>`).join('');
  updateComposer();
}
$('attachStrip').onclick = (e) => { const b = e.target.closest('[data-remove]'); if (b) { attachments.splice(+b.dataset.remove, 1); renderAttachments(); input.focus(); } };
function modelAcceptsImages() {
  const spec = currentSpec();
  for (const g of state.directory?.groups || []) for (const m of g.models) if (m.spec === spec) return !m.input || m.input.includes('image');
  return true;  // unknown catalog: the server decides
}
async function addImageFile(file) {
  if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) { toast(T.notAnImage); return; }
  if (attachments.length >= MAX_IMAGES) { toast(T.tooManyImages(MAX_IMAGES)); return; }
  if (!modelAcceptsImages()) { toast(T.modelNoImages(specLabel(currentSpec()).name)); return; }
  let url;
  try { url = await encodeImage(file); } catch { toast(T.notAnImage); return; }
  if (url.length * 3 / 4 > MAX_IMAGE_BYTES) { toast(T.imageTooLarge); return; }
  attachments.push({ url, name: file.name || 'image' }); renderAttachments();
}
function encodeImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const src = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(src);
      const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      if (scale === 1 && file.type !== 'image/webp' && file.size <= MAX_IMAGE_BYTES) {
        const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale); canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('decode')); };
    img.src = src;
  });
}
async function addImageFiles(files) { for (const f of files) await addImageFile(f); }
$('attachButton').onclick = () => $('fileInput').click();
$('fileInput').onchange = async (e) => { await addImageFiles([...e.target.files]); e.target.value = ''; input.focus(); };
input.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.items || [])].filter((it) => it.kind === 'file' && it.type.startsWith('image/')).map((it) => it.getAsFile()).filter(Boolean);
  if (!files.length) return;
  e.preventDefault(); addImageFiles(files);
});
for (const ev of ['dragenter', 'dragover']) $('composer').addEventListener(ev, (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); $('composer').dataset.dragover = ''; } });
for (const ev of ['dragleave', 'drop']) $('composer').addEventListener(ev, (e) => { delete $('composer').dataset.dragover; if (ev === 'drop') { e.preventDefault(); addImageFiles([...(e.dataTransfer?.files || [])].filter((f) => f.type.startsWith('image/'))); } });
function updateComposer() {
  const send = $('send');
  if (state.streaming) {
    send.dataset.mode = 'stop'; send.disabled = false; send.innerHTML = icon('stop'); send.title = T.stop;
    input.placeholder = T.placeholderBusy;
  } else {
    delete send.dataset.mode; send.innerHTML = icon('arrow-up'); send.title = T.send;

}
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 336) + 'px'; }
input.addEventListener('input', () => { autosize(); updateComposer(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); }
});
$('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (state.streaming) { if (state.current) api(`/sessions/${state.current}/cancel`, { method: 'POST' }).catch(() => {}); return; }
  const text = input.value.trim(); const images = attachments.map((a) => a.url);
  if (!text && !images.length) return;
  if (state.pending) { toast(T.approvalPending); return; }
  if (!state.current) {
    let s;
    try { s = await json('/sessions', { method: 'POST', body: JSON.stringify({ title: (text || attachments[0].name).slice(0, 60), model: state.sessionModel, workspace: state.sessionWorkspace, mode: state.sessionMode, preset: state.sessionPreset }) }); } catch (err) { toast(err.message); return; }
    state.current = s.id; state.session = s; log().innerHTML = ''; renderSessionChips();

  catch (err) { addLine(err.status === 409 ? T.busy : err.message, 'error'); state.streaming = false; updateComposer(); }

/* ---------- plugins page ---------- */
const STATE_TAG = { active: ['success', 'running'], pending: ['warning', 'pending'], disabled: ['quiet', 'disabled'], failed: ['danger', 'failed'], stopped: ['quiet', 'stopped'] };
function entryGlyph(e) {
  const n = e.name || '';
  if (/llm/.test(n)) return 'bulb';
  if (/tools|inspect/.test(n)) return 'tool';
  if (/checkpoint|store/.test(n)) return 'box';
  if (/workspace/.test(n)) return 'folder';
  if (/http|api|web-ui/.test(n)) return 'terminal';
  if (/plugin-manager/.test(n)) return 'plug';
  if (/agent/.test(n)) return 'branch';
  return 'plug';
}
async function loadPluginCount() {
  try { const d = await json('/plugins'); $('pluginCount').textContent = d.entries.filter((e) => e.state === 'active').length; return d; } catch { return null; }
}
function entryCards(d) {
  return d.entries.map((e) => {
    const [tone, key] = STATE_TAG[e.state] || ['outline', e.state];

    const picked = await pickModels(r.models, new Set(dr.models.map((m) => m.id)));
    if (!picked) return;
    for (const m of picked) if (!dr.models.some((x) => x.id === m.id)) dr.models.push({ id: m.id, name: m.name !== m.id ? m.name : '', context_window: m.context_window || null, max_tokens: m.max_tokens || null, input: m.input && m.input.length ? m.input : ['text'] });
    rerenderRows(f); showEditorResult(f, 'ok', T.modelsFound(r.models.length));
  } catch (err) { showEditorResult(f, 'error', err.message); }
  finally { setEditorBusy(f, false); }
}
async function testDraft(f) {
  const dr = models.draft; const id = routeIdOf(dr, f); if (!id) return;
  const model = (dr.models.find((m) => m.id.trim()) || {}).id;
  if (!model) { showEditorResult(f, 'error', T.needModel); return; }
  setEditorBusy(f, true); showEditorResult(f, '', T.testing, true);
  try {
    const r = await json(`/settings/models/${encodeURIComponent(id)}/test`, { method: 'POST', body: JSON.stringify({ ...draftPayload(dr, false), model: model.trim() }) });
    showEditorResult(f, r.ok ? 'ok' : 'error', r.ok ? `${T.testOk(r.latency_ms)} · ${model} · ${r.reply}` : r.error);
  } catch (err) { showEditorResult(f, 'error', err.message); }
  finally { setEditorBusy(f, false); }
}
async function applyDraft(f) {
  const dr = models.draft; const id = routeIdOf(dr, f); if (!id) return;
  if (dr.mode !== 'route' && routeById(id)) { showEditorResult(f, 'error', T.dupId); return; }
  if (dr.mode === 'custom' && !dr.base_url.trim()) { showEditorResult(f, 'error', T.needUrl); return; }
  const ids = dr.models.map((m) => m.id.trim()).filter(Boolean);
  if (dr.mode === 'custom' && !ids.length) { showEditorResult(f, 'error', T.needModel); return; }
  dr.models = dr.models.filter((m) => m.id.trim());
  setEditorBusy(f, true); showEditorResult(f, '', T.applying, true);
  try {
    models.data = await json(`/settings/models/${encodeURIComponent(id)}`, { method: 'PUT', body: JSON.stringify(draftPayload(dr)) });
    models.open = null; models.draft = null; renderModels(); toast(T.applied); loadDirectory();
  } catch (err) { showEditorResult(f, 'error', err.message); setEditorBusy(f, false); }
}
async function removeRoute(r) {
  if (!(await confirmDialog(T.removeConfirm(r.title), T.remove, T.remove))) return;
  try { models.data = await json(`/settings/models/${encodeURIComponent(r.id)}`, { method: 'DELETE' }); models.open = null; models.draft = null; renderModels(); toast(T.removed); loadDirectory(); }
  catch (err) { toast(err.message); }
}
function modal(inner) {
  const el = document.createElement('div'); el.className = 'modal'; el.innerHTML = `<div class="modalCard" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.appendChild(el); return el;
}
function confirmDialog(text, label, title) {
  return new Promise((resolve) => {
    const el = modal(`${title ? `<div class="modalHead">${esc(title)}</div>` : ''}<div class="modalBody"><p>${esc(text)}</p></div><div class="modalFoot"><span class="spacer"></span><button type="button" class="btn outline" data-no>${esc(T.cancel)}</button><button type="button" class="btn outline danger" data-yes>${esc(label || T.remove)}</button></div>`);
    el.querySelector('.modalCard').classList.add('narrow');
    const done = (v) => { el.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey, true);
    el.querySelector('[data-no]').onclick = () => done(false); el.querySelector('[data-yes]').onclick = () => done(true);
    el.onclick = (e) => { if (e.target === el) done(false); };
    el.querySelector('[data-yes]').focus();
  });
}
function pickModels(candidates, existing) {
  return new Promise((resolve) => {
    const chosen = new Set();
    const el = modal(`<div class="modalHead">${esc(T.pickTitle)}</div><div class="modalBody"><input class="input pickSearch" data-search placeholder="${esc(T.pickSearch)}" autocomplete="off"><div data-list></div></div>
      <div class="modalFoot"><button type="button" class="btn outline sm" data-all>${esc(T.selectAll)}</button><button type="button" class="btn outline sm" data-none>${esc(T.deselectAll)}</button><span class="count" data-count></span><span class="spacer"></span><button type="button" class="btn outline" data-cancel>${esc(T.cancel)}</button><button type="button" class="btn primary" data-add disabled>${esc(T.addSelected)}</button></div>`);
    const list = el.querySelector('[data-list]'); const search = el.querySelector('[data-search]');
    const visible = () => { const q = search.value.trim().toLowerCase(); return candidates.filter((m) => !q || m.id.toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q)); };
    const render = () => {
      const rows = visible();
      list.innerHTML = rows.length ? rows.map((m) => `<label class="pickRow"><input type="checkbox" data-id="${esc(m.id)}" ${chosen.has(m.id) ? 'checked' : ''} ${existing.has(m.id) ? 'disabled checked' : ''}><span class="mono" title="${esc(m.id)}">${esc(m.id)}</span>${m.input && m.input.includes('image') ? `<span class="tag" data-tone="outline">${esc(T.inputImage)}</span>` : ''}${m.name && m.name !== m.id ? `<span class="sub" title="${esc(m.name)}">${esc(m.name)}</span>` : ''}</label>`).join('') : `<div class="emptyNote">${esc(T.noMatch)}</div>`;
      el.querySelector('[data-count]').textContent = T.selected(chosen.size); el.querySelector('[data-add]').disabled = !chosen.size;
    };
    const done = (v) => { el.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey, true);
    list.onchange = (e) => { const cb = e.target.closest('[data-id]'); if (!cb) return; if (cb.checked) chosen.add(cb.dataset.id); else chosen.delete(cb.dataset.id); render(); };
    search.oninput = render;
    el.querySelector('[data-all]').onclick = () => { for (const m of visible()) if (!existing.has(m.id)) chosen.add(m.id); render(); };
    el.querySelector('[data-none]').onclick = () => { chosen.clear(); render(); };
    el.querySelector('[data-cancel]').onclick = () => done(null);
    el.querySelector('[data-add]').onclick = () => done(candidates.filter((m) => chosen.has(m.id)));
    el.onclick = (e) => { if (e.target === el) done(null); };
    render(); search.focus();
  });
}

/* ---------- boot ---------- */
(async () => {
  setPhase('hero'); updateComposer();
  await refreshHealth(); await refreshSessions(); loadPluginCount(); loadDirectory(); loadAgentOptions();
  await loadClientModules(); renderDock(); renderRightbar();
  input.focus();
  setInterval(() => { if (!state.streaming) refreshSessions(); }, 15000);
})();
})();
