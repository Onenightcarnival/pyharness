[project]
name = "pyharness-compaction"
version = "0.1.0"
description = "pyharness plugin: context compaction — a checkpoint summary replaces older history"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-core", "pyharness-agent-loop-deepagents", "pyharness-llm", "langchain>=1.0", "langchain-core>=1.0", "langgraph>=1.0"]

[project.entry-points."pyharness.plugins"]
pyharness-compaction = "pyharness_compaction:CompactionService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyharness_compaction"]
