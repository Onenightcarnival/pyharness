[project]
name = "pyxis-harness-compaction"
version = "0.1.0"
description = "PyxisHarness plugin: context compaction — a checkpoint summary replaces older history"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyxis-harness-core==0.1.0",
    "pyxis-harness-agent-loop-deepagents==0.1.0",
    "pyxis-harness-llm==0.1.0",
    "langchain==1.4.7",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
]

[project.entry-points."pyharness.plugins"]
pyxis-harness-compaction = "pyharness_compaction:CompactionService"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness_compaction"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pyharness_compaction/AGENTS.md"
