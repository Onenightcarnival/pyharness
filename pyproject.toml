[project]
name = "pyharness-monorepo"
version = "0.1.0"
description = "pyharness workspace: kernel and kernel plugins"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-agent", "pyharness-agent-loop-deepagents", "pyharness-api", "pyharness-ask-user", "pyharness-bundle-base", "pyharness-bundle-creator", "pyharness-bundle-toolkit", "pyharness-bundle-web", "pyharness-checkpoint-postgres", "pyharness-checkpoint-sqlite", "pyharness-compaction", "pyharness-config-center", "pyharness-core", "pyharness-http", "pyharness-inspect", "pyharness-llm", "pyharness-mcp", "pyharness-memory", "pyharness-otel", "pyharness-plugin-manager", "pyharness-terminal", "pyharness-prompt", "pyharness-rdb", "pyharness-s3", "pyharness-tools", "pyharness-web-tools", "pyharness-web-ui", "pyharness-workspace", "pyharness-workspace-changes"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pip", "ruff>=0.14"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pyharness-agent = { workspace = true }
pyharness-agent-loop-deepagents = { workspace = true }
pyharness-api = { workspace = true }
pyharness-bundle-base = { workspace = true }
pyharness-bundle-creator = { workspace = true }
pyharness-checkpoint-postgres = { workspace = true }
pyharness-checkpoint-sqlite = { workspace = true }
pyharness-core = { workspace = true }
pyharness-http = { workspace = true }
pyharness-inspect = { workspace = true }
pyharness-llm = { workspace = true }
pyharness-mcp = { workspace = true }
pyharness-memory = { workspace = true }
pyharness-otel = { workspace = true }
pyharness-compaction = { workspace = true }
pyharness-config-center = { workspace = true }
pyharness-ask-user = { workspace = true }
pyharness-terminal = { workspace = true }
pyharness-web-tools = { workspace = true }
pyharness-bundle-toolkit = { workspace = true }
pyharness-bundle-web = { workspace = true }
pyharness-plugin-manager = { workspace = true }
pyharness-prompt = { workspace = true }
pyharness-rdb = { workspace = true }
pyharness-s3 = { workspace = true }
pyharness-tools = { workspace = true }
pyharness-web-ui = { workspace = true }
pyharness-workspace = { workspace = true }
pyharness-workspace-changes = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv", "examples/pyharness-audit/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["pyharness", "testkit"]
