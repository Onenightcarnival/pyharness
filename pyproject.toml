[project]
name = "pyharness-monorepo"
version = "0.1.0"
description = "pyharness workspace: kernel and kernel plugins"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyharness-agent", "pyharness-agent-loop-deepagents", "pyharness-api", "pyharness-ask-user", "pyharness-bundle-base", "pyharness-bundle-creator", "pyharness-bundle-toolkit", "pyharness-bundle-web", "pyharness-checkpoint-postgres", "pyharness-checkpoint-sqlite", "pyharness-compaction", "pyharness-config-center", "pyharness-core", "pyharness-gateway", "pyharness-http", "pyharness-http-client", "pyharness-inspect", "pyharness-llm", "pyharness-mcp", "pyharness-memory", "pyharness-otel", "pyharness-plugin-manager", "pyharness-terminal", "pyharness-prompt", "pyharness-rdb", "pyharness-s3", "pyharness-subscriptions", "pyharness-tools", "pyharness-web-tools", "pyharness-web-ui", "pyharness-workspace", "pyharness-workspace-changes"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "httpx==0.28.1", "pip==26.2.2", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pyharness-agent = { workspace = true }
pyharness-agent-loop-deepagents = { workspace = true }
pyharness-api = { workspace = true }
pyharness-bundle-base = { workspace = true }
pyharness-bundle-creator = { workspace = true }
pyharness-checkpoint-postgres = { workspace = true }
pyharness-checkpoint-sqlite = { workspace = true }
pyharness-core = { workspace = true }
pyharness-gateway = { workspace = true }
pyharness-http = { workspace = true }
pyharness-http-client = { workspace = true }
pyharness-inspect = { workspace = true }
pyharness-llm = { workspace = true }
pyharness-mcp = { workspace = true }
pyharness-memory = { workspace = true }
pyharness-otel = { workspace = true }
pyharness-compaction = { workspace = true }
pyharness-config-center = { workspace = true }
pyharness-ask-user = { workspace = true }
pyharness-terminal = { workspace = true }
pyharness-web-tools = { workspace = true }
pyharness-bundle-toolkit = { workspace = true }
pyharness-bundle-web = { workspace = true }
pyharness-plugin-manager = { workspace = true }
pyharness-prompt = { workspace = true }
pyharness-rdb = { workspace = true }
pyharness-s3 = { workspace = true }
pyharness-subscriptions = { workspace = true }
pyharness-tools = { workspace = true }
pyharness-web-ui = { workspace = true }
pyharness-workspace = { workspace = true }
pyharness-workspace-changes = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = [".", "packages/*", "tests"]
target-version = "py312"
extend-exclude = [".venv", "examples/pyharness-audit/build"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
preview = true                          # for the preview rules named in `select`, and only those
explicit-preview-rules = true
select = [
    "E", "F", "W", "I", "UP", "B",      # pycodestyle, pyflakes, isort, pyupgrade, bugbear
    "PLC0415",                          # imports at module top
    "ISC",                              # no implicit or `+` string concatenation
    "RUF022", "RUF012",                 # sorted __all__; ClassVar on mutable class attributes
    "RUF067",                           # __init__.py: imports and dunder assignments only (preview)
    "PLC2801", "PLW3201",               # no direct call of a dunder method; no invented dunder name (preview)
    "PLR1702",                          # at most five nested blocks (preview)
    "S102", "S307",                     # no exec, no eval
    "D213", "D209", "D415",             # docstring shape: summary on the second line, closing quotes on their own
                                        # line (multi-line docstrings), closing punctuation
    "SIM", "PTH", "FURB", "C4", "PIE", "RET", "PERF",
    "PLE", "PLW", "PLC", "PLR",         # pylint; the PLR size metrics are ignored below
    "A",                                # no shadowing of builtins
    "T201",                             # no print outside the CLI
    "TID251",                           # banned APIs
    "G", "LOG",                         # logging calls
    "FAST",                             # FastAPI routes
    "PGH",                              # no blanket `noqa` or `type: ignore`
    "SLF001",                           # no access to another object's private member
    "T10", "RSE", "FLY", "EXE",         # no debugger call; raise without parentheses; f-string over join; shebangs
]
ignore = [
    "B008", "B904", "UP042", "RUF001", "RUF002", "RUF003",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # size metrics, magic values
]

[tool.ruff.lint.per-file-ignores]
"packages/core/pyharness/cli.py" = ["T201"]
"packages/core/pyharness/preflight.py" = ["T201"]
"scripts/*" = ["T201"]
"tests/*" = ["SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["pyharness", "testkit"]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "next"]  # route params; the waterfall listener keyword

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "No type-only import blocks: break the import cycle with a Protocol in the importing module, or move the class to a leaf module."
