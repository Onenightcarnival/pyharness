[project]
name = "pyxis-harness-monorepo"
version = "0.1.1.dev6"
description = "PyxisHarness workspace: kernel and kernel plugins"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyxis-harness", "pyxis-harness-agent", "pyxis-harness-agent-loop-deepagents", "pyxis-harness-api", "pyxis-harness-ask-user", "pyxis-harness-auto-review", "pyxis-harness-bundle-base", "pyxis-harness-bundle-creator", "pyxis-harness-bundle-toolkit", "pyxis-harness-bundle-web", "pyxis-harness-checkpoint-memory", "pyxis-harness-checkpoint-postgres", "pyxis-harness-checkpoint-sqlite", "pyxis-harness-compaction", "pyxis-harness-config-center", "pyxis-harness-core", "pyxis-harness-gateway", "pyxis-harness-http", "pyxis-harness-http-client", "pyxis-harness-inspect", "pyxis-harness-llm", "pyxis-harness-mcp", "pyxis-harness-memory", "pyxis-harness-otel", "pyxis-harness-plugin-manager", "pyxis-harness-terminal", "pyxis-harness-prompt", "pyxis-harness-rdb", "pyxis-harness-s3", "pyxis-harness-subscriptions", "pyxis-harness-tools", "pyxis-harness-web-tools", "pyxis-harness-web-ui", "pyxis-harness-workspace", "pyxis-harness-workspace-changes"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "httpx==0.28.1", "pip==26.2.2", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pyxis-harness = { workspace = true }
pyxis-harness-agent = { workspace = true }
pyxis-harness-agent-loop-deepagents = { workspace = true }
pyxis-harness-api = { workspace = true }
pyxis-harness-bundle-base = { workspace = true }
pyxis-harness-bundle-creator = { workspace = true }
pyxis-harness-checkpoint-memory = { workspace = true }
pyxis-harness-checkpoint-postgres = { workspace = true }
pyxis-harness-checkpoint-sqlite = { workspace = true }
pyxis-harness-core = { workspace = true }
pyxis-harness-gateway = { workspace = true }
pyxis-harness-http = { workspace = true }
pyxis-harness-http-client = { workspace = true }
pyxis-harness-inspect = { workspace = true }
pyxis-harness-llm = { workspace = true }
pyxis-harness-mcp = { workspace = true }
pyxis-harness-memory = { workspace = true }
pyxis-harness-otel = { workspace = true }
pyxis-harness-compaction = { workspace = true }
pyxis-harness-config-center = { workspace = true }
pyxis-harness-ask-user = { workspace = true }
pyxis-harness-auto-review = { workspace = true }
pyxis-harness-terminal = { workspace = true }
pyxis-harness-web-tools = { workspace = true }
pyxis-harness-bundle-toolkit = { workspace = true }
pyxis-harness-bundle-web = { workspace = true }
pyxis-harness-plugin-manager = { workspace = true }
pyxis-harness-prompt = { workspace = true }
pyxis-harness-rdb = { workspace = true }
pyxis-harness-s3 = { workspace = true }
pyxis-harness-subscriptions = { workspace = true }
pyxis-harness-tools = { workspace = true }
pyxis-harness-web-ui = { workspace = true }
pyxis-harness-workspace = { workspace = true }
pyxis-harness-workspace-changes = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = [".", "packages/*", "tests"]
target-version = "py312"
extend-exclude = [".venv", "examples/pyxis-harness-audit/build"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
preview = true                          # for the preview rules named in `select`, and only those
explicit-preview-rules = true
select = [
    "E", "F", "W", "I", "UP", "B",      # pycodestyle, pyflakes, isort, pyupgrade, bugbear
    "PLC0415",                          # imports at module top
    "ISC",                              # no implicit or `+` string concatenation
    "RUF",                              # Ruff's own rules; RUF001-RUF003 are ignored below (Chinese text)
    "RUF067",                           # __init__.py: imports and dunder assignments only (preview)
    "BLE001",                           # a broad `except` is stated: narrowed, or marked `noqa: BLE001`
    "PLC2801", "PLW3201",               # no direct call of a dunder method; no invented dunder name (preview)
    "PLR1702",                          # at most five nested blocks (preview)
    "S102", "S307",                     # no exec, no eval
    "D213", "D209", "D415",             # docstring shape: summary on the second line, closing quotes on their own
                                        # line (multi-line docstrings), closing punctuation
    "SIM", "PTH", "FURB", "C4", "PIE", "RET", "PERF",
    "PLE", "PLW", "PLC", "PLR",         # pylint; the PLR size metrics are ignored below
    "A",                                # no shadowing of builtins
    "T201",                             # no print outside the CLI
    "TID251",                           # banned APIs
    "ASYNC",                            # no blocking call in an async function
    "DTZ",                              # datetimes carry a time zone
    "PLW1514",                          # text files are opened with an explicit encoding (preview)
    "TRY002", "TRY201", "TRY203", "TRY400", "TRY401",  # exception handling: own exception classes, bare re-raise,
                                        # logger.exception in handlers
    "G", "LOG",                         # logging calls
    "FAST",                             # FastAPI routes
    "PGH",                              # no blanket `noqa` or `type: ignore`
    "SLF001",                           # no access to another object's private member
    "T10", "RSE", "FLY", "EXE",         # no debugger call; raise without parentheses; f-string over join; shebangs
]
ignore = [
    "B008", "B904", "UP042", "RUF001", "RUF002", "RUF003",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # size metrics, magic values
    "ASYNC109",                         # a `timeout` parameter of an async function is part of the API here
    "ASYNC240",                         # path metadata calls (resolve, exists, mkdir) are local and fast
]

[tool.ruff.lint.per-file-ignores]
"packages/core/pyxis_harness/cli.py" = ["T201"]
"packages/core/pyxis_harness/preflight.py" = ["T201"]
"scripts/*" = ["T201"]
"tests/*" = ["SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["pyxis_harness", "testkit"]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "next"]  # route params; the waterfall listener keyword

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "No type-only import blocks: break the import cycle with a Protocol in the importing module, or move the class to a leaf module."
