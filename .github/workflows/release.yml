name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      index:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: The tag names the version of the distributions
        if: github.event_name == 'push'
        run: test "v$(uv run python -c 'import pyxis_harness; print(pyxis_harness.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv run pytest -q tests/test_release.py
      - run: uv build --all-packages
      - run: uvx twine check --strict dist/*
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
        run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.index == 'pypi'
        run: uv publish --check-url https://pypi.org/simple/
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
