name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pyh
          POSTGRES_PASSWORD: pyh
          POSTGRES_DB: pyh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pyh -d pyh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYH_TEST_POSTGRES_DSN: postgresql://pyh:pyh@127.0.0.1:5432/pyh_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_postgres.py
